nts and will pay claims if an insurance company becomes insolvent.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"The act of an insurance company publishing misleading information about its policy’s provisions is called","o":["coercion","twisting","intimidation","false advertising"],"a":3,"e":"An insurance company that publishes misleading information about insurance coverage may be found guilty of false advertising.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"Georgia law (Insurance Department and Commissioner). Fill in the blank: New rules must be on file as a public record _____ before going into effect.","o":["7 days","14 days","10 days","20 days"],"a":2,"e":"New rules must be on file as a public record 10 days before going into effect.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Hearings). Fill in the blank: Written notice of hearings to must be provided to those directly involved at least _____ in advance.","o":["7 days","5 days","10 days","20 days"],"a":2,"e":"Written notice of hearings to must be provided to those directly involved at least 10 days in advance.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Hearings). Fill in the blank: Following the end of a hearing, the Commissioner must publish his order within _____ and give copies of the order to everyone given notice of the hearing.","o":["10 days","14 days","15 days","30 days"],"a":3,"e":"Following the end of a hearing, the Commissioner must publish his order within 30 days and give copies of the order to everyone given notice of the hearing.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Enforcement, Civil Actions, Criminal Violations, and Penalties). Fill in the blank: Place any licensee on probation for up to _____ per violation; and","o":["1 year","3 years","4 years","2 years"],"a":0,"e":"Place any licensee on probation for up to one year per violation; and","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Enforcement, Civil Actions, Criminal Violations, and Penalties). Fill in the blank: Impose a monetary penalty on licensees of up to _____ per violation unless the licensee in question knew or reasonably should have known he was committing a violation. The maximum monetary penalty increases to $5,000 per violation in such cases.","o":["$500","$1,000","$250","$2,000"],"a":3,"e":"Impose a monetary penalty on licensees of up to $2,000 per violation unless the licensee in question knew or reasonably should have known he was committing a violation. The maximum monetary penalty increases to $5,000 per violation in such cases.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (The Commissioner’s Actions Subject to Judicial Review). Fill in the blank: Individuals negatively impacted by an order of the Commissioner may appeal to the Superior Court of Fulton County for relief. Parties negatively affected by the failure of the Commissioner may also appeal. Parties seeking relief must file for judicial review within _____ of the Commissioner’s order or other decision.","o":["45 days","30 days","14 days","20 days"],"a":1,"e":"Individuals negatively impacted by an order of the Commissioner may appeal to the Superior Court of Fulton County for relief. Parties negatively affected by the failure of the Commissioner may also appeal. Parties seeking relief must file for judicial review within 30 days of the Commissioner’s order or other decision.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Examination OF RECORDS). Fill in the blank: The Commissioner must examine domestic insurers at least once every _____.","o":["4 years","5 years","2 years","6 years"],"a":1,"e":"The Commissioner must examine domestic insurers at least once every 5 years.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Examination OF RECORDS). Fill in the blank: The Commissioner may make a full written report of the facts uncovered in each examination, which when certified by the Commissioner become admissible into evidence in any departmental proceeding. The Commissioner must provide the person examined with a copy of the report at least _____ before it.","o":["20 days","7 days","30 days","14 days"],"a":0,"e":"The Commissioner may make a full written report of the facts uncovered in each examination, which when certified by the Commissioner become admissible into evidence in any departmental proceeding. The Commissioner must provide the person examined with a copy of the report at least 20 days before it.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Power of Commissioner to investigate unfair or deceptive acts or practices (Investigations/Notice and hearings)). Fill in the blank: Whenever the Commissioner reasonably believes that someone is engaged in an unfair method of competition, and that a hearing would be in the public interest, he must serve the parties involved with a notice of a hearing on the charges at least _____ in advance (rather than the 10-day notice required generally).","o":["14 days","15 days","7 days","5 days"],"a":1,"e":"Whenever the Commissioner reasonably believes that someone is engaged in an unfair method of competition, and that a hearing would be in the public interest, he must serve the parties involved with a notice of a hearing on the charges at least 15 days in advance (rather than the 10-day notice required generally).","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Penalties). Fill in the blank: A maximum fine of _____ per violation, increasing to $5,000 per act if the person knew or reasonably should have known he was violating this article,","o":["$100","$2,500","$1,000","$250"],"a":2,"e":"A maximum fine of $1,000 per violation, increasing to $5,000 per act if the person knew or reasonably should have known he was violating this article,","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Certificate of Authority Requirements (To issue and renew, deny, revoke, or refuse to renew, and mandatory reports)). Fill in the blank: The Commissioner may also impose a _____ penalty per code violation, increased to $5,000 if the offense is willful.","o":["$250","$500","$100","$1,000"],"a":3,"e":"The Commissioner may also impose a $1,000 penalty per code violation, increased to $5,000 if the offense is willful.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Records). Fill in the blank: All licensees must maintain a record of their transactions at their listed place of business for _____ following the transaction or the term of the contract procured, whichever is later. Agent records must include the following:","o":["2 years","6 years","7 years","5 years"],"a":3,"e":"All licensees must maintain a record of their transactions at their listed place of business for 5 years following the transaction or the term of the contract procured, whichever is later. Agent records must include the following:","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Reporting). Fill in the blank: Agents must report the premiums due for any policy—which appear in the contract—to the insurer. The willful failure to do so is a misdemeanor. If the amount involved exceeds _____, the violation is a felony.","o":["$250","$1,000","$2,500","$2,000"],"a":1,"e":"Agents must report the premiums due for any policy—which appear in the contract—to the insurer. The willful failure to do so is a misdemeanor. If the amount involved exceeds $1,000.00, the violation is a felony.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (General Qualifications and Requirements for a License). Fill in the blank: Be a resident of Georgia at least _____ out of every year.","o":["6 months","9 months","1 month","2 months"],"a":0,"e":"Be a resident of Georgia at least 6 months out of every year.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Examinations). Fill in the blank: The passing grade on licensing exams is seventy percent (70%). Once they pass, candidates have _____ to get their license. Candidates that fail the exam must wait two weeks to retake it. After three unsuccessful attempts, the candidate must retake their approved prelicensing course before trying again.","o":["2 months","3 months","12 months","9 months"],"a":2,"e":"The passing grade on licensing exams is seventy percent (70%). Once they pass, candidates have 12 months to get their license. Candidates that fail the exam must wait two weeks to retake it. After three unsuccessful attempts, the candidate must retake their approved prelicensing course before trying again.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Continuing education, Rule 120-2-3.15). Fill in the blank: Agents licensed UNDER _____ must complete 24 hours of continuing education every 2 years to keep their license active. 3 of these hours must be in ethics.","o":["6 years","7 years","20 years","4 years"],"a":2,"e":"Agents licensed UNDER 20 YEARS must complete 24 hours of continuing education every 2 years to keep their license active. 3 of these hours must be in ethics.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Continuing education, Rule 120-2-3.15). Fill in the blank: Agents licensed _____ OR MORE must complete 20 hours of continuing education every 2 years to keep their license active, 3 of which must be in ethics.","o":["20 years","10 years","5 years","6 years"],"a":0,"e":"Agents licensed 20 YEARS OR MORE must complete 20 hours of continuing education every 2 years to keep their license active, 3 of which must be in ethics.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Reinstatement and renewal). Fill in the blank: Insurance licenses renew biennially, expiring on the last day of the licensee’s birth month. Agents who allow their licenses to lapse may reinstate those licenses within _____ from the renewal date without retaking the state licensing exam.","o":["2 months","3 months","12 months","6 months"],"a":2,"e":"Insurance licenses renew biennially, expiring on the last day of the licensee’s birth month. Agents who allow their licenses to lapse may reinstate those licenses within 12 months from the renewal date without retaking the state licensing exam.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Agent appointments (Certificates of Authority)). Fill in the blank: An insurer that terminates an agent appointment must notify the Commissioner within _____ of the date of termination when it takes this action in response to agent activities that themselves grounds for license revocation, suspension, or refusal.","o":["30 days","10 days","15 days","14 days"],"a":0,"e":"An insurer that terminates an agent appointment must notify the Commissioner within 30 days of the date of termination when it takes this action in response to agent activities that themselves grounds for license revocation, suspension, or refusal.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (License Revocation, Suspension, Denial, or Refusal to Renew, REF. 33-23-21 through 23). Fill in the blank: Anyone whose application or license has been refused or revoked must wait at least _____ before re-applying.","o":["7 years","3 years","5 years","4 years"],"a":2,"e":"Anyone whose application or license has been refused or revoked must wait at least 5 years before re-applying.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Temporary Licenses, REF: 33-23-13). Fill in the blank: These temporary licenses have an initial term of _____.","o":["2 months","6 months","9 months","3 months"],"a":1,"e":"These temporary licenses have an initial term of 6 months.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Fraud). Fill in the blank: Anyone convicted of insurance fraud is guilty of a felony. The maximum penalty per violation is up to _____ in prison, a fine of up to $10,000, or both.","o":["5 years","10 years","3 years","6 years"],"a":1,"e":"Anyone convicted of insurance fraud is guilty of a felony. The maximum penalty per violation is up to 10 years in prison, a fine of up to $10,000, or both.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (LIFE INSURANCE POLICY PROVISIONS [REF: 33-25-1 THROUGH 12]). Fill in the blank: Grace Period, Ref: 33-25-3: The required grace period for life insurance policies in Georgia is _____.","o":["30 days","45 days","14 days","20 days"],"a":0,"e":"Grace Period, Ref: 33-25-3: The required grace period for life insurance policies in Georgia is 30 days.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (LIFE INSURANCE POLICY PROVISIONS [REF: 33-25-1 THROUGH 12]). Fill in the blank: Incontestability, Ref: 33-25-3: The Incontestability provision states that policy terms are incontestable after the contract is in force for _____ from its date of issue.","o":["5 years","2 years","6 years","1 year"],"a":1,"e":"Incontestability, Ref: 33-25-3: The Incontestability provision states that policy terms are incontestable after the contract is in force for 2 years from its date of issue.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (LIFE INSURANCE POLICY PROVISIONS [REF: 33-25-1 THROUGH 12]). Fill in the blank: Policy Loan, Ref: 33-25-3: Policy Loans are available after _____ on cash value policies and will not cause a policy to lapse until it exceeds the cash surrender value. Insurers issuing loans have the right to delay them up to 6 months.","o":["3 years","5 years","2 years","1 year"],"a":0,"e":"Policy Loan, Ref: 33-25-3: Policy Loans are available after three years on cash value policies and will not cause a policy to lapse until it exceeds the cash surrender value. Insurers issuing loans have the right to delay them up to 6 months.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (LIFE INSURANCE POLICY PROVISIONS [REF: 33-25-1 THROUGH 12]). Fill in the blank: Reinstatement, Ref: 33-25-3: If all back premiums are paid with interest, a lapsed policy may be reinstated within _____ from the due date upon evidence of insurability.","o":["5 years","6 years","4 years","3 years"],"a":3,"e":"Reinstatement, Ref: 33-25-3: If all back premiums are paid with interest, a lapsed policy may be reinstated within 3 years from the due date upon evidence of insurability.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (LIFE INSURANCE POLICY PROVISIONS [REF: 33-25-1 THROUGH 12]). Fill in the blank: Interest on Insurance Proceeds, Ref: 33-25-10: Interest on benefits of a life insurance policy shall begin to accrue _____ from the date of receipt of proof of death by the insurer.","o":["20 days","30 days","14 days","15 days"],"a":1,"e":"Interest on Insurance Proceeds, Ref: 33-25-10: Interest on benefits of a life insurance policy shall begin to accrue 30 days from the date of receipt of proof of death by the insurer.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (LIFE INSURANCE POLICY PROVISIONS [REF: 33-25-1 THROUGH 12]). Fill in the blank: Payment of Claims, Ref: 33-25-3: Insurers must pay claims immediately following the acceptance of proof of loss, but in no case later than _____ after proof is received if stated in the policy.","o":["30 days","15 days","60 days","45 days"],"a":2,"e":"Payment of Claims, Ref: 33-25-3: Insurers must pay claims immediately following the acceptance of proof of loss, but in no case later than 60 days after proof is received if stated in the policy.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (LIFE INSURANCE POLICY PROVISIONS [REF: 33-25-1 THROUGH 12]). Fill in the blank: Required Nonforfeiture Provisions, Ref: 33-25-4: After _____, cash value policies must provide for nonforfeiture benefits payable no later than 60 days following a policy lapse, which may consist of some form of paid-up benefit or cash surrender","o":["5 years","3 years","1 year","6 years"],"a":1,"e":"Required Nonforfeiture Provisions, Ref: 33-25-4: After three years, cash value policies must provide for nonforfeiture benefits payable no later than 60 days following a policy lapse, which may consist of some form of paid-up benefit or cash surrender","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (LIFE INSURANCE POLICY PROVISIONS [REF: 33-25-1 THROUGH 12]). Fill in the blank: Death by suicide within _____ of policy issue.","o":["3 years","5 years","1 year","2 years"],"a":3,"e":"Death by suicide within two years of policy issue.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (LIFE INSURANCE ADVERTISEMENTS, RULE 120-2-11). Fill in the blank: Insurers must maintain a complete advertisement file of specimen copies for _____ or until the next regular examination of the insurer, whichever is later. Insurers must also file an annual certificate of compliance with the Insurance Department.","o":["3 years","2 years","6 years","4 years"],"a":3,"e":"Insurers must maintain a complete advertisement file of specimen copies for 4 years or until the next regular examination of the insurer, whichever is later. Insurers must also file an annual certificate of compliance with the Insurance Department.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (General Rules, Rule 120-2-31-.06). Fill in the blank: Insurers must maintain a complete file of all mandated life insurance compliance forms for at least _____ after the date of their last authorized use.","o":["4 years","3 years","5 years","2 years"],"a":1,"e":"Insurers must maintain a complete file of all mandated life insurance compliance forms for at least 3 years after the date of their last authorized use.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Duties of Insurers, REF: RULE 120-2-24-.06). Fill in the blank: Within _____ of receiving the application for a replacement sale, the Replacing Insurer must send the existing insurance companies a written communication advising them of the proposed replacement. It must also send them a copy of the Notice Regarding Replacement.","o":["7 days","3 days","10 days","5 days"],"a":1,"e":"Within 3 working days of receiving the application for a replacement sale, the Replacing Insurer must send the existing insurance companies a written communication advising them of the proposed replacement. It must also send them a copy of the Notice Regarding Replacement.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Duties of Insurers, REF: RULE 120-2-24-.06). Fill in the blank: Maintain at its home office a copy of all forms and records relating to a replacement for at least _____ or the next regular Insurance Department, whichever is later.","o":["3 years","2 years","4 years","1 year"],"a":0,"e":"Maintain at its home office a copy of all forms and records relating to a replacement for at least 3 years or the next regular Insurance Department, whichever is later.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Duties of Insurers, REF: RULE 120-2-24-.06). Fill in the blank: Allow the replacement policy owner to return the policy within _____ after delivery for a full refund.","o":["45 days","14 days","30 days","15 days"],"a":2,"e":"Allow the replacement policy owner to return the policy within 30 days after delivery for a full refund.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Duties of Insurers, REF: RULE 120-2-24-.06). Fill in the blank: The Existing Insurer must send a policy summary for the products being replaced within _____ of receiving written notification from the Replacing Insurer if requested.","o":["14 days","10 days","20 days","15 days"],"a":1,"e":"The Existing Insurer must send a policy summary for the products being replaced within 10 days of receiving written notification from the Replacing Insurer if requested.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Uniform Mandatory Provisions). Fill in the blank: Time Limit on Certain Defenses – In the absence of Fraud, an insurer may not void a policy or deny a claim for misstatements on an application after _____. The NAIC Model sets the time limit at 3 years.","o":["5 years","2 years","4 years","3 years"],"a":1,"e":"Time Limit on Certain Defenses – In the absence of Fraud, an insurer may not void a policy or deny a claim for misstatements on an application after 2 years. The NAIC Model sets the time limit at 3 years.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Uniform Mandatory Provisions). Fill in the blank: Grace Periods – Georgia follows the NAIC Model for weekly and monthly premium grace periods (7 and _____, respectively). The required grace period for policies with longer terms is 30 days, rather than the 31 days stated in the NAIC Model Statute.","o":["7 days","5 days","10 days","15 days"],"a":2,"e":"Grace Periods – Georgia follows the NAIC Model for weekly and monthly premium grace periods (7 and 10 days, respectively). The required grace period for policies with longer terms is 30 days, rather than the 31 days stated in the NAIC Model Statute.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Uniform Mandatory Provisions). Fill in the blank: Claims Forms – The NAIC Model calls for insurers to supply a claim form within _____ of receiving the Notice of Claim from a client. Georgia sets this requirement as 10 working days after receiving a Notice of Claim.","o":["10 days","14 days","15 days","5 days"],"a":2,"e":"Claims Forms – The NAIC Model calls for insurers to supply a claim form within 15 days of receiving the Notice of Claim from a client. Georgia sets this requirement as 10 working days after receiving a Notice of Claim.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Right to Examine (Free Look)). Fill in the blank: After purchasing an individual health insurance contract, a policyowner has _____ from the date of receiving the policy to return it for any reason and receive a full refund.","o":["7 days","20 days","15 days","10 days"],"a":3,"e":"After purchasing an individual health insurance contract, a policyowner has 10 days from the date of receiving the policy to return it for any reason and receive a full refund.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Availability of Coverage When Dependents reach Limiting Age). Fill in the blank: When an insured dependent reaches the limiting age for coverage, that individual has _____ to apply for individual coverage without providing evidence of insurability.","o":["15 days","20 days","60 days","45 days"],"a":3,"e":"When an insured dependent reaches the limiting age for coverage, that individual has 45 days to apply for individual coverage without providing evidence of insurability.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Grace Period). Fill in the blank: The minimum grace period for a group accident and sickness policy is _____.","o":["20 days","30 days","31 days","45 days"],"a":2,"e":"The minimum grace period for a group accident and sickness policy is 31 days.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Group Coverage Discontinuance, Rule 120-2-10-.10). Fill in the blank: When insurers discontinue group health insurance for reasons other than nonpayment, they must mail a notice of discontinuance at least _____ in advance.","o":["15 days","60 days","45 days","90 days"],"a":1,"e":"When insurers discontinue group health insurance for reasons other than nonpayment, they must mail a notice of discontinuance at least 60 days in advance.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Extension of Benefits). Fill in the blank: In the case of \"major medical\" and \"comprehensive medical\" group plans, insurers must extend benefits for ongoing claims at least _____.","o":["12 months","18 months","2 months","3 months"],"a":0,"e":"In the case of \"major medical\" and \"comprehensive medical\" group plans, insurers must extend benefits for ongoing claims at least twelve months.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Extension of Benefits). Fill in the blank: Other hospital or medical expense coverages must provide an extension of at least _____.","o":["60 days","20 days","90 days","30 days"],"a":2,"e":"Other hospital or medical expense coverages must provide an extension of at least ninety days.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Group Health Insurance Conversion Privilege, Rule 120-2-10-.11). Fill in the blank: Participants must be continuously enrolled in their group plan for at least _____ before losing coverage to qualify as eligible for this conversion privilege.","o":["6 months","9 months","2 months","12 months"],"a":0,"e":"Participants must be continuously enrolled in their group plan for at least 6 months before losing coverage to qualify as eligible for this conversion privilege.","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Commissioner’s Responsibilities and Basic Requirements). Fill in the blank: Cannot exclude/limit losses due to pre-existing conditions for more than _____ from policy inception","o":["6 months","3 months","9 months","2 months"],"a":0,"e":"Cannot exclude/limit losses due to pre-existing conditions for more than 6 months from policy inception","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Commissioner’s Responsibilities and Basic Requirements). Fill in the blank: Look-back period for pre-existing conditions cannot exceed _____","o":["3 months","9 months","6 months","1 month"],"a":2,"e":"Look-back period for pre-existing conditions cannot exceed 6 months","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Required Provisions (). Fill in the blank: Pre-existing condition exclusion limited to _____","o":["9 months","6 months","2 months","12 months"],"a":1,"e":"Pre-existing condition exclusion limited to 6 months","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Extension, Conversion, and Continuation (Rule 120-2-16-.06)). Fill in the blank: Conversion: Group LTC plan must allow conversion to individual policy within _____ of losing coverage (if covered 6+ months)","o":["15 days","20 days","14 days","31 days"],"a":3,"e":"Conversion: Group LTC plan must allow conversion to individual policy within 31 days of losing coverage (if covered 6+ months)","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Agent Education Requirements). Fill in the blank: Minimum _____ of approved LTC training in each renewal period","o":["4 hours","2 hours","12 hours","24 hours"],"a":0,"e":"Minimum 4 hours of approved LTC training in each renewal period","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Georgia law (Agent Education Requirements). Fill in the blank: A list of all policies the agent has replaced in the last _____","o":["6 years","3 years","5 years","1 year"],"a":1,"e":"A list of all policies the agent has replaced in the last 3 years","t":"Georgia Insurance Laws & Rules","k":"e","g":1},{"q":"Which term matches this definition? “The Commissioner may call and hold _____ for any purpose deemed necessary.”","o":["Stock Company","Controlled Businesses","Cease and Desist Orders","Hearing"],"a":3,"e":"Hearing: The Commissioner may call and hold hearings for any purpose deemed necessary.","t":"Georgia Insurance Laws & Rules","k":"d","g":1},{"q":"Which term matches this definition? “An individual appointed or employed by an insurer who sells, solicits, or negotiates insurance is an agent. Agent also refers to an individual insurance producer.”","o":["Insurance Producers","Authorized Insurer","Commissions","Mutual Company"],"a":0,"e":"Insurance Producers: An individual appointed or employed by an insurer who sells, solicits, or negotiates insurance is an agent. Agent also refers to an individual insurance producer.","t":"Georgia Insurance Laws & Rules","k":"d","g":1},{"q":"Which term matches this definition? “Controlled business can be defined as policies written on people that the licensed agent has direct influence over:  including family, employers, and/or any company to which the agent has stock control. Obtaining a license for the primary purpose of writing controlled business is prohibited.”","o":["Stock Company","Authorized Insurer","Alien","Controlled Businesses"],"a":3,"e":"Controlled Businesses: Controlled business can be defined as policies written on people that the licensed agent has direct influence over:  including family, employers, and/or any company to which the agent has stock control. Obtaining a license for the primary purpose of writing controlled business is prohibited.","t":"Georgia Insurance Laws & Rules","k":"d","g":1},{"q":"Which term matches this definition? “Agents licensed UNDER 20 YEARS must complete 24 hours of _____ every 2 years to keep their license active. 3 of these hours must be in ethics.”","o":["Nonauthorized Insurer","Continuing Education","Reinstatement","Foreign"],"a":1,"e":"Continuing Education: Agents licensed UNDER 20 YEARS must complete 24 hours of continuing education every 2 years to keep their license active. 3 of these hours must be in ethics.","t":"Georgia Insurance Laws & Rules","k":"d","g":1},{"q":"Which term matches this definition? “The Commissioner may issue a cease-and-desist order to any person found to have committed an unfair or deceptive act.”","o":["Commissioner of Insurance","Continuing Education","Cease and Desist Orders","Commissions"],"a":2,"e":"Cease and Desist Orders: The Commissioner may issue a cease-and-desist order to any person found to have committed an unfair or deceptive act.","t":"Georgia Insurance Laws & Rules","k":"d","g":1},{"q":"Which term matches this definition? “The Insurance Commissioner is the chief officer of the Insurance Department and enforces the insurance laws of this state.”","o":["Insurance Producers","Authorized Insurer","Controlled Businesses","Commissioner of Insurance"],"a":3,"e":"Commissioner of Insurance: The Insurance Commissioner is the chief officer of the Insurance Department and enforces the insurance laws of this state.","t":"Georgia Insurance Laws & Rules","k":"d","g":1},{"q":"Which term matches this definition? “An insurance company that is owned and controlled by stockholders. The stockholders provide the capital and share in profits or losses.”","o":["Alien","Authorized Insurer","Insurance Producers","Stock Company"],"a":3,"e":"Stock Company: An insurance company that is owned and controlled by stockholders. The stockholders provide the capital and share in profits or losses.","t":"Georgia Insurance Laws & Rules","k":"d","g":1},{"q":"Which term matches this definition? “Mutual insurance companies are considered participating because the policyowners do share in the profits of the company.”","o":["Stock Company","Foreign","Mutual Company","Domestic"],"a":2,"e":"Mutual Company: Mutual insurance companies are considered participating because the policyowners do share in the profits of the company.","t":"Georgia Insurance Laws & Rules","k":"d","g":1},{"q":"Which term matches this definition? “A company that resides and is incorporated under the laws of the state in which its home office is located.”","o":["Domestic","Insurance Producers","Cease and Desist Orders","Alien"],"a":0,"e":"Domestic: A company that resides and is incorporated under the laws of the state in which its home office is located.","t":"Georgia Insurance Laws & Rules","k":"d","g":1},{"q":"Which term matches this definition? “A company whose home office is located in another state. It is considered to be a _____ company in all states except for its home office.”","o":["Controlled Businesses","Hearing","Foreign","Insurance Producers"],"a":2,"e":"Foreign: A company whose home office is located in another state. It is considered to be a foreign company in all states except for its home office.","t":"Georgia Insurance Laws & Rules","k":"d","g":1},{"q":"Which term matches this definition? “A company that is chartered and organized in any country other than the United States. It is considered an _____ company in all states.”","o":["Alien","Continuing Education","Commissioner of Insurance","Stock Company"],"a":0,"e":"Alien: A company that is chartered and organized in any country other than the United States. It is considered an alien company in all states.","t":"Georgia Insurance Laws & Rules","k":"d","g":1},{"q":"Which term matches this definition? “An insurance company that has qualified and received a Certificate of Authority from the Insurance Department to sell insurance in this state.”","o":["Insurance Producers","Hearing","Nonauthorized Insurer","Authorized Insurer"],"a":3,"e":"Authorized Insurer: An insurance company that has qualified and received a Certificate of Authority from the Insurance Department to sell insurance in this state.","t":"Georgia Insurance Laws & Rules","k":"d","g":1},{"q":"Which term matches this definition? “An insurance company that has been denied or not yet applied for a Certificate of Authority and may not sell insurance in this state.”","o":["Mutual Company","Continuing Education","Commissioner of Insurance","Nonauthorized Insurer"],"a":3,"e":"Nonauthorized Insurer: An insurance company that has been denied or not yet applied for a Certificate of Authority and may not sell insurance in this state.","t":"Georgia Insurance Laws & Rules","k":"d","g":1},{"q":"Which term matches this definition? “No person shall pay or accept _____ to/from an unlicensed individual for the purpose of selling or negotiating insurance business.”","o":["Commissions","Reinstatement","Hearing","Insurance Producers"],"a":0,"e":"Commissions: No person shall pay or accept commissions to/from an unlicensed individual for the purpose of selling or negotiating insurance business.","t":"Georgia Insurance Laws & Rules","k":"d","g":1},{"q":"Which term matches this definition? “A lapsed policy may be reinstated within 3 years from the due date upon evidence of insurability and all back premiums are paid with interest.”","o":["Commissioner of Insurance","Insurance Producers","Reinstatement","Commissions"],"a":2,"e":"Reinstatement: A lapsed policy may be reinstated within 3 years from the due date upon evidence of insurability and all back premiums are paid with interest.","t":"Georgia Insurance Laws & Rules","k":"d","g":1}];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const S={mode:'up',fb:true,list:[],i:0,ans:[],t0:0,limit:0,tick:null,done:false};
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(r).padStart(2,'0')};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const show=id=>['setup','quiz','result','cards'].forEach(x=>$(x).classList.toggle('hide',x!==id));
S.scope='us';S.study='quiz';S.kinds=new Set(['e','d']);
const inScope=x=>S.scope==='all'||(S.scope==='ga'?x.g:!x.g);
const base=()=>Q.filter(x=>inScope(x)&&S.kinds.has(x.k));
const TOPS=()=>[...new Set(Q.filter(inScope).map(x=>x.t))];
S.topics=new Set(TOPS());
const pool=()=>base().filter(x=>S.topics.has(x.t));
$('ntop').textContent=new Set(Q.map(x=>x.t)).size;
function drawScopes(){$('scopes').innerHTML='';[['us','U.S. general',Q.filter(x=>!x.g).length],['ga','Georgia only',Q.filter(x=>x.g).length],['all','Everything',Q.length]].forEach(([k,n,c])=>{const b=document.createElement('button');b.className='chip';
b.setAttribute('aria-pressed',S.scope===k);b.innerHTML=n+'<small>'+c+'</small>';b.onclick=()=>{S.scope=k;S.topics=new Set(TOPS());drawScopes();drawKinds();drawTopics();syncCnt()};$('scopes').appendChild(b)})}
$('studies').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;S.study=b.dataset.s;[...$('studies').children].forEach(x=>x.setAttribute('aria-pressed',x===b));
const c=S.study==='cards';$('timerCard').classList.toggle('hide',c);$('fbCard').classList.toggle('hide',c);$('start').textContent=c?'Start flashcards':'Start quiz'};
function drawKinds(){$('kinds').innerHTML='';[['e','Exam-style questions'],['d','Term definitions']].forEach(([k,n])=>{const b=document.createElement('button');b.className='chip';
b.setAttribute('aria-pressed',S.kinds.has(k));b.innerHTML=n+'<small>'+Q.filter(x=>inScope(x)&&x.k===k).length+'</small>';
b.onclick=()=>{if(S.kinds.has(k)){if(S.kinds.size>1)S.kinds.delete(k)}else S.kinds.add(k);drawKinds();drawTopics();syncCnt()};$('kinds').appendChild(b)})}
$('total').textContent=Q.length;$('cnt').value=25;
function drawTopics(){$('topics').innerHTML='';TOPS().forEach(n=>{const b=document.createElement('button');b.className='chip';
b.setAttribute('aria-pressed',S.topics.has(n));b.innerHTML=esc(n)+'<small>'+Q.filter(x=>inScope(x)&&x.t===n&&S.kinds.has(x.k)).length+'</small>';
b.onclick=()=>{S.topics.has(n)?S.topics.delete(n):S.topics.add(n);drawTopics();syncCnt()};$('topics').appendChild(b)})}
$('allT').onclick=()=>{S.topics=new Set(TOPS());drawTopics();syncCnt()};
$('noneT').onclick=()=>{S.topics=new Set();drawTopics();syncCnt()};
function syncCnt(){const P=pool().length;$('cnt').min=Math.min(5,P)||0;$('cnt').max=P;$('cnt').disabled=!P;
if(+$('cnt').value>P||!+$('cnt').value)$('cnt').value=Math.min(25,P);
const n=+$('cnt').value;$('cntv').textContent=P?n+' of '+P:'none selected';$('start').disabled=!P;
$('mins').value=Math.max(1,Math.round(n*0.75));
$('presets').innerHTML='';[10,25,50,100,200,P].forEach((v,i,arr)=>{if(!v||v>P||(i<5&&v===P))return;const b=document.createElement('button');b.className='chip';
b.textContent=v===P?'All '+P:v;b.setAttribute('aria-pressed',v===n);b.onclick=()=>{$('cnt').value=v;syncCnt()};$('presets').appendChild(b)})}
$('cnt').oninput=syncCnt;
$('tmodes').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;S.mode=b.dataset.m;
[...$('tmodes').children].forEach(x=>x.setAttribute('aria-pressed',x===b));$('cdbox').classList.toggle('hide',S.mode!=='down')};
$('fmodes').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;S.fb=b.dataset.f==='1';
[...$('fmodes').children].forEach(x=>x.setAttribute('aria-pressed',x===b))};
$('tmodes').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;S.mode=b.dataset.m;
[...$('tmodes').children].forEach(x=>x.setAttribute('aria-pressed',x===b));$('cdbox').classList.toggle('hide',S.mode!=='down')};
$('fmodes').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;S.fb=b.dataset.f==='1';
[...$('fmodes').children].forEach(x=>x.setAttribute('aria-pressed',x===b))};
function prep(q){const keep=q.o.some(t=>/^all of the above/i.test(t));
const idx=keep?q.o.map((_,k)=>k):shuffle(q.o.map((_,k)=>k));return{q,idx}}
function begin(items){S.list=items;S.i=0;S.ans=new Array(items.length).fill(null);S.done=false;S.t0=Date.now();
S.limit=S.mode==='down'?Math.max(1,+$('mins').value||1)*60:0;
$('clock').classList.toggle('hide',S.mode==='off');clearInterval(S.tick);tickf();S.tick=setInterval(tickf,500);show('quiz');render()}
function elapsed(){return(Date.now()-S.t0)/1000}
function tickf(){if(S.mode==='off')return;const e=elapsed();
if(S.mode==='down'){const left=S.limit-e;$('clock').textContent=fmt(left);$('clock').classList.toggle('low',left<=60);if(left<=0)finish()}
else $('clock').textContent=fmt(e)}
drawScopes();drawKinds();drawTopics();syncCnt();
$('start').onclick=()=>{const n=+$('cnt').value;const items=shuffle(pool()).slice(0,n);S.study==='cards'?beginCards(items):begin(items.map(prep))};
function render(){const it=S.list[S.i],n=S.list.length;
$('prog').textContent='Question '+(S.i+1)+' of '+n;$('pbar').style.width=(S.i/n*100)+'%';
$('qtext').textContent=it.q.q;$('fb').className='fb hide';
const box=$('opts');box.innerHTML='';
it.idx.forEach((k,pos)=>{const b=document.createElement('button');b.className='opt';b.textContent=it.q.o[k];b.onclick=()=>pick(pos);
if(S.ans[S.i]===pos)b.classList.add('sel');box.appendChild(b)});
$('next').disabled=S.ans[S.i]===null;$('next').textContent=S.i===n-1?'Finish':'Next'}
function pick(pos){if(S.fb&&S.ans[S.i]!==null)return;S.ans[S.i]=pos;const it=S.list[S.i];
const btns=[...$('opts').children];btns.forEach((b,p)=>b.classList.toggle('sel',p===pos));
if(S.fb){const ci=it.idx.indexOf(it.q.a);btns.forEach((b,p)=>{b.disabled=true;b.classList.remove('sel');if(p===ci)b.classList.add('ok');else if(p===pos)b.classList.add('bad')});
const good=pos===ci,f=$('fb');f.className='fb'+(good?'':' bad');
f.innerHTML='<b>'+(good?'Correct.':'Not quite. The answer is: ')+(good?'':'</b>')+'';
if(!good){f.innerHTML='<b>Not quite.</b>Correct answer: '+esc(it.q.o[it.q.a])+'<br>'}
else f.innerHTML='<b>Correct.</b>';
f.insertAdjacentHTML('beforeend',esc(it.q.e))}
$('next').disabled=false}
$('next').onclick=()=>{if(S.i<S.list.length-1){S.i++;render()}else finish()};
$('endnow').onclick=()=>{if(confirm('End the quiz now? Unanswered questions count as incorrect.'))finish()};
function finish(){if(S.done)return;S.done=true;clearInterval(S.tick);const used=S.mode==='down'?Math.min(S.limit,elapsed()):elapsed();
const n=S.list.length;let c=0;S.miss=[];
S.list.forEach((it,i)=>{const ok=S.ans[i]!==null&&it.idx[S.ans[i]]===it.q.a;if(ok)c++;else S.miss.push(it.q)});
$('score').textContent=Math.round(c/n*100)+'%';$('sc').textContent=c+' / '+n;
$('st').textContent=S.mode==='off'?'n/a':fmt(used);$('sa').textContent=S.mode==='off'?'n/a':fmt(used/n)+'/q';
const bt={};S.list.forEach((it,i)=>{const o=bt[it.q.t]=bt[it.q.t]||[0,0];o[1]++;if(S.ans[i]!==null&&it.idx[S.ans[i]]===it.q.a)o[0]++});
$('bytopic').innerHTML='<b>By topic</b>'+Object.entries(bt).map(([k,v])=>'<div class="bt"><span>'+esc(k)+'</span><span>'+v[0]+' / '+v[1]+' ('+Math.round(v[0]/v[1]*100)+'%)</span></div>').join('');
$('retry').classList.toggle('hide',!S.miss.length);rv('all');show('result');window.scrollTo(0,0)}
function rv(f){[...document.querySelectorAll('[data-r]')].forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===f));
let h='',cnt=0;S.list.forEach((it,i)=>{const a=S.ans[i],ok=a!==null&&it.idx[a]===it.q.a;if(f==='bad'&&ok)return;cnt++;
h+='<div class="rv"><span class="tag '+(ok?'ok">Correct':'bad">'+(a===null?'Unanswered':'Missed'))+'</span><span class="mute" style="font-size:.85rem">'+esc(it.q.t)+'</span><br><b>'+(i+1)+'. '+esc(it.q.q)+'</b>'
+(ok?'':'<div class="mute" style="margin-top:6px">Your answer: '+(a===null?'none':esc(it.q.o[it.idx[a]]))+'</div>')
+'<div style="margin-top:4px"><b>Answer:</b> '+esc(it.q.o[it.q.a])+'</div><div class="mute" style="margin-top:4px">'+esc(it.q.e)+'</div></div>'});
$('review').innerHTML=h||'<p style="margin:0">Nothing to show here. Every answer was correct.</p>'}
function beginCards(items){S.cl=items;S.ci=0;S.flip=false;S.cr=new Array(items.length).fill(null);$('cdone').classList.add('hide');$('cplay').classList.remove('hide');show('cards');renderCard()}
function renderCard(){const c=S.cl[S.ci],n=S.cl.length;$('cprog').textContent='Card '+(S.ci+1)+' of '+n;$('cbar').style.width=(S.ci/n*100)+'%';
$('cknown').textContent=S.cr.filter(v=>v===true).length+' known · '+S.cr.filter(v=>v===false).length+' learning';
const f=$('fcard');f.classList.toggle('back',S.flip);const ans=c.o[c.a];
if(!S.flip){$('fside').textContent=(c.k==='d'?'Definition':'Question')+' · '+c.t;
$('fbody').innerHTML='<div class="ft">'+esc(c.k==='d'?c.q.replace(/^Which term matches this definition\?\s*/,'').replace(/^“|”$/g,''):c.q)+'</div>'}
else{$('fside').textContent='Answer';let e=c.k==='d'?c.e.replace(/^[^:]*:\s*/,''):c.e;if(/^The correct answer is: /.test(e))e='';
$('fbody').innerHTML='<div class="fa">'+esc(ans)+'</div>'+(e?'<div>'+esc(e)+'</div>':'')}}
$('fcard').onclick=()=>{S.flip=!S.flip;renderCard()};
function markCard(v){S.cr[S.ci]=v;if(S.ci<S.cl.length-1){S.ci++;S.flip=false;renderCard()}else finishCards()}
$('cgot').onclick=()=>markCard(true);$('cagain').onclick=()=>markCard(false);
$('cback').onclick=()=>{if(S.ci>0){S.ci--;S.flip=false;renderCard()}};
$('cend').onclick=()=>finishCards();
function finishCards(){const k=S.cr.filter(v=>v===true).length,l=S.cl.length-k;$('cplay').classList.add('hide');$('cdone').classList.remove('hide');$('cbar').style.width='100%';
$('cdt').textContent=k+' of '+S.cl.length+' known';$('cds').textContent=l?l+' card'+(l===1?'':'s')+' still to learn (including any you skipped).':'You knew every card.';
$('cmiss').classList.toggle('hide',!l);window.scrollTo(0,0)}
$('cmiss').onclick=()=>beginCards(shuffle(S.cl.filter((_,i)=>S.cr[i]!==true)));
$('cnew').onclick=()=>{show('setup');window.scrollTo(0,0)};
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rv(b.dataset.r));
$('retry').onclick=()=>begin(shuffle(S.miss).map(prep));
$('again').onclick=()=>{clearInterval(S.tick);show('setup');window.scrollTo(0,0)};
</script></body></html>
