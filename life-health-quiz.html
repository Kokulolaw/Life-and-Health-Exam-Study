sured: This is the person whose life is requesting to be insured. Typically, but not always, the proposed insured is also the applicant.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “A “_____” is the basis for an additional charge to the standard premium because the person being insured is classified as a higher-than-average risk. The above standard rates are typically the result of impaired health or hazardous occupations.”","o":["Policy Term","Age Change","Rated Policy","Policy holder"],"a":2,"e":"Rated Policy: A “rated policy” is the basis for an additional charge to the standard premium because the person being insured is classified as a higher-than-average risk. The above standard rates are typically the result of impaired health or hazardous occupations.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is a permitted activity in which a producer convinces a prospective client to lapse or surrender a life or health policy and purchase a new one. If this activity occurs, producers must provide a “Notice Regarding _____” to the consumer. The producer must also notify the insurer that a _____ is occurring.”","o":["Replacement","Policy Fee","Backdating","Post-Claims Underwriting"],"a":0,"e":"Replacement: This is a permitted activity in which a producer convinces a prospective client to lapse or surrender a life or health policy and purchase a new one. If this activity occurs, producers must provide a “Notice Regarding Replacement” to the consumer. The producer must also notify the insurer that a replacement is occurring.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “Most state laws specify that an applicant’s statements on an application are considered _____ and not warranties. A representation is only required to be substantially accurate to the best of the applicant’s knowledge.”","o":["Declined Risk","Preferred Risk","Representations","Rated Policy"],"a":2,"e":"Representations: Most state laws specify that an applicant’s statements on an application are considered representations and not warranties. A representation is only required to be substantially accurate to the best of the applicant’s knowledge. Generally, a representation is considered to be fraudulent if it relates to a situation that would be material to the risk and that the applicant made with fraudulent intent.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This describes the underwriting category into which a risk exposure is placed depending on the applicant’s susceptibility to injury, illness, or death.”","o":["Effective Date","Risk Classification","Rated Policy","Preferred Risk"],"a":1,"e":"Risk Classification: This describes the underwriting category into which a risk exposure is placed depending on the applicant’s susceptibility to injury, illness, or death.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This describes an applicant who cannot qualify for a standard policy but may secure one with a rider that waives the payment for a loss involving certain existing health impairments. The applicant may be required to pay a higher premium or to accept a type of policy that’s different from the one for which he applied.”","o":["Special Class","Non-Medical","Insurable Interest","Field Underwriting"],"a":0,"e":"Special Class: This describes an applicant who cannot qualify for a standard policy but may secure one with a rider that waives the payment for a loss involving certain existing health impairments. The applicant may be required to pay a higher premium or to accept a type of policy that’s different from the one for which he applied.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This describes an applicant whose physical condition fails to meet the typical minimum standards. If the substandard classification is due to adverse health, the application may be declined or written with a “rated-up” premium.”","o":["Substandard Risk","Risk Classification","Policy Term","Field Underwriting"],"a":0,"e":"Substandard Risk: This describes an applicant whose physical condition fails to meet the typical minimum standards. If the substandard classification is due to adverse health, the application may be declined or written with a “rated-up” premium. An applicant may be in excellent health but considered substandard due to their activities, hobbies, or avocations (e.g., scuba diving, skydiving, etc.).","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is a person who identifies, examines, and classifies the degree of risk represented by a proposed insured to determine whether coverage should be provided and, if so, at what rate. An _____ applies the insurer’s standards when making decisions during the company’s underwriting process.”","o":["Age Change","Claims Experience","Underwriter","Buyer’s Guide"],"a":2,"e":"Underwriter: This is a person who identifies, examines, and classifies the degree of risk represented by a proposed insured to determine whether coverage should be provided and, if so, at what rate. An underwriter applies the insurer’s standards when making decisions during the company’s underwriting process.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is the process of selection, classification, and rating risks.”","o":["Field Underwriter","Underwriting","Rated Policy","Declined Risk"],"a":1,"e":"Underwriting: This is the process of selection, classification, and rating risks. Underwriters analyze information that’s obtained from various sources pertaining to an applicant for insurance and then determine whether the carrier should decline the application, issue an insurance policy as requested, or offer either a modified policy with restrictions or a contract with a higher required premium.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “Most state laws specify that an applicant’s statements on the application are considered representations and not _____. A warranty must be absolutely and literally true.”","o":["Adverse Selection","Warranties","Policy Term","Statement of Continued Good Health"],"a":1,"e":"Warranties: Most state laws specify that an applicant’s statements on the application are considered representations and not warranties. A warranty must be absolutely and literally true. A breach of warranty may be sufficient to void the policy regardless of whether the warranty is material and whether such breach of warranty had contributed to the loss.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is a document that’s issued by an insurance company/broker and used to verify the existence of insurance coverage granted to individuals under specific conditions. With group insurance, the group (typically the employer) is the policy owner and maintains a master policy.”","o":["Extension of Benefits","Certificate of Insurance","Health Insurance Portability and Accountability Act","Blanket Insurance"],"a":1,"e":"Certificate of Insurance: This is a document that’s issued by an insurance company/broker and used to verify the existence of insurance coverage granted to individuals under specific conditions. With group insurance, the group (typically the employer) is the policy owner and maintains a master policy. The insureds (typically the employees) receive a certificate of insurance rather than a policy.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is a group insurance plan that’s issued to an employer under which both the employer and employees contribute to the cost of the plan. Generally, 75% of the eligible employees must be insured in most states. The employees must *contribute *to the cost of the plan.”","o":["Contributory Plan","Independent Practice Association HMOs –","Staff Model HMO","Standalone Dental Plan"],"a":0,"e":"Contributory Plan: This is a group insurance plan that’s issued to an employer under which both the employer and employees contribute to the cost of the plan. Generally, 75% of the eligible employees must be insured in most states. The employees must *contribute *to the cost of the plan.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “Before an original insurance policy expires, this privilege allows a policy owner to elect to have a new policy issued which will continue the insurance coverage.”","o":["Administration Services Only Plan","Conversion Privilege","Retrospective Review","Pregnancy Discrimination Act of 1978"],"a":1,"e":"Conversion Privilege: Before an original insurance policy expires, this privilege allows a policy owner to elect to have a new policy issued which will continue the insurance coverage. Conversion may be effected at attained age (premiums based on the age attained at the time of conversion) or at original age (premiums based on the age of the insured at the time of original issue). Conversion is a common privilege for term life insurance…","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “These policies are designed to help the insured pay off a loan in the event she’s disabled due to an accident or sickness, or she dies. If the insured becomes disabled, the policy provides for monthly benefit payments that are equal to the monthly loan payments due.”","o":["Credit Policies","Small Employer","Case Management","Health Maintenance Organizations"],"a":0,"e":"Credit Policies: These policies are designed to help the insured pay off a loan in the event she’s disabled due to an accident or sickness, or she dies. If the insured becomes disabled, the policy provides for monthly benefit payments that are equal to the monthly loan payments due. If the insured dies, the policy will pay a lump-sum to the creditor to pay off the loan. Credit policies typically cannot exceed the amount of the loan…","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is a life or health insurance plan for covering groups of persons with individual policies that are uniform in provisions, but perhaps different in benefits. Solicitation typically takes place in an employer’s business with the employer’s consent.”","o":["Case Management","Blanket Insurance","Franchise Insurance","Health Insurance Portability and Accountability Act"],"a":2,"e":"Franchise Insurance: This is a life or health insurance plan for covering groups of persons with individual policies that are uniform in provisions, but perhaps different in benefits. Solicitation typically takes place in an employer’s business with the employer’s consent. Franchise insurance is generally written for groups that are too small to qualify for regular group coverage. This policy may be referred to as wholesale insurance…","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This policy is issued to the employer under a group plan and contains all of the insuring clauses which define employee benefits. Individual employees who participate in the group plan receive individual certificates that outline the highlights of the coverage.”","o":["Administration Services Only Plan","Master Contract","Co-Payment or Co-Pay","Master Policy"],"a":3,"e":"Master Policy: This policy is issued to the employer under a group plan and contains all of the insuring clauses which define employee benefits. Individual employees who participate in the group plan receive individual certificates that outline the highlights of the coverage.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is an employee benefit plan under which the employer bears the full cost of the employees’ benefits. In most states, the plan must cover 100% of eligible employees. The employees do NOT *contribute *to the cost of the plan.”","o":["Administration Services Only Plan","Standalone Dental Plan","Scheduled Dental Plan","Non-Contributory Plan"],"a":3,"e":"Non-Contributory Plan: This is an employee benefit plan under which the employer bears the full cost of the employees’ benefits. In most states, the plan must cover 100% of eligible employees. The employees do NOT *contribute *to the cost of the plan.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “As defined in Section 403(b) of the IRS tax code, this is a retirement plan for certain employees of public schools, employees of specific tax-exempt organizations, and certain ministers.”","o":["Qualified Plan","Simplified Employee Pension Plan","Profit-Sharing Plan","403 Plan"],"a":3,"e":"403 Plan: As defined in Section 403(b) of the IRS tax code, this is a retirement plan for certain employees of public schools, employees of specific tax-exempt organizations, and certain ministers.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is one to whom an annuity is payable or a person upon whose continued life future payments are dependent.”","o":["401 Plan","Qualified Withdrawal","Annuitant","Traditional IRA"],"a":2,"e":"Annuitant: This is one to whom an annuity is payable or a person upon whose continued life future payments are dependent.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “Upon the death of an annuitant, this option provides that, before payments totaling the purchase price have been made, the excess of the amount paid by the purchaser over the total annuity payments received will be paid in one lump-sum to designated beneficiaries.”","o":["Principal","Deferred Annuity","Keogh Plan","Cash Refund Option"],"a":3,"e":"Cash Refund Option: Upon the death of an annuitant, this option provides that, before payments totaling the purchase price have been made, the excess of the amount paid by the purchaser over the total annuity payments received will be paid in one lump-sum to designated beneficiaries.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “These annuities provide for the postponement of the payment of an annuity until after a specified period or until the annuitant attains a specified age. A _____ may be purchased on either a single-premium or flexible premium basis.”","o":["Deferred Annuity","Simplified Employee Pension Plan","Defined Benefit Plan","Principal"],"a":0,"e":"Deferred Annuity: These annuities provide for the postponement of the payment of an annuity until after a specified period or until the annuitant attains a specified age. A deferred annuity may be purchased on either a single-premium or flexible premium basis. Deferred annuities typically don’t begin making income payments for at least one year after the date of purchase.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is a fixed deferred annuity that offers the traditional guaranteed minimum interest rate as well as an excess interest feature that’s based on the performance of an external equities market index.”","o":["Roth IRA","Equity Indexed Annuity","Straight Life Annuity","Defined Benefit Plan"],"a":1,"e":"Equity Indexed Annuity: This is a fixed deferred annuity that offers the traditional guaranteed minimum interest rate as well as an excess interest feature that’s based on the performance of an external equities market index.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is a fraction which is used to determine the amount of annual annuity income that’s exempt from federal income tax. The _____ is calculated by taking the total contribution or investment in the annuity divided by the expected ratio.”","o":["Equity Indexed Annuity","Profit-Sharing Plan","Exclusion Ratio","Annuitant"],"a":2,"e":"Exclusion Ratio: This is a fraction which is used to determine the amount of annual annuity income that’s exempt from federal income tax. The exclusion ratio is calculated by taking the total contribution or investment in the annuity divided by the expected ratio.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This type of annuity can only be purchased with a single payment and typically begins paying income within one month of purchase.”","o":["Straight Life Annuity","Equity Indexed Annuity","Exclusion Ratio","Immediate Annuity"],"a":3,"e":"Immediate Annuity: This type of annuity can only be purchased with a single payment and typically begins paying income within one month of purchase.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is the original sum of money that’s paid into an annuity through premium(s).”","o":["Principal","Deferred Annuity","Cash Refund Option","Rollovers"],"a":0,"e":"Principal: This is the original sum of money that’s paid into an annuity through premium(s).","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is an annuity income option that pays a guaranteed income for the annuitant’s lifetime, but payments cease upon the annuitant’s death.”","o":["Principal","403 Plan","Straight Life Annuity","Qualified Plan"],"a":2,"e":"Straight Life Annuity: This is an annuity income option that pays a guaranteed income for the annuitant’s lifetime, but payments cease upon the annuitant’s death.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is a plan which provides that, upon a business owner’s death, surviving owners will purchase the deceased’s interest, often with funds from life insurance policies owned by each principal on the lives of all of the other principals.”","o":["Cross-Purchase Plan","Excess Interest","Fixed Period or Period Certain Option","Juvenile Life Insurance"],"a":0,"e":"Cross-Purchase Plan: This is a plan which provides that, upon a business owner’s death, surviving owners will purchase the deceased’s interest, often with funds from life insurance policies owned by each principal on the lives of all of the other principals.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is an agreement whereby a business assumes the obligation of purchasing a deceased owner’s interest in the business, which proportionately increases the interests of the surviving owners.”","o":["Universal Life Insurance","Mortgage Redemption Plan","Entity Plan","Other Insurance with This Insurer Provision"],"a":2,"e":"Entity Plan: This is an agreement whereby a business assumes the obligation of purchasing a deceased owner’s interest in the business, which proportionately increases the interests of the surviving owners.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a method of determining an individual’s economic worth as measured by the sum of the individual’s future earnings that’s devoted to the individual’s family.”","o":["Industrial Life Insurance","Needs Approach","Human Life Value Approach","Variable Life Insurance"],"a":2,"e":"Human Life Value Approach: This is a method of determining an individual’s economic worth as measured by the sum of the individual’s future earnings that’s devoted to the individual’s family.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a method for determining how much insurance protection a person should have by analyzing a family’s or business’s needs and objectives if the insured were to die, become disabled, or retire.”","o":["Needs Approach","Maturity Value","Endowment Contract","Human Life Value Approach"],"a":0,"e":"Needs Approach: This is a method for determining how much insurance protection a person should have by analyzing a family’s or business’s needs and objectives if the insured were to die, become disabled, or retire.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a retirement savings plan that’s sponsored by an employer. A 401(k) plan allows an employee to save and invest a piece of her paycheck before taxes are taken out. Taxes are not paid until the money is withdrawn from the account.”","o":["Defined Benefit Plan","Keogh Plan","Traditional IRA","401 Plan"],"a":3,"e":"401 Plan: This is a retirement savings plan that’s sponsored by an employer. A 401(k) plan allows an employee to save and invest a piece of her paycheck before taxes are taken out. Taxes are not paid until the money is withdrawn from the account.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is a pension plan under which a specific benefit formula determines the benefits.”","o":["Annuitant","403 Plan","Simplified Employee Pension Plan","Defined Benefit Plan"],"a":3,"e":"Defined Benefit Plan: This is a pension plan under which a specific benefit formula determines the benefits.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is a federal law that sets minimum standards for most voluntarily established pension and health plans in private industry to provide protection for individuals in these plans.”","o":["Simplified Employee Pension Plan","Cash Refund Option","Employee Retirement Income Security Act of 1974","Defined Benefit Plan"],"a":2,"e":"Employee Retirement Income Security Act of 1974: This is a federal law that sets minimum standards for most voluntarily established pension and health plans in private industry to provide protection for individuals in these plans.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is a plan that’s designed to fund the retirement of self-employed individuals. The name is derived from the author of the Keogh Act (HR-10). Contributions that are made to such a plan are given favorable tax treatment.”","o":["Exclusion Ratio","Simplified Employee Pension Plan","Straight Life Annuity","Keogh Plan"],"a":3,"e":"Keogh Plan: This is a plan that’s designed to fund the retirement of self-employed individuals. The name is derived from the author of the Keogh Act (HR-10). Contributions that are made to such a plan are given favorable tax treatment.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “If the amount being withdrawn from a plan exceeds the total amount contributed, it’s considered a _____. The earnings generated after the contributions become taxable as ordinary income.”","o":["Non-Qualified Withdrawal","Defined Benefit Plan","Qualified Plan","Deferred Annuity"],"a":0,"e":"Non-Qualified Withdrawal: If the amount being withdrawn from a plan exceeds the total amount contributed, it’s considered a non-qualified withdrawal. The earnings generated after the contributions become taxable as ordinary income.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is a plan in which a portion of a company’s profits is set aside for distribution to employees who qualify under the plan.”","o":["Defined Benefit Plan","Profit-Sharing Plan","Keogh Plan","Straight Life Annuity"],"a":1,"e":"Profit-Sharing Plan: This is a plan in which a portion of a company’s profits is set aside for distribution to employees who qualify under the plan.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is a retirement or employee compensation plan which is established and maintained by an employer that meets specific guidelines as determined by the IRS and consequently receives favorable tax treatment.”","o":["Qualified Plan","Profit-Sharing Plan","Defined Benefit Plan","Exclusion Ratio"],"a":0,"e":"Qualified Plan: This is a retirement or employee compensation plan which is established and maintained by an employer that meets specific guidelines as determined by the IRS and consequently receives favorable tax treatment.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is the tax-free distribution of earnings from a Roth IRA. To be considered a _____, the funds must have been held in the account for a minimum of five years.”","o":["Simplified Employee Pension Plan","Roth IRA","Qualified Withdrawal","Immediate Annuity"],"a":2,"e":"Qualified Withdrawal: This is the tax-free distribution of earnings from a Roth IRA. To be considered a qualified withdrawal, the funds must have been held in the account for a minimum of five years. No portion of the withdrawal is subject to tax if it’s taken for one of the following reasons: permanent disability, made by a beneficiary after the owner’s death; or used to buy, build, or rebuild a first home ($10,000 lifetime limit).","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is when an individual retirement account (IRA) is established with funds that are transferred from another IRA or qualified retirement plan which the owner had terminated.”","o":["Employee Retirement Income Security Act of 1974","Annuitant","Equity Indexed Annuity","Rollovers"],"a":3,"e":"Rollovers: This is when an individual retirement account (IRA) is established with funds that are transferred from another IRA or qualified retirement plan which the owner had terminated.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is an individual retirement account (IRA) which allows a person to contribute after-tax funds up to a specified amount each year. Both the earnings generated in the account and withdrawals taken after the age of 59 1/2 are tax-free.”","o":["Traditional IRA","Roth IRA","Keogh Plan","Cash Refund Option"],"a":1,"e":"Roth IRA: This is an individual retirement account (IRA) which allows a person to contribute after-tax funds up to a specified amount each year. Both the earnings generated in the account and withdrawals taken after the age of 59 1/2 are tax-free.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is a type of qualified retirement plan under which the employer contributes to an individual retirement account that’s established and maintained by the employee.”","o":["Keogh Plan","Simplified Employee Pension Plan","401 Plan","Qualified Plan"],"a":1,"e":"Simplified Employee Pension Plan: This is a type of qualified retirement plan under which the employer contributes to an individual retirement account that’s established and maintained by the employee.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “This is an individual qualified retirement account through which an eligible individual can accumulate tax-deferred income up to a certain amount each year, depending on the individual’s tax bracket.”","o":["403 Plan","Simplified Employee Pension Plan","Traditional IRA","Non-Qualified Withdrawal"],"a":2,"e":"Traditional IRA: This is an individual qualified retirement account through which an eligible individual can accumulate tax-deferred income up to a certain amount each year, depending on the individual’s tax bracket.","t":"Annuities, Settlement Options & Retirement","k":"d","g":0},{"q":"Which term matches this definition? “An _____ is an unintended occurrence that results in a loss that’s caused by an external source. An _____ is fixed in time and space.”","o":["Oral Surgery","Core Benefits","Accident","Essential Health Benefits"],"a":2,"e":"Accident: An accident is an unintended occurrence that results in a loss that’s caused by an external source. An accident is fixed in time and space.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a common method of stating “accidental result.” Many states require policies to define a covered accident no more restrictively than an “_____.””","o":["Accidental Bodily Injury","Franchise Insurance","Closed-Panel Network","Administration Services Only Plan"],"a":0,"e":"Accidental Bodily Injury: This is a common method of stating “accidental result.” Many states require policies to define a covered accident no more restrictively than an “accidental bodily injury.”","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This act imposed new government standards on private major medical insurance and established government-run e-market exchanges to facilitate the sale of insurance to those in the individual and small group markets.”","o":["Continuing Care","Formal Care","Affordable Care Act","Intermediate Care"],"a":2,"e":"Affordable Care Act: This act imposed new government standards on private major medical insurance and established government-run e-market exchanges to facilitate the sale of insurance to those in the individual and small group markets.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “Insurance companies issue _____ policies to cover situations in which a group’s individual members constantly change, but whose membership is consistently exposed to the same hazards.”","o":["Preferred Provider Organization","Franchise Insurance","Health Insurance Portability and Accountability Act","Blanket Insurance"],"a":3,"e":"Blanket Insurance: Insurance companies issue blanket insurance policies to cover situations in which a group’s individual members constantly change, but whose membership is consistently exposed to the same hazards. For example, amateur sports organizations may purchase blanket insurance policies to cover participants and spectators while they attend organization events. A school may purchase this type of policy to cover its students.…","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is a measurement that’s used to project a client’s level of risk. Insurers use it when underwriting and setting the premium for small group insurance plans. The insurer bases the client group’s projected claims experience on the surrounding community’s claims experience and costs.”","o":["Closed-Panel Network","Community Rating","Case Management","Consolidated Omnibus Budget Reconciliation Act"],"a":1,"e":"Community Rating: This is a measurement that’s used to project a client’s level of risk. Insurers use it when underwriting and setting the premium for small group insurance plans. The insurer bases the client group’s projected claims experience on the surrounding community’s claims experience and costs.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This form of major medical insurance covers a broad range of losses and only excludes those that are specifically excluded in the policy. _____ also cover a wide range of services.”","o":["Primary Insurer","Informal Care","Donut Hole","Comprehensive Policies"],"a":3,"e":"Comprehensive Policies: This form of major medical insurance covers a broad range of losses and only excludes those that are specifically excluded in the policy. Comprehensive policies also cover a wide range of services.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This type of insurance policy is designed to help the insured debtor pay off a loan if they become disabled. If the insured becomes disabled, the policy provides the creditor with monthly benefit payments that are equal to the monthly loan payments as they become due.”","o":["Residual Disability","Decreasing Term Disability Policy","Own Occupation","Credit Disability"],"a":3,"e":"Credit Disability: This type of insurance policy is designed to help the insured debtor pay off a loan if they become disabled. If the insured becomes disabled, the policy provides the creditor with monthly benefit payments that are equal to the monthly loan payments as they become due. If the insured dies, the policy will pay a lump-sum amount to the creditor to pay off the loan. Credit policies cannot exceed the loan amount because…","t":"Disability Income","k":"d","g":0},{"q":"Which term matches this definition? “This is a specialized form of health expense coverage that focuses on diagnostic and preventive treatment and is designed to pay for regular dental care as well as any care that’s necessitated by accidents.”","o":["Non-Scheduled Dental Plan","Dental Insurance","Certificate of Insurance","Scheduled Dental Plan"],"a":1,"e":"Dental Insurance: This is a specialized form of health expense coverage that focuses on diagnostic and preventive treatment and is designed to pay for regular dental care as well as any care that’s necessitated by accidents.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “For an insurance policy, this date identifies when coverage is actually in force and establishes the date by which the policy owner must pay future annual premiums.”","o":["Effective Date","Field Underwriting","Proposed Insured","Issue Date"],"a":0,"e":"Effective Date: For an insurance policy, this date identifies when coverage is actually in force and establishes the date by which the policy owner must pay future annual premiums.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is the dental specialty that performs root canals and treats the diseases that affect the part of the tooth which is referred to as the pulp.”","o":["Endodontics","Any Substantial Gainful Work","Primary Insurer","Comprehensive Policies"],"a":0,"e":"Endodontics: This is the dental specialty that performs root canals and treats the diseases that affect the part of the tooth which is referred to as the pulp.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the list of medications that are covered by a specific prescription drug plan along with each medication’s designated category (generic, prescription, specialty, etc.).”","o":["Formulary","Coordination of Benefits","Predetermination of Benefits","Health Reimbursement Accounts"],"a":0,"e":"Formulary: This is the list of medications that are covered by a specific prescription drug plan along with each medication’s designated category (generic, prescription, specialty, etc.).","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is considered the insurance against loss through sickness or accidental bodily injury.”","o":["Health and Accident Insurance","Usual, Customary, and Reasonable","Health Reimbursement Accounts","Essential Health Benefits"],"a":0,"e":"Health and Accident Insurance: This is considered the insurance against loss through sickness or accidental bodily injury. This may also be referred to as “health insurance,” “accident and health,” “accident and sickness,” “sickness and accident,” or “disability insurance.” It’s important to remember that the general term “health and accident insurance” applies to many different insurance types, not just the medical insurance that pays for doctor…","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “To _____ a person is to make her financially whole after a loss. Indemnification is the goal of insurance, which attempts to restore claimants to their financial position prior to an insurable loss.”","o":["Indemnify","Benefit Period","Health and Accident Insurance","Consumer Driven Health Plan"],"a":0,"e":"Indemnify: To indemnify a person is to make her financially whole after a loss. Indemnification is the goal of insurance, which attempts to restore claimants to their financial position prior to an insurable loss.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “Depending on the type of insurance involved, this phrase may be used in two distinct ways:”","o":["Cafeteria Plans","Limited Risk Policy","Core Benefits","Indemnity Plans"],"a":3,"e":"Indemnity Plans: Depending on the type of insurance involved, this phrase may be used in two distinct ways:","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a short-term policy that’s purchased on an interim basis, typically when a person is between jobs or waiting for a new policy to start.”","o":["First Dollar Coverage","Duplication of Coverage","Interim Coverage","Conversion Factor"],"a":2,"e":"Interim Coverage: This is a short-term policy that’s purchased on an interim basis, typically when a person is between jobs or waiting for a new policy to start.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This insurance pays a flat dollar amount on a daily, weekly, or monthly basis directly to the insured while the insured is confined to a hospital.”","o":["Blanket Insurance","Health Insurance Portability and Accountability Act Privacy Rule","Certificate of Insurance","Hospital Indemnity Insurance"],"a":3,"e":"Hospital Indemnity Insurance: This insurance pays a flat dollar amount on a daily, weekly, or monthly basis directly to the insured while the insured is confined to a hospital.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This policy provides limited coverage for a specific accident or sickness.”","o":["Social Insurance","Limited Health Insurance Policy","Health and Accident Insurance","Medical Expense Insurance"],"a":1,"e":"Limited Health Insurance Policy: This policy provides limited coverage for a specific accident or sickness.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This policy provides coverage for a specific type of accident or illness, such as an injury resulting from a travel accident or medical expense resulting from a specified disease.”","o":["Orthodontics","Benefit Period","Limited Health Insurance Policy","Limited Risk Policy"],"a":3,"e":"Limited Risk Policy: This policy provides coverage for a specific type of accident or illness, such as an injury resulting from a travel accident or medical expense resulting from a specified disease.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This describes an insurance contract that pays for the cost of medical and personal services that are defined as long-term care for individuals who need assistance with the activities of daily living daily for an extended period.”","o":["Long-Term Care Riders","Nursing Home","Long-Term Care Insurance","Custodial Care"],"a":2,"e":"Long-Term Care Insurance: This describes an insurance contract that pays for the cost of medical and personal services that are defined as long-term care for individuals who need assistance with the activities of daily living daily for an extended period.","t":"Long-Term Care","k":"d","g":0},{"q":"Which term matches this definition? “This insurance pays benefits for doctors’ fees associated with services commonly rendered in a hospital, along with hospital costs and basic outpatient services.”","o":["Basic Physician Expense Insurance","Health and Accident Insurance","Relation of Earnings to Insurance","Medical Expense Insurance"],"a":3,"e":"Medical Expense Insurance: This insurance pays benefits for doctors’ fees associated with services commonly rendered in a hospital, along with hospital costs and basic outpatient services.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This describes the level of risk that a person has of suffering a disability—usually within a given year, a given age, and as part of a defined population group.”","o":["Age Change","Warranties","Health Insurance Premium","Morbidity"],"a":3,"e":"Morbidity: This describes the level of risk that a person has of suffering a disability—usually within a given year, a given age, and as part of a defined population group.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is a plan that provides a broad range of coverage. The contract divides covered care into several categories or levels of care. Using deductibles and co-insurance percentages that vary with the levels of care, the policy is able to control costs.”","o":["Non-Scheduled Dental Plan","Standalone Dental Plan","Administration Services Only Plan","Dental Insurance"],"a":0,"e":"Non-Scheduled Dental Plan: This is a plan that provides a broad range of coverage. The contract divides covered care into several categories or levels of care. Using deductibles and co-insurance percentages that vary with the levels of care, the policy is able to control costs.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is the dental specialty that performs tissue biopsy.”","o":["Primary Insurer","Flat Amount Approach","Silver Plan","Oral Pathology"],"a":3,"e":"Oral Pathology: This is the dental specialty that performs tissue biopsy.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a dental specialty that includes tooth extraction and other surgical treatments.”","o":["Essential Health Benefits","Oral Surgery","Oral Pathology","Coordination of Benefits"],"a":1,"e":"Oral Surgery: This is a dental specialty that includes tooth extraction and other surgical treatments.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the dental specialty that corrects the alignment of teeth with devices such as braces and retainers.”","o":["Usual, Customary, and Reasonable","Orthodontics","Platinum Plan","High-Pressure Tactics"],"a":1,"e":"Orthodontics: This is the dental specialty that corrects the alignment of teeth with devices such as braces and retainers.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This form of dentistry specializes in treating children and adolescents.”","o":["Material Duties","Sickness","Pediatric Dentistry","Interim Coverage"],"a":2,"e":"Pediatric Dentistry: This form of dentistry specializes in treating children and adolescents.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the direct cause of an insurable, economic loss.”","o":["Peril","Medical Expense Insurance","Duplication of Coverage","Coordination of Benefits"],"a":0,"e":"Peril: This is the direct cause of an insurable, economic loss.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a dental specialty that treats gum disease.”","o":["Pool of Money","Periodontics","Hospice Care","Cash Surrender Value Rider"],"a":1,"e":"Periodontics: This is a dental specialty that treats gum disease.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a review process that’s conducted to determine whether services are medically necessary and covered under the policy. The _____ is dependent on information that’s submitted before service, while the payment is dependent on information that’s submitted after service.”","o":["Coordination of Benefits","Waiver of Premium","Predetermination of Benefits","Loss of Earnings Test"],"a":2,"e":"Predetermination of Benefits: This is a review process that’s conducted to determine whether services are medically necessary and covered under the policy. The predetermination of benefits is dependent on information that’s submitted before service, while the payment is dependent on information that’s submitted after service.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the dental specialty that provides dentures to replace missing teeth, as well as other artificial dental devices.”","o":["Guaranteed Renewable","End-Stage Renal Disease","Prosthodontics","Periodontics"],"a":2,"e":"Prosthodontics: This is the dental specialty that provides dentures to replace missing teeth, as well as other artificial dental devices.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the maximum amount that’s payable under the terms of an Accidental Death and Dismemberment (AD&D) policy. The amount is payable as a death benefit and also represents the amount of insurance purchased. AD&D policies define this death benefit as the policy’s “_____.””","o":["Basic Physician Expense Insurance","Consumer Driven Health Plan","Participating Providers","Principal Sum"],"a":3,"e":"Principal Sum: This is the maximum amount that’s payable under the terms of an Accidental Death and Dismemberment (AD&D) policy. The amount is payable as a death benefit and also represents the amount of insurance purchased. AD&D policies define this death benefit as the policy’s “principal sum.”","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “These benefits include fillings, crowns, and other procedures that restore the natural function of teeth.”","o":["Restorative or Restoration Benefits","Gold Plan","Coordination of Benefits","Predetermination of Benefits"],"a":0,"e":"Restorative or Restoration Benefits: These benefits include fillings, crowns, and other procedures that restore the natural function of teeth.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This plan pays a predefined benefit for specific services according to a published schedule.”","o":["Health Insurance Portability and Accountability Act Privacy Rule","Scheduled Dental Plan","Contributory Plan","Non-Contributory Plan"],"a":1,"e":"Scheduled Dental Plan: This plan pays a predefined benefit for specific services according to a published schedule.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “Although _____ (or illness) is often considered an internal occurrence that becomes manifest, it may have a sudden onset or develop over time. Illnesses include both acute infections and chronic conditions.”","o":["Cash Surrender Value Rider","Home Care","Sickness","Peril"],"a":2,"e":"Sickness: Although sickness (or illness) is often considered an internal occurrence that becomes manifest, it may have a sudden onset or develop over time. Illnesses include both acute infections and chronic conditions.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is another name for government insurance. Put another way, this is insurance that’s provided through state and federal government insurance programs.”","o":["Basic Physician Expense Insurance","Medical Expense Insurance","Endodontics","Social Insurance"],"a":3,"e":"Social Insurance: This is another name for government insurance. Put another way, this is insurance that’s provided through state and federal government insurance programs.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a policy that covers unusual hazards which are normally not covered under an ordinary accident and health insurance policy.”","o":["Limited Health Insurance Policy","Special Risk Policy","Medical Expense Insurance","Limited Risk Policy"],"a":1,"e":"Special Risk Policy: This is a policy that covers unusual hazards which are normally not covered under an ordinary accident and health insurance policy. For example, an actress who insures her legs for $1 million and a test pilot who flies an experimental airplane and obtains a policy covering his life while flying that specific airplane are both purchasing special risk policies.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a dental plan that’s offered without any connection to an accompanying medical expense insurance contract.”","o":["Standalone Dental Plan","Administration Services Only Plan","Contributory Plan","Employee Welfare Benefit Plan"],"a":0,"e":"Standalone Dental Plan: This is a dental plan that’s offered without any connection to an accompanying medical expense insurance contract.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is a contract in which a self-funded employee welfare benefit plan contracts with an insurer for administrative services while remaining responsible for the cost of claims. The insurer acts as a third-party administrator (TPA).”","o":["Administration Services Only Plan","Non-Contributory Plan","Standalone Dental Plan","Contributory Plan"],"a":0,"e":"Administration Services Only Plan: This is a contract in which a self-funded employee welfare benefit plan contracts with an insurer for administrative services while remaining responsible for the cost of claims. The insurer acts as a third-party administrator (TPA).","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is the part of _____ and Blue Shield that covers hospital services.”","o":["Dental Insurance","Point of Services Plan","Retrospective Review","Blue Cross"],"a":3,"e":"Blue Cross: This is the part of Blue Cross and Blue Shield that covers hospital services.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is an insurance service provider that pays participating medical providers directly for a subscriber’s treatment rather than reimbursing the insured.”","o":["Employee Welfare Benefit Plan","Blue Cross and Blue Shield","Small Employer","Retrospective Review"],"a":1,"e":"Blue Cross and Blue Shield: This is an insurance service provider that pays participating medical providers directly for a subscriber’s treatment rather than reimbursing the insured.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is the part of Blue Cross and _____ that covers the treatment costs of physicians and other medical providers.”","o":["Extension of Benefits","Third-Party Administrators","Blue Shield","Retrospective Review"],"a":2,"e":"Blue Shield: This is the part of Blue Cross and Blue Shield that covers the treatment costs of physicians and other medical providers.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is a method for compensating healthcare providers and is calculated per patient rather than per service. HMOs, pay providers a flat amount per person. If the person never uses the service, the HMO wastes the _____ fee. If the subscriber heavily utilizes HMO services, the provider loses money.”","o":["Qualifying Event","Capitation","Employee Welfare Benefit Plan","Creditable Coverage"],"a":1,"e":"Capitation: This is a method for compensating healthcare providers and is calculated per patient rather than per service. HMOs, pay providers a flat amount per person. If the person never uses the service, the HMO wastes the capitation fee. If the subscriber heavily utilizes HMO services, the provider loses money.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is the process by which a specialist within a person’s insurer reviews potentially large claims to discuss treatment alternatives with the insured.”","o":["Case Management","Retrospective Review","Franchise Insurance","Closed-Panel Network"],"a":0,"e":"Case Management: This is the process by which a specialist within a person’s insurer reviews potentially large claims to discuss treatment alternatives with the insured.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is a form of health maintenance organization (HMO) in which providers deliver services within HMO facilities.”","o":["Qualifying Event","Community Rating","Open-Panel Network","Closed-Panel Network"],"a":3,"e":"Closed-Panel Network: This is a form of health maintenance organization (HMO) in which providers deliver services within HMO facilities.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is also referred to as a person’s “percentage participation” in an insurance policy and is a characteristic of major medical insurance. In health insurance, _____ identifies the percentage of covered expenses that are shared by the insured and the amount paid by the insurer.”","o":["Co-Insurance","Core Benefits","Hospice Care","Benefit Trigger"],"a":0,"e":"Co-Insurance: This is also referred to as a person’s “percentage participation” in an insurance policy and is a characteristic of major medical insurance. In health insurance, co-insurance identifies the percentage of covered expenses that are shared by the insured and the amount paid by the insurer.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “_____ mandates that employers provide employees and their qualified beneficiaries with continuing coverage through the company’s group health plan following a qualifying event.”","o":["Consolidated Omnibus Budget Reconciliation Act","Stop-Loss","Enrollment Card","Health Insurance Portability and Accountability Act Privacy Rule"],"a":0,"e":"Consolidated Omnibus Budget Reconciliation Act: COBRA mandates that employers provide employees and their qualified beneficiaries with continuing coverage through the company’s group health plan following a qualifying event.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is a fixed dollar amount that HMO subscribers pay per visit. Unlike co-insurance, the primary purpose of the _____ is to cover administration costs.”","o":["Third-Party Administrators","Co-Payment or Co-Pay","Stop-Loss","Primary Care Physician"],"a":1,"e":"Co-Payment or Co-Pay: This is a fixed dollar amount that HMO subscribers pay per visit. Unlike co-insurance, the primary purpose of the co-pay is to cover administration costs.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is defined by HIPAA as previous coverage under another insurance plan when there has not been a break in coverage that lasts 63 days or longer. When an individual changes plans, _____ for pre-existing conditions reduces or eliminates any new waiting period.”","o":["Health Insurance Portability and Accountability Act","Creditable Coverage","Administration Services Only Plan","Blue Cross and Blue Shield"],"a":1,"e":"Creditable Coverage: This is defined by HIPAA as previous coverage under another insurance plan when there has not been a break in coverage that lasts 63 days or longer. When an individual changes plans, creditable coverage for pre-existing conditions reduces or eliminates any new waiting period.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is an ERISA compliant plan that’s funded by employers and provides employees benefits other than pensions.”","o":["Employee Welfare Benefit Plan","Non-Contributory Plan","Scheduled Dental Plan","Contributory Plan"],"a":0,"e":"Employee Welfare Benefit Plan: This is an ERISA compliant plan that’s funded by employers and provides employees benefits other than pensions.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This must be completed and signed by a new employee during the open enrollment period to enroll in group insurance.”","o":["Administration Services Only Plan","Extension of Benefits","Enrollment Card","Third-Party Administrators"],"a":2,"e":"Enrollment Card: This must be completed and signed by a new employee during the open enrollment period to enroll in group insurance.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is a hybrid of an HMO and a PPO. An insured has direct access to any in-network provider without a referral, but no coverage is provided for out-of-network care unless there’s an emergency.”","o":["Health Maintenance Organizations","Standalone Dental Plan","Exclusive Provider Organization","Stop-Loss"],"a":2,"e":"Exclusive Provider Organization: This is a hybrid of an HMO and a PPO. An insured has direct access to any in-network provider without a referral, but no coverage is provided for out-of-network care unless there’s an emergency.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This provision allows a covered individual to continue receiving benefits for a covered claim, even after the individual is no longer eligible for coverage. The extension period may be a fixed period or may last as long as the claim, depending on the contract.”","o":["Pre-Admission Certification","Certificate of Insurance","Extension of Benefits","Open-Panel Network"],"a":2,"e":"Extension of Benefits: This provision allows a covered individual to continue receiving benefits for a covered claim, even after the individual is no longer eligible for coverage. The extension period may be a fixed period or may last as long as the claim, depending on the contract.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is a federal statute that provides employees with the ability to change jobs while continuing health insurance coverage for themselves and their families. The legislation limits pre-existing condition exclusions by treating all group insurance as a single coverage pool for eligibility.”","o":["Health Insurance Portability and Accountability Act","Consolidated Omnibus Budget Reconciliation Act","Franchise Insurance","Blue Cross and Blue Shield"],"a":0,"e":"Health Insurance Portability and Accountability Act: This is a federal statute that provides employees with the ability to change jobs while continuing health insurance coverage for themselves and their families. The legislation limits pre-existing condition exclusions by treating all group insurance as a single coverage pool for eligibility. Time covered by one plan is transferable to every other policy as long as there’s no gap in coverage of 63 days or longer.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is an organization that offers comprehensive prepaid health care services to its subscribing members. _____ emphasize preventative care, but they also combine the delivery and financing of healthcare. Subscribers pay a fixed periodic fee rather than a fee per service.”","o":["Health Insurance Portability and Accountability Act Privacy Rule","Taft-Hartley Trusts","Health Maintenance Organizations","Certificate of Insurance"],"a":2,"e":"Health Maintenance Organizations: This is an organization that offers comprehensive prepaid health care services to its subscribing members. HMOs emphasize preventative care, but they also combine the delivery and financing of healthcare. Subscribers pay a fixed periodic fee rather than a fee per service.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “Unlike individual policies, group plans continue in existence despite the fact that individual participants may leave or join.”","o":["Capitation","Increased Persistency","Blue Cross and Blue Shield","Health Insurance Portability and Accountability Act"],"a":1,"e":"Increased Persistency: Unlike individual policies, group plans continue in existence despite the fact that individual participants may leave or join.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “These HMOs are characterized by a network of physicians who work out of their own facilities and partic_____te in the HMO on a part-time basis.”","o":["Contributory Plan","Master Policy owner","Independent Practice Association HMOs –","Non-Scheduled Dental Plan"],"a":2,"e":"Independent Practice Association HMOs –: These HMOs are characterized by a network of physicians who work out of their own facilities and participate in the HMO on a part-time basis.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is the group insurance policy that’s issued to the group sponsor by the insurance company.”","o":["Blue Cross and Blue Shield","Non-Contributory Plan","Master Policy","Master Contract"],"a":3,"e":"Master Contract: This is the group insurance policy that’s issued to the group sponsor by the insurance company.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is the group sponsor that has entered into a contract for group insurance with an insurance company. The sponsor is the policy owner and is responsible for premium payments. The employer may pay the entire premium or may require contributions from each member to cover the insurance cost.”","o":["Health Insurance Portability and Accountability Act Privacy Rule","Master Policy owner","Taft-Hartley Trusts","Blue Cross and Blue Shield"],"a":1,"e":"Master Policy owner: This is the group sponsor that has entered into a contract for group insurance with an insurance company. The sponsor is the policy owner and is responsible for premium payments. The employer may pay the entire premium or may require contributions from each member to cover the insurance cost.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This network is a form of HMO in which providers deliver services while working out of their own offices on a part-time basis.”","o":["Capitation","Independent Practice Association HMOs –","Retrospective Review","Open-Panel Network"],"a":3,"e":"Open-Panel Network: This network is a form of HMO in which providers deliver services while working out of their own offices on a part-time basis.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This plan combines in-network care that’s similar to an HMO with limited out-of-network care resembling an indemnity plan.”","o":["Contributory Plan","Point of Services Plan","Non-Contributory Plan","Non-Scheduled Dental Plan"],"a":1,"e":"Point of Services Plan: This plan combines in-network care that’s similar to an HMO with limited out-of-network care resembling an indemnity plan.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This typically involves evaluating an individual’s overall health before being hospitalized for surgery to determine whether the requested treatment is medically necessary.”","o":["Co-Payment or Co-Pay","Community Rating","Pre-Admission Certification","Administration Services Only Plan"],"a":2,"e":"Pre-Admission Certification: This typically involves evaluating an individual’s overall health before being hospitalized for surgery to determine whether the requested treatment is medically necessary.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is a sponsored network of health care providers that contract with the _____ to offer their services to _____ subscribers on a fee-for-service basis at prearranged discount prices.”","o":["Dental Insurance","Health Maintenance Organizations","Exclusive Provider Organization","Preferred Provider Organization"],"a":3,"e":"Preferred Provider Organization: This is a sponsored network of health care providers that contract with the PPO to offer their services to PPO subscribers on a fee-for-service basis at prearranged discount prices.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “As an amendment to the Civil Rights Act of 1964, this act requires that women who are affected by a pregnancy, childbirth, or related medical conditions (e.g., abortion) be treated the same as any other person for employment-related purposes.”","o":["Consolidated Omnibus Budget Reconciliation Act","Accidental Results","Extension of Benefits","Pregnancy Discrimination Act of 1978"],"a":3,"e":"Pregnancy Discrimination Act of 1978: As an amendment to the Civil Rights Act of 1964, this act requires that women who are affected by a pregnancy, childbirth, or related medical conditions (e.g., abortion) be treated the same as any other person for employment-related purposes.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is a doctor who provides general medical care for individual network members (typically of HMOs or POS plans) and controls all of their referrals for specialized care.”","o":["Franchise Insurance","Conversion Privilege","Master Policy","Primary Care Physician"],"a":3,"e":"Primary Care Physician: This is a doctor who provides general medical care for individual network members (typically of HMOs or POS plans) and controls all of their referrals for specialized care.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is a form of utilization review that involves analyzing a case before admission to determine the type of treatment that’s necessary.”","o":["Contributory Plan","Scheduled Dental Plan","Open-Panel Network","Prospective Review"],"a":3,"e":"Prospective Review: This is a form of utilization review that involves analyzing a case before admission to determine the type of treatment that’s necessary.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This type of event qualifies workers and beneficiaries to access _____ benefits. _____ include termination, disability, death, and divorce.”","o":["Qualifying Event","Extension of Benefits","Pre-Admission Certification","Case Management"],"a":0,"e":"Qualifying Event: This type of event qualifies workers and beneficiaries to access COBRA benefits. Qualifying events include termination, disability, death, and divorce.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is a form of utilization review that occurs after medical treatment is provided.”","o":["Blue Shield","Enrollment Card","Contributory Plan","Retrospective Review"],"a":3,"e":"Retrospective Review: This is a form of utilization review that occurs after medical treatment is provided.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “A _____ is generally defined as a business that has 50 or fewer employees; however, the exact definition varies by state. _____ groups are subject to special regulations.”","o":["Small Employer","Staff Model HMO","Hospital Indemnity Insurance","Non-Scheduled Dental Plan"],"a":0,"e":"Small Employer: A small employer is generally defined as a business that has 50 or fewer employees; however, the exact definition varies by state. Small employer groups are subject to special regulations.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This HMO provides care through physicians and hospitals that are HMO employees.”","o":["Closed-Panel Network","Employee Welfare Benefit Plan","Blue Cross","Staff Model HMO"],"a":3,"e":"Staff Model HMO: This HMO provides care through physicians and hospitals that are HMO employees.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “These are trusts that are negotiated trusteeships resulting from collective bargaining between a labor union and employer.”","o":["Qualifying Event","Pregnancy Discrimination Act of 1978","Small Employer","Taft-Hartley Trusts"],"a":3,"e":"Taft-Hartley Trusts: These are trusts that are negotiated trusteeships resulting from collective bargaining between a labor union and employer.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This is an independent organization that provides administrative services for group insurance sponsors that find it more cost-effective than handling such functions in-house.”","o":["Third-Party Administrators","Non-Contributory Plan","Scheduled Dental Plan","Health Maintenance Organizations"],"a":0,"e":"Third-Party Administrators: This is an independent organization that provides administrative services for group insurance sponsors that find it more cost-effective than handling such functions in-house.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “This represents the minimum projected percentage of medical costs that are likely to be covered by a medical expense policy.”","o":["Plan A","Cash Surrender Value Rider","Impairment Rider","Actuarial Value"],"a":3,"e":"Actuarial Value: This represents the minimum projected percentage of medical costs that are likely to be covered by a medical expense policy.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a health insurance policy that provides “first dollar” benefits for specified (and limited) health care.”","o":["Intermediate Care","Social Insurance","Basic Medical Expense Insurance","Limited Health Insurance Policy"],"a":2,"e":"Basic Medical Expense Insurance: This is a health insurance policy that provides “first dollar” benefits for specified (and limited) health care.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This policy provides coverage for non-surgical services that are provided by a physician.”","o":["Basic Physician Expense Insurance","Basic Medical Expense Insurance","Basic Surgical Expense Policies","Social Insurance"],"a":0,"e":"Basic Physician Expense Insurance: This policy provides coverage for non-surgical services that are provided by a physician.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “These policies pay for the costs of surgeons’ services, regardless of whether the surgery is performed in or out of the hospital. Coverage also includes anesthesiologist fees.”","o":["Indemnity Plans","Basic Physician Expense Insurance","Basic Surgical Expense Policies","Comprehensive Policies"],"a":2,"e":"Basic Surgical Expense Policies: These policies pay for the costs of surgeons’ services, regardless of whether the surgery is performed in or out of the hospital. Coverage also includes anesthesiologist fees.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the maximum length of time during which a benefit can be paid. The longer the _____, the higher the cost (premium) of the policy. Rather than charging additional premiums or excluding coverage when issuing a disability income policy to a substandard risk, an insurer may shorten the _____.”","o":["Predetermination of Benefits","Benefit Trigger","Rehabilitation Benefit","Benefit Period"],"a":3,"e":"Benefit Period: This is the maximum length of time during which a benefit can be paid. The longer the benefit period, the higher the cost (premium) of the policy. Rather than charging additional premiums or excluding coverage when issuing a disability income policy to a substandard risk, an insurer may shorten the benefit period.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “As defined by the ACA, this is a metal tier plan that has an actuarial value that is projected to cover 60% of typical medical costs.”","o":["High Deductible Health Plan","Home Care","Bronze Plan","Health Insurance Exchange"],"a":2,"e":"Bronze Plan: As defined by the ACA, this is a metal tier plan that has an actuarial value that is projected to cover 60% of typical medical costs.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “These are benefit arrangements that are developed for businesses in the United States so that they can offer a variety of employee benefits, including accident and health insurance, on a pretax basis. Employees can choose from a menu of benefits, thereby tailoring the benefits package to their specific needs.”","o":["Indemnity Plans","Cafeteria Plans","Guaranteed Renewable","Non-Cancelable"],"a":1,"e":"Cafeteria Plans: These are benefit arrangements that are developed for businesses in the United States so that they can offer a variety of employee benefits, including accident and health insurance, on a pretax basis. Employees can choose from a menu of benefits, thereby tailoring the benefits package to their specific needs.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a plan that has three elements—(1) It has a tax-advantaged (pre-tax) savings vehicle, (2) it has a corridor or integrated deductible, and (3) it has a qualifying high deductible insurance policy.”","o":["Platinum Plan","Silver Plan","Limited Health Insurance Policy","Consumer Driven Health Plan"],"a":3,"e":"Consumer Driven Health Plan: This is a plan that has three elements—(1) It has a tax-advantaged (pre-tax) savings vehicle, (2) it has a corridor or integrated deductible, and (3) it has a qualifying high deductible insurance policy.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the stated unit valuation (dollars-per-unit) which is used to determine the benefit for each procedure that’s covered by a basic surgical policy.”","o":["Non-Cancelable","Informal Care","Coordination of Benefits","Conversion Factor"],"a":3,"e":"Conversion Factor: This is the stated unit valuation (dollars-per-unit) which is used to determine the benefit for each procedure that’s covered by a basic surgical policy.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the amount of an expense or loss that’s paid by the insured before a health insurance policy begins to pay benefits.”","o":["Deductible","Cognitive Impairment","Core Benefits","Sickness"],"a":0,"e":"Deductible: This is the amount of an expense or loss that’s paid by the insured before a health insurance policy begins to pay benefits.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “These are a list of 10 coverages that do not have a lifetime or annual cap. The ACA defined these as necessary benefits for all major medical insurance.”","o":["Essential Health Benefits","Consumer Driven Health Plan","Health Insurance Exchange","Core Benefits"],"a":0,"e":"Essential Health Benefits: These are a list of 10 coverages that do not have a lifetime or annual cap. The ACA defined these as necessary benefits for all major medical insurance.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a stated dollar amount that applies to a covered loss (e.g., $500). This deductible can be applied per occurrence, per insured, or per year.”","o":["Flat Deductible","High Deductible Health Plan","Guarantee of Insurability Option","Indemnify"],"a":0,"e":"Flat Deductible: This is a stated dollar amount that applies to a covered loss (e.g., $500). This deductible can be applied per occurrence, per insured, or per year.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “These are tax-advantaged accounts that are set up through an employer’s cafeteria plan. _____ allow employees to set aside a portion of their earnings for qualified medical expenses on a “use it or lose it” basis.”","o":["Health Reimbursement Accounts","Flexible Spending Accounts","Cash Surrender Value Rider","Indemnify"],"a":1,"e":"Flexible Spending Accounts: These are tax-advantaged accounts that are set up through an employer’s cafeteria plan. FSAs allow employees to set aside a portion of their earnings for qualified medical expenses on a “use it or lose it” basis.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This refers to insurance policies that pay for claims without imposing a deductible.”","o":["Limited Health Insurance Policy","Portability","Basic Medical Expense Insurance","First Dollar Coverage"],"a":3,"e":"First Dollar Coverage: This refers to insurance policies that pay for claims without imposing a deductible.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “As defined by the ACA, this is a metal tier plan that has an actuarial value that is projected to cover 80% of typical medical costs.”","o":["Consumer Driven Health Plan","Conversion Factor","Waiver of Premium","Gold Plan"],"a":3,"e":"Gold Plan: As defined by the ACA, this is a metal tier plan that has an actuarial value that is projected to cover 80% of typical medical costs.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a federal website that allows consumers to check their eligibility for government assistance programs. The site allows consumers to compare health insurance plans and also purchase health insurance.”","o":["Health and Accident Insurance","Consumer Driven Health Plan","Health Insurance Exchange","Limited Health Insurance Policy"],"a":2,"e":"Health Insurance Exchange: This is a federal website that allows consumers to check their eligibility for government assistance programs. The site allows consumers to compare health insurance plans and also purchase health insurance.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This rule provides federal protections for an individual’s health information and gives patients various rights with respect to that information.”","o":["Blanket Insurance","Blue Cross and Blue Shield","Pregnancy Discrimination Act of 1978","Health Insurance Portability and Accountability Act Privacy Rule"],"a":3,"e":"Health Insurance Portability and Accountability Act Privacy Rule: This rule provides federal protections for an individual’s health information and gives patients various rights with respect to that information.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “These are employer-funded and employer-established, tax-advantaged health benefit plans that reimburse employees for out-of-pocket medical expenses and individual health insurance premiums. These plans are not portable.”","o":["Health Reimbursement Accounts","Consumer Driven Health Plan","Health and Accident Insurance","Health Insurance Exchange"],"a":0,"e":"Health Reimbursement Accounts: These are employer-funded and employer-established, tax-advantaged health benefit plans that reimburse employees for out-of-pocket medical expenses and individual health insurance premiums. These plans are not portable.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a maj
