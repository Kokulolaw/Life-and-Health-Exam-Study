or medical policy that makes the cost of basic expenses (other than preventative care that’s mandated by the ACA) the insured’s responsibility. At the same time, the policy also establishes an annual limit on out-of-pocket costs.”","o":["Silver Plan","Health and Accident Insurance","Consumer Driven Health Plan","High Deductible Health Plan"],"a":3,"e":"High Deductible Health Plan: This is a major medical policy that makes the cost of basic expenses (other than preventative care that’s mandated by the ACA) the insured’s responsibility. At the same time, the policy also establishes an annual limit on out-of-pocket costs. The IRS sets the minimum annual deductible and the maximum out-of-pocket cost for all HDHPs that qualify for use with an HSA.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “Insurers add an _____ to health insurance policies that permanently exclude claims related to a health-related condition that’s disclosed by the insured during the application process.”","o":["Accident","Cognitive Impairment","Pool of Money","Impairment Rider"],"a":3,"e":"Impairment Rider: Insurers add an impairment rider to health insurance policies that permanently exclude claims related to a health-related condition that’s disclosed by the insured during the application process.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “These are annual limits on coverage for specific, covered services.”","o":["Health Reimbursement Accounts","Shopper’s Guide","Duplication of Coverage","Internal Limits"],"a":3,"e":"Internal Limits: These are annual limits on coverage for specific, covered services.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the defined period immediately preceding the beginning of coverage during which an insurer can identify a health concern as a pre-existing condition that’s subject to the terms of applicable policy provisions.”","o":["Look-Back Period","Pool of Money","Formal Care","Restorative or Restoration Benefits"],"a":0,"e":"Look-Back Period: This is the defined period immediately preceding the beginning of coverage during which an insurer can identify a health concern as a pre-existing condition that’s subject to the terms of applicable policy provisions.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the most that an insured must pay for covered services in a single plan year.”","o":["Out-of-Pocket Maximum","Periodontics","Indemnity Plans","Gold Plan"],"a":0,"e":"Out-of-Pocket Maximum: This is the most that an insured must pay for covered services in a single plan year.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “As defined by the ACA, this metal tier plan has an actuarial value that’s projected to cover 90% of typical medical costs.”","o":["Gold Plan","Platinum Plan","Accident","Bronze Plan"],"a":1,"e":"Platinum Plan: As defined by the ACA, this metal tier plan has an actuarial value that’s projected to cover 90% of typical medical costs.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This describes the ability to retain a group benefit after a person leaves the original group for other employment.”","o":["Additional Monthly Benefit","Limited Risk Policy","Sickness","Portability"],"a":3,"e":"Portability: This describes the ability to retain a group benefit after a person leaves the original group for other employment.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “As defined by the ACA, this metal tier plan has an actuarial value that’s projected to cover 70% of typical medical costs.”","o":["Silver Plan","First Dollar Coverage","High Deductible Health Plan","Gold Plan"],"a":0,"e":"Silver Plan: As defined by the ACA, this metal tier plan has an actuarial value that’s projected to cover 70% of typical medical costs.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “Traditionally, this is the maximum amount of co-insurance that’s paid by an insured for one year. Today, the term “_____” is often used interchangeably with the phrase “out-of-pocket maximum.””","o":["Health Maintenance Organizations","Stop-Loss","Extension of Benefits","Master Policy owner"],"a":1,"e":"Stop-Loss: Traditionally, this is the maximum amount of co-insurance that’s paid by an insured for one year. Today, the term “stop-loss” is often used interchangeably with the phrase “out-of-pocket maximum.”","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “Plans that use this approach compare expenses to what’s deemed reasonable and _____ for the geographical region of the country in which the service was performed.”","o":["Essential Health Benefits","Pediatric Dentistry","Usual, Customary, and Reasonable","Health and Accident Insurance"],"a":2,"e":"Usual, Customary, and Reasonable: Plans that use this approach compare expenses to what’s deemed reasonable and customary for the geographical region of the country in which the service was performed.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is an unintended consequence of an action that the insured takes, even if undertaken voluntarily. Policies that use the _____ provision are policies because they only require for the result of the injury to be unexpected and unintended. This definition is far less restrictive than the accidental means definition.”","o":["Blue Cross and Blue Shield","Accidental Results","Certificate of Insurance","Extension of Benefits"],"a":1,"e":"Accidental Results: This is an unintended consequence of an action that the insured takes, even if undertaken voluntarily. Policies that use the accidental bodily injury provision are referred to as “accidental results” policies because they only require for the result of the injury to be unexpected and unintended. This definition is far less restrictive than the accidental means definition.","t":"Group, Managed Care & Specialty Plans","k":"d","g":0},{"q":"Which term matches this definition? “The _____ rider can supplement employer-provided disability benefits, cover gaps in Social Security Disability Insurance (SSDI), or help pay for extra initial expenses if a person becomes disabled.”","o":["Portability","Additional Monthly Benefit","Non-Occupational Coverage","Interim Coverage"],"a":1,"e":"Additional Monthly Benefit: The AMB rider can supplement employer-provided disability benefits, cover gaps in Social Security Disability Insurance (SSDI), or help pay for extra initial expenses if a person becomes disabled.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This phrase is an essential part of the Social Security definition of disability.”","o":["Automatic Inflation Rider","Substantial Duties","Any Substantial Gainful Work","Non-Cancelable"],"a":2,"e":"Any Substantial Gainful Work: This phrase is an essential part of the Social Security definition of disability. The law defines disability as the inability to do any substantial gainful work due to any medically determinable physical or mental impairment which can be expected to result in death, or which has lasted or can be expected to last for a continuous period of not less than 12 months.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “For a policy to provide disability income benefits, the definition of total disability requires the insured to be unable to perform any job for which that insured is “reasonably suited by reason of education, training, or experience.” See “_____ for Which the Insured is Reasonably Suited.””","o":["Any Occupation","Cash Surrender Value Rider","Orthodontics","Any Substantial Gainful Work"],"a":0,"e":"Any Occupation: For a policy to provide disability income benefits, the definition of total disability requires the insured to be unable to perform any job for which that insured is “reasonably suited by reason of education, training, or experience.” See “Any Occupation for Which the Insured is Reasonably Suited.”","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This rider returns all premiums to the policy owner at age 65 if no claims have been made.”","o":["Cash Surrender Value Rider","Intermediate Care","Lifetime Extension Rider","Automatic Inflation Rider"],"a":0,"e":"Cash Surrender Value Rider: This rider returns all premiums to the policy owner at age 65 if no claims have been made.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the process that’s used to determine the order in which insurance companies pay a claim. It’s used both among group insurance companies and in conjunction with social insurance. The primary insurer pays all claims as if it were the only carrier.”","o":["Predetermination of Benefits","Coordination of Benefits","Pool of Money","Duplication of Coverage"],"a":1,"e":"Coordination of Benefits: This is the process that’s used to determine the order in which insurance companies pay a claim. It’s used both among group insurance companies and in conjunction with social insurance. The primary insurer pays all claims as if it were the only carrier. The coverage that’s designated as “contingent” will cover the remaining balance.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “These contracts cover a fixed period that starts on the date they’re issued. As the time elapses, the remaining number of potential monthly benefit payments also decreases until it reaches zero. Credit disability policies are a form of _____.”","o":["Own Occupation","Credit Disability","Residual Disability","Decreasing Term Disability Policy"],"a":3,"e":"Decreasing Term Disability Policy: These contracts cover a fixed period that starts on the date they’re issued. As the time elapses, the remaining number of potential monthly benefit payments also decreases until it reaches zero. Credit disability policies are a form of decreasing term disability policy.","t":"Disability Income","k":"d","g":0},{"q":"Which term matches this definition? “This is a form of a buy-sell agreement that’s funded by insurance policies. This contractual agreement uses disability policy funds to purchase an owner’s share of a business if that owner becomes disabled.”","o":["Permanent Disability","Own Occupation","Disability Buyout Plan","Partial Disability"],"a":2,"e":"Disability Buyout Plan: This is a form of a buy-sell agreement that’s funded by insurance policies. This contractual agreement uses disability policy funds to purchase an owner’s share of a business if that owner becomes disabled.","t":"Disability Income","k":"d","g":0},{"q":"Which term matches this definition? “These are payroll taxes that are paid by both employees and their employers and are used to fund Social Security.”","o":["Medicare Select","Medicare","Federal Insurance Contributions Act Taxes","Primary Insurance Amount"],"a":2,"e":"Federal Insurance Contributions Act Taxes: These are payroll taxes that are paid by both employees and their employers and are used to fund Social Security.","t":"Medicare, Social Security & Government Programs","k":"d","g":0},{"q":"Which term matches this definition? “With this approach, even if the insured’s earnings change, the policy benefit remains the same unless the insured purchases a rider that can be used to change the benefit. This is most commonly used in individual insurance contracts.”","o":["Guarantee of Insurability Option","Flat Amount Approach","Informal Care","Limited Health Insurance Policy"],"a":1,"e":"Flat Amount Approach: With this approach, even if the insured’s earnings change, the policy benefit remains the same unless the insured purchases a rider that can be used to change the benefit. This is most commonly used in individual insurance contracts. In fact, policies utilizing this approach define the policy benefit as a fixed dollar amount per month.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This term is used by the Social Security Administration to describe individuals who are eligible for Social Security retirement and disability benefits. Eligibility is based on paying a sufficient amount in payroll taxes for the minimum number of calendar quarters.”","o":["Material Duties","Interim Coverage","Fully Insured","Actuarial Value"],"a":2,"e":"Fully Insured: This term is used by the Social Security Administration to describe individuals who are eligible for Social Security retirement and disability benefits. Eligibility is based on paying a sufficient amount in payroll taxes for the minimum number of calendar quarters. Individuals who have paid enough taxes for at least 40 quarters (10 years) attain permanent, fully insured status.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This provision states that the insurer must renew an insurance policy up to the established termination age unless the insured fails to pay the premium. The insurance carrier cannot change the policy terms but can change the premium rate on a class basis (if necessary).”","o":["Platinum Plan","Formulary","Flexible Spending Accounts","Guaranteed Renewable"],"a":3,"e":"Guaranteed Renewable: This provision states that the insurer must renew an insurance policy up to the established termination age unless the insured fails to pay the premium. The insurance carrier cannot change the policy terms but can change the premium rate on a class basis (if necessary).","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This rider extends the benefit period beyond the age of 65.”","o":["Comprehensive Policies","Lifetime Reserve Days","Cash Surrender Value Rider","Lifetime Extension Rider"],"a":3,"e":"Lifetime Extension Rider: This rider extends the benefit period beyond the age of 65.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a disability income insurance policy that’s characterized by monthly benefit payments and a benefit period of two or more years.”","o":["Partial Disability","Long-Term Disability Insurance Policy","Permanent Disability","Own Occupation"],"a":1,"e":"Long-Term Disability Insurance Policy: This is a disability income insurance policy that’s characterized by monthly benefit payments and a benefit period of two or more years.","t":"Disability Income","k":"d","g":0},{"q":"Which term matches this definition? “This test requires a loss of income for there to be a compensable claim. If the insured can earn as much as his pre-disability income, despite the inability to perform the duties of his former profession, then there’s no loss and no claim to pay.”","o":["Guarantee of Insurability Option","Loss of Earnings Test","Pool of Money","Duplication of Coverage"],"a":1,"e":"Loss of Earnings Test: This test requires a loss of income for there to be a compensable claim. If the insured can earn as much as his pre-disability income, despite the inability to perform the duties of his former profession, then there’s no loss and no claim to pay.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This refers to the actual tasks or activities that a person must complete in the course of doing her job.”","o":["Plan A","Orthodontics","Material Duties","Shopper’s Guide"],"a":2,"e":"Material Duties: This refers to the actual tasks or activities that a person must complete in the course of doing her job.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This provision states that the insurer must renew an insurance policy up to the established termination age unless the insured fails to pay the premium. Also, the insurance carrier can neither change the policy terms nor the premium rate.”","o":["Non-Cancelable","Health and Accident Insurance","Rehabilitation Benefit","Affordable Care Act"],"a":0,"e":"Non-Cancelable: This provision states that the insurer must renew an insurance policy up to the established termination age unless the insured fails to pay the premium. Also, the insurance carrier can neither change the policy terms nor the premium rate.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is coverage that is provided by a disability income policy that doesn’t provide benefits for losses occurring due to the insured’s employment.”","o":["Non-Occupational Coverage","Cafeteria Plans","Interim Coverage","Social Insurance"],"a":0,"e":"Non-Occupational Coverage: This is coverage that is provided by a disability income policy that doesn’t provide benefits for losses occurring due to the insured’s employment.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This term applies when determining a person’s disability. Total disability requires the insured to be unable to work at the insured’s _____ in order to receive disability income benefits.”","o":["Credit Disability","Residual Disability","Own Occupation","Partial Disability"],"a":2,"e":"Own Occupation: This term applies when determining a person’s disability. Total disability requires the insured to be unable to work at the insured’s own occupation in order to receive disability income benefits.","t":"Disability Income","k":"d","g":0},{"q":"Which term matches this definition? “This occurs when an illness or injury prevents an insured from performing one or more (but not all) of the key duties of the insured’s own occupation. Alternatively, _____ can also be defined as the insured’s inability to work at his job on a full-time basis.”","o":["Residual Disability","Partial Disability","Disability Buyout Plan","Long-Term Disability Insurance Policy"],"a":1,"e":"Partial Disability: This occurs when an illness or injury prevents an insured from performing one or more (but not all) of the key duties of the insured’s own occupation. Alternatively, partial disability can also be defined as the insured’s inability to work at his job on a full-time basis. In either case, a covered loss occurs if the result is a decrease in the insured’s income.","t":"Disability Income","k":"d","g":0},{"q":"Which term matches this definition? “This term is used in Workers’ Compensation to describe a condition that’s considered to be permanent in nature. It may include cases of dismemberment or a chronic disabling condition. The benefit may be a lump-sum payment or weekly income.”","o":["Own Occupation","Long-Term Disability Insurance Policy","Permanent Disability","Partial Disability"],"a":2,"e":"Permanent Disability: This term is used in Workers’ Compensation to describe a condition that’s considered to be permanent in nature. It may include cases of dismemberment or a chronic disabling condition. The benefit may be a lump-sum payment or weekly income.","t":"Disability Income","k":"d","g":0},{"q":"Which term matches this definition? “This is the basic monthly benefit that’s available to covered individuals. Social Security bases the _____ on a person’s income and the amount of taxes on that income.”","o":["Medicare Part B","Medicare Select","Primary Insurance Amount","Federal Insurance Contributions Act Taxes"],"a":2,"e":"Primary Insurance Amount: This is the basic monthly benefit that’s available to covered individuals. Social Security bases the PIA on a person’s income and the amount of taxes on that income.","t":"Medicare, Social Security & Government Programs","k":"d","g":0},{"q":"Which term matches this definition? “This is a specified number of days (typically from seven to 30) beginning on the effective date of an insurance policy. During this period, the policy only covers accidents. It excludes any losses or claims resulting from sickness during this time.”","o":["Oral Pathology","Look-Back Period","Continuing Care","Probationary Period"],"a":3,"e":"Probationary Period: This is a specified number of days (typically from seven to 30) beginning on the effective date of an insurance policy. During this period, the policy only covers accidents. It excludes any losses or claims resulting from sickness during this time. The exclusion of claims due to sickness is important because a person can be ill (infected with a disease) before the illness becomes manifest. This provision is designed…","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This refers to the ways that multiple insurers share responsibility for a claim they both cover. Each carrier covers a proportional amount of the claim based on its percentage of the available insurance.”","o":["High-Pressure Tactics","Social Insurance","Additional Monthly Benefit","Pro-Rata"],"a":3,"e":"Pro-Rata: This refers to the ways that multiple insurers share responsibility for a claim they both cover. Each carrier covers a proportional amount of the claim based on its percentage of the available insurance.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This benefit facilitates vocational training to prepare an insured for a new occupation. With some disabilities, insureds may not be able to return to their previous employment but can still work at some kind of job.”","o":["Health and Accident Insurance","Platinum Plan","Additional Monthly Benefit","Rehabilitation Benefit"],"a":3,"e":"Rehabilitation Benefit: This benefit facilitates vocational training to prepare an insured for a new occupation. With some disabilities, insureds may not be able to return to their previous employment but can still work at some kind of job. Under the rehabilitation benefit, the insurer will pay the approved cost of a rehabilitation program to help the disabled insured return to work.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This clause applies when a person has more than one policy that covers the same disability claim. It states that the total benefit cannot be more than the income lost. Each insurer pays a pro-rata share of the total amount paid.”","o":["Duplication of Coverage","Social Insurance","Relation of Earnings to Insurance","Limited Health Insurance Policy"],"a":2,"e":"Relation of Earnings to Insurance: This clause applies when a person has more than one policy that covers the same disability claim. It states that the total benefit cannot be more than the income lost. Each insurer pays a pro-rata share of the total amount paid.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is related to the proportional disability benefit that a person collects while working less than full time and suffering an income loss of at least 20%. Insurance companies base _____ income payments on the proportion of income that the insured has lost.”","o":["Residual Disability","Permanent Disability","Decreasing Term Disability Policy","Partial Disability"],"a":0,"e":"Residual Disability: This is related to the proportional disability benefit that a person collects while working less than full time and suffering an income loss of at least 20%. Insurance companies base residual disability income payments on the proportion of income that the insured has lost.","t":"Disability Income","k":"d","g":0},{"q":"Which term matches this definition? “This refers to a person’s essential capabilities which make it possible to do her job.”","o":["Proof of Loss","Deductible","Substantial Duties","Endodontics"],"a":2,"e":"Substantial Duties: This refers to a person’s essential capabilities which make it possible to do her job.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is activated when an insured is disabled and begins receiving benefits. The insurance company waives premium payments during a disability and keeps the policy in force. The disability must meet the definition that’s stipulated in the policy and must continue through the waiting period.”","o":["Proof of Loss","Loss of Earnings Test","Waiver of Premium","Guarantee of Insurability Option"],"a":2,"e":"Waiver of Premium: This is activated when an insured is disabled and begins receiving benefits. The insurance company waives premium payments during a disability and keeps the policy in force. The disability must meet the definition that’s stipulated in the policy and must continue through the waiting period. The waiver is NOT a loan; instead, the insurance company is “waiving” the premiums.” It’s just as if the premiums were being…","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a form of liability insurance that provides benefits to workers who are harmed by work-related occurrences.”","o":["Federal Insurance Contributions Act Taxes","Medicare Part A","Workers’ Compensation","Primary Insurance Amount"],"a":2,"e":"Workers’ Compensation: This is a form of liability insurance that provides benefits to workers who are harmed by work-related occurrences.","t":"Medicare, Social Security & Government Programs","k":"d","g":0},{"q":"Which term matches this definition? “This is a type of care (typically custodial) that’s designed for individuals who require assistance with various activities of daily living while their primary caregivers are absent. This type of care is offered in care centers.”","o":["Custodial Care","Adult Day Care","Tax-Qualified Long-Term Care Insurance Contract","Home Health Care"],"a":1,"e":"Adult Day Care: This is a type of care (typically custodial) that’s designed for individuals who require assistance with various activities of daily living while their primary caregivers are absent. This type of care is offered in care centers.","t":"Long-Term Care","k":"d","g":0},{"q":"Which term matches this definition? “This is a residential community that provides some services but is more limited than a nursing home. This type of facility provides services such as housekeeping, meals, social activities, as well as intermittent nursing care.”","o":["Nursing Home","Assisted Living Facility","Adult Day Care","Tax-Qualified Long-Term Care Insurance Contract"],"a":1,"e":"Assisted Living Facility: This is a residential community that provides some services but is more limited than a nursing home. This type of facility provides services such as housekeeping, meals, social activities, as well as intermittent nursing care.","t":"Long-Term Care","k":"d","g":0},{"q":"Which term matches this definition? “This rider causes the face amount of a long-term care insurance policy to increase annually, generally at 5% per year for a specified number of years. The cost of these increases is built into the initial premium.”","o":["Automatic Inflation Rider","Lifetime Extension Rider","Home Care","Impairment Rider"],"a":0,"e":"Automatic Inflation Rider: This rider causes the face amount of a long-term care insurance policy to increase annually, generally at 5% per year for a specified number of years. The cost of these increases is built into the initial premium.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “In a long-term care insurance policy, the benefits are activated by either a person’s loss of the ability to perform two or more of the activities of daily living or the existence of a cognitive impairment.”","o":["Cash Surrender Value Rider","Benefit Trigger","Health Insurance Exchange","Health and Accident Insurance"],"a":1,"e":"Benefit Trigger: In a long-term care insurance policy, the benefits are activated by either a person’s loss of the ability to perform two or more of the activities of daily living or the existence of a cognitive impairment.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a deficiency in a person’s memory, orientation to her environment, or ability to reason and make safe judgments. Long-term care insurance policies only cover the _____ that are the result of the organic diseases of aging.”","o":["Predetermination of Benefits","Non-Cancelable","Impairment Rider","Cognitive Impairment"],"a":3,"e":"Cognitive Impairment: This is a deficiency in a person’s memory, orientation to her environment, or ability to reason and make safe judgments. Long-term care insurance policies only cover the cognitive impairments that are the result of the organic diseases of aging.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the illegal practice of using marketing that doesn’t disclose that a sales agent may call when a person responds to a marketing campaign.”","o":["Cold Lead Advertising","Target Premium","403 Plan","Partial Disability"],"a":0,"e":"Cold Lead Advertising: This is the illegal practice of using marketing that doesn’t disclose that a sales agent may call when a person responds to a marketing campaign.","t":"State Law, Licensing & Ethics","k":"d","g":0},{"q":"Which term matches this definition? “This type of care is designed to provide benefits to elderly individuals who live in a _____ retirement community.”","o":["Informal Care","Continuing Care","Formal Care","Affordable Care Act"],"a":1,"e":"Continuing Care: This type of care is designed to provide benefits to elderly individuals who live in a continuing care retirement community.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “These are the benefits that are defined in law and regulation that all Medicare Supplement plans must offer to meet the definition of a Medicare Supplement plan.”","o":["Predetermination of Benefits","Core Benefits","Restorative or Restoration Benefits","Primary Insurer"],"a":1,"e":"Core Benefits: These are the benefits that are defined in law and regulation that all Medicare Supplement plans must offer to meet the definition of a Medicare Supplement plan.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the level of care that’s given to meet daily personal needs, such as dressing, bathing, getting out of bed, and eating; however, it’s not medical care. Although medical training is not required, this care must be administered under a physician’s order.”","o":["Custodial Care","Hybrid Long-Term Care Plans","Respite Care","Home Health Care"],"a":0,"e":"Custodial Care: This is the level of care that’s given to meet daily personal needs, such as dressing, bathing, getting out of bed, and eating; however, it’s not medical care. Although medical training is not required, this care must be administered under a physician’s order.","t":"Long-Term Care","k":"d","g":0},{"q":"Which term matches this definition? “This refers to a corridor deductible that’s built into Medicare Part D prescription drug plans between a person’s basic coverage and catastrophic coverage. These coverage zones are defined by the cost of a person’s prescription over the course of the year.”","o":["Conversion Factor","Non-Cancelable","Predetermination of Benefits","Donut Hole"],"a":3,"e":"Donut Hole: This refers to a corridor deductible that’s built into Medicare Part D prescription drug plans between a person’s basic coverage and catastrophic coverage. These coverage zones are defined by the cost of a person’s prescription over the course of the year. In 2021, the basic coverage zone included the cost of medication up to $4,130 ($4,430 in 2022). In the same year, catastrophic coverage begins at $6,550 ($7,050…","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “It’s illegal to sell a second Medigap policy to a person who already has one (other than a replacement).”","o":["Guarantee of Insurability Option","Pool of Money","Duplication of Coverage","Loss of Earnings Test"],"a":2,"e":"Duplication of Coverage: It’s illegal to sell a second Medigap policy to a person who already has one (other than a replacement).","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This refers to the point in the progressive deterioration of a person’s kidney when dialysis or a kidney transplant is necessary to sustain her life.”","o":["Primary Insurer","Periodontics","End-Stage Renal Disease","Indemnify"],"a":2,"e":"End-Stage Renal Disease: This refers to the point in the progressive deterioration of a person’s kidney when dialysis or a kidney transplant is necessary to sustain her life.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the paid care that’s delivered by professional caregivers. The care includes medical assistance from nurses or allied professions such as nutritionists and physical therapists; it also refers to help with personal activities and household tasks, such as what a person may receive from a personal care assistant.”","o":["Home Care","Formal Care","Usual, Customary, and Reasonable","Hospice Care"],"a":1,"e":"Formal Care: This is the paid care that’s delivered by professional caregivers. The care includes medical assistance from nurses or allied professions such as nutritionists and physical therapists; it also refers to help with personal activities and household tasks, such as what a person may receive from a personal care assistant.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This _____ allows the policyholder to purchase additional coverage at designated future intervals. The allowable amount is based on an assumed inflation rate.”","o":["Relation of Earnings to Insurance","Pool of Money","Guarantee of Insurability Option","Proof of Loss"],"a":2,"e":"Guarantee of Insurability Option: This rider allows the policyholder to purchase additional coverage at designated future intervals. The allowable amount is based on an assumed inflation rate.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This refers to an applicant’s insurance policy that cannot be declined for coverage due to an insurability issue. Policies such as Medigap plans must accept all applicants during designated open enrollment periods.”","o":["Basic Physician Expense Insurance","Lifetime Extension Rider","Guaranteed Issue","Informal Care"],"a":2,"e":"Guaranteed Issue: This refers to an applicant’s insurance policy that cannot be declined for coverage due to an insurability issue. Policies such as Medigap plans must accept all applicants during designated open enrollment periods.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This refers to physical assistance with one of the activities of daily living or related tasks.”","o":["Stand-By Assistance","Informal Care","Automatic Inflation Rider","Hands-on Assistance"],"a":3,"e":"Hands-on Assistance: This refers to physical assistance with one of the activities of daily living or related tasks.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “These are actions that use an explicit or implicit threat, excessive pressure, or a climate of fear to affect the sale of a policy.”","o":["High-Pressure Tactics","High Deductible Health Plan","Accident","Health Reimbursement Accounts"],"a":0,"e":"High-Pressure Tactics: These are actions that use an explicit or implicit threat, excessive pressure, or a climate of fear to affect the sale of a policy.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is assistance with the activities of daily living and necessary household tasks. _____ may include both hands-on help and standby assistance. Both forms of support are defined as substantial assistance under the terms of a long-term care insurance policy.”","o":["Home Care","Formal Care","Intermediate Care","Hospice Care"],"a":0,"e":"Home Care: This is assistance with the activities of daily living and necessary household tasks. Home care may include both hands-on help and standby assistance. Both forms of support are defined as substantial assistance under the terms of a long-term care insurance policy.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This level of care can include both skilled and unskilled care that’s provided in an individual’s home, typically on a part-time basis.”","o":["Home Health Care","Long-Term Care Insurance","Hybrid Long-Term Care Plans","Adult Day Care"],"a":0,"e":"Home Health Care: This level of care can include both skilled and unskilled care that’s provided in an individual’s home, typically on a part-time basis. It primarily refers to skilled services provided by healthcare professionals such as medication management, wound care, and physical therapy—particularly when described in contrast to unskilled “home care,” which is personal care in the home.","t":"Long-Term Care","k":"d","g":0},{"q":"Which term matches this definition? “This is comfort care for the dying, which may be delivered in a facility or the patient’s home. Individuals with terminal illnesses who decide to forgo treatment in order to address their terminal disease may instead opt for _____ that makes their final months as comfortable as possible.”","o":["Affordable Care Act","Continuing Care","Hospice Care","Formal Care"],"a":2,"e":"Hospice Care: This is comfort care for the dying, which may be delivered in a facility or the patient’s home. Individuals with terminal illnesses who decide to forgo treatment in order to address their terminal disease may instead opt for hospice care that makes their final months as comfortable as possible.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “These contracts use an annuity or whole life policy to guarantee long-term care benefits. If the policy owner doesn’t need long-term care, the policy owner can either use the annuity income for herself or the whole life insurance for beneficiaries.”","o":["Long-Term Care Insurance","Assisted Living Facility","Hybrid Long-Term Care Plans","Adult Day Care"],"a":2,"e":"Hybrid Long-Term Care Plans: These contracts use an annuity or whole life policy to guarantee long-term care benefits. If the policy owner doesn’t need long-term care, the policy owner can either use the annuity income for herself or the whole life insurance for beneficiaries.","t":"Long-Term Care","k":"d","g":0},{"q":"Which term matches this definition? “This is the personal care a person may receive from informal (unpaid) caregivers, such as family members at home. As a rule, long-term care policies don’t pay for _____. However, many policies do provide a training allowance to help family members deliver effective care.”","o":["Material Duties","Intermediate Care","Informal Care","Hospice Care"],"a":2,"e":"Informal Care: This is the personal care a person may receive from informal (unpaid) caregivers, such as family members at home. As a rule, long-term care policies don’t pay for informal care. However, many policies do provide a training allowance to help family members deliver effective care.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is one of the defined nursing care levels that’s used in long-term care insurance. At times, it’s because _____ is often intermittent. It involves the delivery of limited daily, intermittent (or occasional) nursing and rehabilitative services.”","o":["Home Care","Affordable Care Act","Health Insurance Exchange","Intermediate Care"],"a":3,"e":"Intermediate Care: This is one of the defined nursing care levels that’s used in long-term care insurance. At times, it’s referred to as “intermittent care” because intermediate care is often intermittent. It involves the delivery of limited daily, intermittent (or occasional) nursing and rehabilitative services. Practitioners deliver these services based on a physician’s orders, and the care must be provided by skilled medical…","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a hospital benefit that applies when the insured has used up all of the allotted days of hospital care in a standard benefit period under the terms of Original Medicare Part A. _____ are used once during a person’s lifetime. They’re NOT restored with the beginning of a new benefit period.”","o":["Lifetime Reserve Days","Guarantee of Insurability Option","Lifetime Extension Rider","Bronze Plan"],"a":0,"e":"Lifetime Reserve Days: This is a hospital benefit that applies when the insured has used up all of the allotted days of hospital care in a standard benefit period under the terms of Original Medicare Part A. Lifetime reserve days are used once during a person’s lifetime. They’re NOT restored with the beginning of a new benefit period.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This refers to a broad range of medical, personal, and environmental services that are designed to assist individuals who have lost their ability to remain completely independent in the community.”","o":["Assisted Living Facility","Nursing Home","Long-Term Care","Home Health Care"],"a":2,"e":"Long-Term Care: This refers to a broad range of medical, personal, and environmental services that are designed to assist individuals who have lost their ability to remain completely independent in the community.","t":"Long-Term Care","k":"d","g":0},{"q":"Which term matches this definition? “These riders use a portion of the underlying policy’s face amount to pay a monthly benefit that helps cover the cost of long-term care services.”","o":["Hybrid Long-Term Care Plans","Respite Care","Long-Term Care Riders","Home Health Care"],"a":2,"e":"Long-Term Care Riders: These riders use a portion of the underlying policy’s face amount to pay a monthly benefit that helps cover the cost of long-term care services.","t":"Long-Term Care","k":"d","g":0},{"q":"Which term matches this definition? “This is the federally sponsored and administered program that provides hospital and medical expense insurance, primarily to those who are age 65 and older, any person who has received Social Security Disability Insurance benefits for 24 months, and any person with end-stage renal disease.”","o":["Federal Insurance Contributions Act Taxes","Medicare","Workers’ Compensation","Primary Insurance Amount"],"a":1,"e":"Medicare: This is the federally sponsored and administered program that provides hospital and medical expense insurance, primarily to those who are age 65 and older, any person who has received Social Security Disability Insurance benefits for 24 months, and any person with end-stage renal disease.","t":"Medicare, Social Security & Government Programs","k":"d","g":0},{"q":"Which term matches this definition? “This is the portion of the Original Medicare program that provides coverage of hospital and nursing home care services for eligible individuals. It also provides home health care and hospice services.”","o":["Medicare Part A","Medicare Select","Primary Insurance Amount","Workers’ Compensation"],"a":0,"e":"Medicare Part A: This is the portion of the Original Medicare program that provides coverage of hospital and nursing home care services for eligible individuals. It also provides home health care and hospice services.","t":"Medicare, Social Security & Government Programs","k":"d","g":0},{"q":"Which term matches this definition? “This is the portion of the Original Medicare program that provides coverage for the cost of physicians and other medical services for eligible individuals, including durable medical equipment.”","o":["Medicare Part B","Federal Insurance Contributions Act Taxes","Workers’ Compensation","Medicare Select"],"a":0,"e":"Medicare Part B: This is the portion of the Original Medicare program that provides coverage for the cost of physicians and other medical services for eligible individuals, including durable medical equipment.","t":"Medicare, Social Security & Government Programs","k":"d","g":0},{"q":"Which term matches this definition? “This is a type of Medicare supplement (Medigap) plan which is sold in some states that can be any of the standardized Medigap plans (A-N), but which requires a policyholder to receive services from within a defined network of hospitals and, in some cases, doctors in order to be eligible for full benefits.”","o":["Primary Insurance Amount","Medicare Part A","Medicare Select","Medicare Part B"],"a":2,"e":"Medicare Select: This is a type of Medicare supplement (Medigap) plan which is sold in some states that can be any of the standardized Medigap plans (A-N), but which requires a policyholder to receive services from within a defined network of hospitals and, in some cases, doctors in order to be eligible for full benefits.","t":"Medicare, Social Security & Government Programs","k":"d","g":0},{"q":"Which term matches this definition? “This is a location that’s primarily designed to provide skilled nursing care around the clock.”","o":["Nursing Home","Long-Term Care Insurance","Tax-Qualified Long-Term Care Insurance Contract","Assisted Living Facility"],"a":0,"e":"Nursing Home: This is a location that’s primarily designed to provide skilled nursing care around the clock.","t":"Long-Term Care","k":"d","g":0},{"q":"Which term matches this definition? “This is a medical professional or organization that’s authorized to bill Medicare for services, and that accepts payment (accepts assignment) directly from Medicare and, in doing so, also accepts its schedule fees-for-services.”","o":["Benefit Period","Participating Providers","Special Risk Policy","Flat Deductible"],"a":1,"e":"Participating Providers: This is a medical professional or organization that’s authorized to bill Medicare for services, and that accepts payment (accepts assignment) directly from Medicare and, in doing so, also accepts its schedule fees-for-services.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the most basic of the available Medicare Supplement plans that are offered through private insurers. _____ contains only the Core Benefits.”","o":["Any Occupation","Gold Plan","Silver Plan","Plan A"],"a":3,"e":"Plan A: This is the most basic of the available Medicare Supplement plans that are offered through private insurers. Plan A contains only the Core Benefits.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a concept that describes how long-term care insurance policies define their benefit limits. Although policies describe their benefits in terms of a specific period, that period is based on an assumed daily expenditure.”","o":["Loss of Earnings Test","Pool of Money","Relation of Earnings to Insurance","Duplication of Coverage"],"a":1,"e":"Pool of Money: This is a concept that describes how long-term care insurance policies define their benefit limits. Although policies describe their benefits in terms of a specific period, that period is based on an assumed daily expenditure. If the daily cost of care is less than the specified daily amount, the number of days for which benefits can be received increases.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This underwriting process occurs when an insurer approves all applicants and only underwrites the risk when the insured files a claim.”","o":["Field Underwriting","Post-Claims Underwriting","Underwriting Department","Warranties"],"a":1,"e":"Post-Claims Underwriting: This underwriting process occurs when an insurer approves all applicants and only underwrites the risk when the insured files a claim. This practice can result in the insurance carrier’s denial of the claim based on the information it should have evaluated before the coverage went into effect and policy premiums were paid.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This term applies when more than one group insurance contract or social insurance program covers the same insurable loss. In this situation, the _____ has primary responsibility for covering the loss. The _____ pays the benefits as defined in the applicable contract as if no other insurance coverage can be applied.”","o":["Primary Insurer","Affordable Care Act","Any Occupation","Formal Care"],"a":0,"e":"Primary Insurer: This term applies when more than one group insurance contract or social insurance program covers the same insurable loss. In this situation, the primary insurer has primary responsibility for covering the loss. The primary insurer pays the benefits as defined in the applicable contract as if no other insurance coverage can be applied.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is a type of health or medical care that’s designed to provide a short rest period for a caregiver. It’s characterized by its temporary status.”","o":["Tax-Qualified Long-Term Care Insurance Contract","Long-Term Care Insurance","Home Health Care","Respite Care"],"a":3,"e":"Respite Care: This is a type of health or medical care that’s designed to provide a short rest period for a caregiver. It’s characterized by its temporary status.","t":"Long-Term Care","k":"d","g":0},{"q":"Which term matches this definition? “(See “Buyer’s Guide for Medigap Insurance” or _____ for Long-Term Care Insurance.”)”","o":["Health Insurance Exchange","Silver Plan","Shopper’s Guide","Non-Cancelable"],"a":2,"e":"Shopper’s Guide: (See “Buyer’s Guide for Medigap Insurance” or Shopper’s Guide for Long-Term Care Insurance.”)","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is available assistance that can be readily given in the event a person needs help to safely complete one or more of the activities of daily living. Caretakers provide _____ by being physically present and within one arm’s length of their clients during the activity in question in case help is needed.”","o":["Bronze Plan","Internal Limits","Basic Medical Expense Insurance","Stand-By Assistance"],"a":3,"e":"Stand-By Assistance: This is available assistance that can be readily given in the event a person needs help to safely complete one or more of the activities of daily living. Caretakers provide stand-by assistance by being physically present and within one arm’s length of their clients during the activity in question in case help is needed.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is an individual policy or group plan that satisfies specific criteria as defined by the Health Insurance Portability and Accountability Act (HIPAA). According to HIPAA, qualified LTCI plans have the following characteristics:”","o":["Hybrid Long-Term Care Plans","Nursing Home","Adult Day Care","Tax-Qualified Long-Term Care Insurance Contract"],"a":3,"e":"Tax-Qualified Long-Term Care Insurance Contract: This is an individual policy or group plan that satisfies specific criteria as defined by the Health Insurance Portability and Accountability Act (HIPAA). According to HIPAA, qualified LTCI plans have the following characteristics:","t":"Long-Term Care","k":"d","g":0},{"q":"Which term matches this definition? “This represents the use of deception or misrepresentation to induce an individual to replace an existing policy with another contract.”","o":["Rated-up Policy","Pre-Admission Certification","Medicare Part A","Twisting"],"a":3,"e":"Twisting: This represents the use of deception or misrepresentation to induce an individual to replace an existing policy with another contract.","t":"State Law, Licensing & Ethics","k":"d","g":0},{"q":"Which term matches this definition? “These are insurance contracts that the company may terminate.”","o":["Fixed Period or Period Certain Option","Cancellable Policies","Convertible Term Life Insurance","Reduced Paid-Up Option"],"a":1,"e":"Cancellable Policies: These are insurance contracts that the company may terminate.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This rider allows the policy face amount to be adjusted to account for inflation based on the Consumer Price Index (CPI).”","o":["Permanent Life Insurance","Evidence of Insurability","Cost of Living Rider","Accelerated Benefit Rider"],"a":2,"e":"Cost of Living Rider: This rider allows the policy face amount to be adjusted to account for inflation based on the Consumer Price Index (CPI).","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a policy provision that describes the policy owner’s obligation to provide notification of a claim to the insurer within a reasonable time.”","o":["Cost of Living Rider","Straight Life Insurance","Other Insurance with This Insurer Provision","Notice of Claims Provision"],"a":3,"e":"Notice of Claims Provision: This is a policy provision that describes the policy owner’s obligation to provide notification of a claim to the insurer within a reasonable time. Typically, the allowed period is 20 days which begins at the time of the occurrence or the commencement of the ongoing loss (disability) or as soon after that as is reasonably possible.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This provision states that the total amount of coverage to be underwritten by a company for one person is restricted to a specified maximum amount, regardless of the number of policies issued.”","o":["Renewable Term Life Insurance","Other Insurance with This Insurer Provision","Industrial Life Insurance","Reinstatement Provision"],"a":1,"e":"Other Insurance with This Insurer Provision: This provision states that the total amount of coverage to be underwritten by a company for one person is restricted to a specified maximum amount, regardless of the number of policies issued.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This contains a summary of the type of policy and the coverage provided by the policy. It identifies the insured, the term of the policy (the effective date and termination date), and how the policy can be renewed.”","o":["Policy Face","Family Maintenance Policy","Face Amount","Insuring Clause"],"a":0,"e":"Policy Face: This contains a summary of the type of policy and the coverage provided by the policy. It identifies the insured, the term of the policy (the effective date and termination date), and how the policy can be renewed.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a mandatory health insurance provision which states that the insured must provide a completed claim form to the insurer within days of the date of loss.”","o":["Coordination of Benefits","Guarantee of Insurability Option","Duplication of Coverage","Proof of Loss"],"a":3,"e":"Proof of Loss: This is a mandatory health insurance provision which states that the insured must provide a completed claim form to the insurer within days of the date of loss.","t":"Health Insurance Provisions","k":"d","g":0},{"q":"Which term matches this definition? “This is the provision in an insurance policy that allows the insurer to assume the legal rights of the insured and to take legal action against one or more third parties that caused a covered loss. _____ allows an insurance carrier to be reimbursed for amounts that are paid to the policy holder.”","o":["Subrogation","Policy Proceeds","Life Settlement","Net Payment Cost Index"],"a":0,"e":"Subrogation: This is the provision in an insurance policy that allows the insurer to assume the legal rights of the insured and to take legal action against one or more third parties that caused a covered loss. Subrogation allows an insurance carrier to be reimbursed for amounts that are paid to the policy holder.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This clause states that a policy becomes incontestable after it has been in force for a certain period. The original provision set this period at three years. However, in various jurisdictions, state legislatures have reduced this period to two years.”","o":["Accelerated Benefit Rider","Non-Forfeiture Values","Time Limit on Certain Defenses","Additional Premium"],"a":2,"e":"Time Limit on Certain Defenses: This clause states that a policy becomes incontestable after it has been in force for a certain period. The original provision set this period at three years. However, in various jurisdictions, state legislatures have reduced this period to two years. This provision is similar to the incontestable clause in a life insurance policy. Unlike life insurance contracts, a fraudulent statement on a health insurance…","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a hobby or non-occupational activity. Some _____, such as fishing or studying chess, don’t require additional underwriting because they don’t measurably increase risk.”","o":["Avocation","Special Questionnaire","Interest","Reserves"],"a":0,"e":"Avocation: This is a hobby or non-occupational activity. Some avocations, such as fishing or studying chess, don’t require additional underwriting because they don’t measurably increase risk. However, Other activities, such as sky diving or mountain climbing, could require more scrutiny during the underwriting process in the form of a special questionnaire.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is an insured’s history of claims or rate of loss. The greater the _____, the higher the required premium.”","o":["Claims Experience","Underwriter","Applicant","Replacement"],"a":0,"e":"Claims Experience: This is an insured’s history of claims or rate of loss. The greater the claims experience, the higher the required premium.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This occurs when an insurance carrier gives up all control of a policy and releases it for unconditional delivery to a person who’s acting for the policy holder, including the company’s own agent.”","o":["Constructive Delivery","Morbidity","Claims Experience","Adverse Selection"],"a":0,"e":"Constructive Delivery: This occurs when an insurance carrier gives up all control of a policy and releases it for unconditional delivery to a person who’s acting for the policy holder, including the company’s own agent.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “Insurance companies require producers to obtain signed _____ as proof of delivery. The _____ is important because it designates the start of the policy’s free-look period.”","o":["Delivery Receipt","Consumer Report","Effective Date","Special Class"],"a":0,"e":"Delivery Receipt: Insurance companies require producers to obtain signed delivery receipts as proof of delivery. The delivery receipt is important because it designates the start of the policy’s free-look period.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “During this process, the producer determines which risks are desirable and submits those to the underwriting department for approval.”","o":["Field Underwriting","Declined Risk","Post-Claims Underwriting","Underwriting Department"],"a":0,"e":"Field Underwriting: During this process, the producer determines which risks are desirable and submits those to the underwriting department for approval. The producer provides any required disclosure of information practices to an applicant, such as a notice regarding replacement, a Buyer’s Guide, an outline of coverage, or a policy summary.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “The formula for a _____ is (morbidity – interest + expenses). (See the definitions of Morbidity, Interest, and Expense Factor for additional information.)”","o":["Rated-Up Premium","Health Insurance Premium","Warranties","Replacement"],"a":1,"e":"Health Insurance Premium: The formula for a health insurance premium is (morbidity – interest + expenses). (See the definitions of Morbidity, Interest, and Expense Factor for additional information.)","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “Each insurer must conform with state and federal privacy laws. This act prohibits insurers from basing their decisions solely on previous adverse underwriting decisions.”","o":["Information and Privacy Protection Act","Usual, Customary, and Reasonable","Affordable Care Act","Health and Accident Insurance"],"a":0,"e":"Information and Privacy Protection Act: Each insurer must conform with state and federal privacy laws. This act prohibits insurers from basing their decisions solely on previous adverse underwriting decisions.","t":"State Law, Licensing & Ethics","k":"d","g":0},{"q":"Which term matches this definition? “This receipt documents the temporary release of a new policy to the prospective policy holder without payment. It allows the prospective insured to review the contract before actually buying it. The free-look period that’s required by all states makes this _____ relatively obsolete.”","o":["Inspection Receipt","Delivery Receipt","Replacement","Substandard Risk"],"a":0,"e":"Inspection Receipt: This receipt documents the temporary release of a new policy to the prospective policy holder without payment. It allows the prospective insured to review the contract before actually buying it. The free-look period that’s required by all states makes this inspection receipt relatively obsolete.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This represents the income that insurance companies earn from investing the paid premiums. Premium calculations assume an expected rate of return.”","o":["Rated-Up Premium","Buyer’s Guide","Interest","Statement of Continued Good Health"],"a":2,"e":"Interest: This represents the income that insurance companies earn from investing the paid premiums. Premium calculations assume an expected rate of return.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is the date on which the insurance company finishes underwriting a risk exposure and generates the insurance contract. Coverage is already effective if there was a premium receipt.”","o":["Issue Date","Applicant","Warranties","Claims Experience"],"a":0,"e":"Issue Date: This is the date on which the insurance company finishes underwriting a risk exposure and generates the insurance contract. Coverage is already effective if there was a premium receipt. If no premiums were paid, it goes into effect when delivered, assuming the first premium is paid, and a Statement of Good Health is obtained.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is an applicant’s habit or lifestyle that indicates a higher-than-average level of risk for the insurer. Such habits include excess drinking, recreational drug use, and dishonest business practices.”","o":["Preferred Risk","Applicant","Moral Hazard","Issue Date"],"a":2,"e":"Moral Hazard: This is an applicant’s habit or lifestyle that indicates a higher-than-average level of risk for the insurer. Such habits include excess drinking, recreational drug use, and dishonest business practices.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This refers to an application that’s evaluated without a medical exam.”","o":["Non-Medical","Avocation","Medical Information Bureau","Policy Fee"],"a":0,"e":"Non-Medical: This refers to an application that’s evaluated without a medical exam.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This describes the basic benefits, conditions, and other terms of an insurance policy without using industry jargon.”","o":["Post-Claims Underwriting","Interest","Outline of Coverage","Declined Risk"],"a":2,"e":"Outline of Coverage: This describes the basic benefits, conditions, and other terms of an insurance policy without using industry jargon.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is the person who’s responsible for paying the policy premium.”","o":["Underwriter","Reserves","Payor","Buyer’s Guide"],"a":2,"e":"Payor: This is the person who’s responsible for paying the policy premium.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is a small transaction fee that’s charged by some insurers for the first or subsequent policy years.”","o":["Rated-up Policy","Policy Fee","Declined Risk","Field Underwriting"],"a":1,"e":"Policy Fee: This is a small transaction fee that’s charged by some insurers for the first or subsequent policy years.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is the person who can exercise the rights or options conferred by the policy. The _____ is also typically the payor.”","o":["Replacement","Policy holder","Premium","Rated Policy"],"a":1,"e":"Policy holder: This is the person who can exercise the rights or options conferred by the policy. The policy holder is also typically the payor.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is the initial payment and subsequent periodic payments that are required to keep a policy in force. This represents the relatively small, certain price paid for the right to transfer a potentially large uncertain risk to the insurer. Insurance _____ are always paid in advance.”","o":["Uninsurable","Underwriting Department","Buyer’s Guide","Premium"],"a":3,"e":"Premium: This is the initial payment and subsequent periodic payments that are required to keep a policy in force. This represents the relatively small, certain price paid for the right to transfer a potentially large uncertain risk to the insurer. Insurance premiums are always paid in advance.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “(See Rated Policy and Substandard Risk Classification)”","o":["Rated-up Policy","Policy holder","Fair Credit Reporting Act","Rated-Up Premium"],"a":0,"e":"Rated-up Policy: (See Rated Policy and Substandard Risk Classification)","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is the additional amount that’s added to the standard premium to account for the additional risk involved in underwriting a substandard loss exposure.”","o":["Payor","Policy holder","Rated-up Policy","Rated-Up Premium"],"a":3,"e":"Rated-Up Premium: This is the additional amount that’s added to the standard premium to account for the additional risk involved in underwriting a substandard loss exposure.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This form gathers more detailed information about a non-medical aspect of an applicant’s life—typically about an activity that often entails a greater-than-average level of risk. The requested information may be about aviation, an avocation, foreign residence, finances, or a person’s occupation.”","o":["Medical Information Bureau","Special Questionnaire","Issue Date","Constructive Delivery"],"a":1,"e":"Special Questionnaire: This form gathers more detailed information about a non-medical aspect of an applicant’s life—typically about an activity that often entails a greater-than-average level of risk. The requested information may be about aviation, an avocation, foreign residence, finances, or a person’s occupation. The most common of these special questionnaires is the aviation questionnaire.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “When insurers deliver policies to applicants who include the initial premium with their applications, those insurers require the applicants to affirm their health has not changed during the interim.”","o":["Field Underwriter","Underwriter","Statement of Continued Good Health","Special Questionnaire"],"a":2,"e":"Statement of Continued Good Health: When insurers deliver policies to applicants who include the initial premium with their applications, those insurers require the applicants to affirm their health has not changed during the interim.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “A loss exposure is _____ if the risk of covering it is so great that an insurance carrier cannot do so profitably. If an applicant is considered _____, the insurance company will reject the application. An insurer may also reject an application if the level of risk is unknown or cannot be reasonably estimated.”","o":["Adverse Selection","Claims Experience","Uninsurable","Applicant"],"a":2,"e":"Uninsurable: A loss exposure is uninsurable if the risk of covering it is so great that an insurance carrier cannot do so profitably. If an applicant is considered uninsurable, the insurance company will reject the application. An insurer may also reject an application if the level of risk is unknown or cannot be reasonably estimated.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is an anti-terrorism legislation that also addresses anti-money laundering provisions.”","o":["Medical Information Bureau","Disclosure Form","USA PATRIOT Act","Fair Credit Reporting Act"],"a":2,"e":"USA PATRIOT Act: This is an anti-terrorism legislation that also addresses anti-money laundering provisions.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"All accident and sickness plans MUST provide coverage on newborn children for ___ days.","o":["31","10","25","7"],"a":0,"e":"All individual and group health plans which provide coverage to family members of the insured must provide coverage for the insured’s newborn child from the moment of birth through the 31st day. If a premium is required to continue the newborn’s coverage, it must be paid within the 31-day period.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"In Georgia, long-term care policies are required to provide benefits for at least","o":["18 months","24 months","12 months","6 months"],"a":2,"e":"Long-term care policies issued in Georgia must provide benefits for at least 12 consecutive months.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"An insurance company which engages in boycott, coercion, and intimidation that results in the unreasonable restraint of trade is committing a prohibited act under Georgia insurance laws covering","o":["sliding","unfair trade practices","discrimination","twisting"],"a":1,"e":"Boycott, coercion, and intimidation that result in the unreasonable restraint of trade are prohibited under the Georgia insurance laws covering unfair trade practices.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"In Georgia, monthly-premium accident and sickness insurance policies must provide a grace period of at least","o":["10 days","31 days","14 days","7 days"],"a":0,"e":"In Georgia, monthly-premium health insurance policies must provide a grace period of at least 10 days.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"In Georgia, an insurer licensed to conduct business in Georgia, but domiciled in New Jersey, is called a(n):","o":["alien company","foreign company","non-admitted company","domestic company"],"a":1,"e":"An insurance company that is domiciled in New Jersey and licensed to conduct business in Georgia is referred to in Georgia as a foreign company.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"In the state of Georgia, every policyowner must be offered which of the following?","o":["Inflation rider","Double money-back guarantee","Free-look period","Waiting period"],"a":2,"e":"A free-look period allows a policyowner time to examine the policy and request a full refund for any reason. This is a required provision in the state of Georgia.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"What is NOT a requirement for becoming a licensed agent in Georgia?","o":["Be at least 18 years old","High School graduate","Complete a prelicensing course","Resident of Georgia"],"a":1,"e":"Graduating from high school is not a prerequisite for becoming a licensed agent.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"A domestic insurance company MUST be examined by the Commissioner every __ years.","o":["5","3","2","4"],"a":0,"e":"The Commissioner must examine each domestic insurance company at least every five years.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"When advertising, an insurer is required to use its","o":["true corporate name","trademark","logo","trade name"],"a":0,"e":"An insurance company must use its true corporate name in its advertising.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"Which of the following documents must an agent submit to the replacing insurance company during the replacement of an existing life insurance policy?","o":["A statement made by the agent that NAIC guidelines have been met during the replacement process","A list of all policies the agent has replaced in the last 3 years","A copy of the agent’s insurance license","Notice to existing and replacing insurers of intention to replace"],"a":3,"e":"When replacing an existing life insurance policy, an agent must submit notice to existing insurer and replacing insurer of intentions.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"With whom may an agent legally share commissions?","o":["Another agent who is licensed in the same line of insurance","An insured","A real estate agent","An unlicensed employee working for the same insurance agency"],"a":0,"e":"An agent may legally share commissions only with another agent who is licensed in the same line of insurance.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"A domestic insurance company in Georgia is considered a company that","o":["exclusively does business in Georgia","is incorporated and formed in Georgia","is licensed to issue direct mail-order coverage","only sells to Georgia residents"],"a":1,"e":"In Georgia, a domestic insurance company is defined as a company that is incorporated and formed in Georgia.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"In Georgia, most life insurance policies have a contestability period of","o":["1 year","5 years","3 years","2 years"],"a":3,"e":"The maximum contestability period for most life insurance policies is 2 years.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"Which of the following is NOT considered rebating?","o":["Giving something of value to an insured in exchange for their business","Returning premium to a client as an inducement for purchasing a policy","Offering special dividends","Sharing commissions with an agent licensed in the same line of business"],"a":3,"e":"Sharing commissions with other licensed and appointed agents is not considered rebating.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"Which of the following items are regulated by the Rules Governing Advertisement of Life Insurance and Annuities?","o":["Communication between marketing department and underwriting department","Rate increase announced by insurance company via mass mailing","Correspondence regarding policy loan interest rate payment","Prepared sales presentations used by insurance agents"],"a":3,"e":"The Rules Governing Advertisement of Life Insurance and Annuities apply to prepared sales presentations used by insurance agents.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"J is an agent who has induced an insured through misrepresentation to surrender an existing insurance policy. What is J guilty of?","o":["Rebating","Twisting","Sliding","Coercion"],"a":1,"e":"Twisting is the unfair trade practice of replacing an insurance policy from one insurer to another based on misrepresentation.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"When is a group accident and health policy required to provide coverage for a newborn child?","o":["No more than 10 days after date of birth","At the moment of birth","When the policyowner notifies the insurance company","When the required additional premium is paid"],"a":1,"e":"Coverage of newborn children is provided by individual and group accident and sickness contracts from the moment of birth.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"Prior to a hearing that could potentially revoke an agent’s license, what is required by the Commissioner?","o":["Giving oral notice to the appointing insurer","Giving written notice to the agent","Giving both oral and written notice to the appointing insurer","Giving oral notice to the agent"],"a":1,"e":"Before holding a hearing that may lead to suspension or revocation of an agent’s license, the Commissioner MUST give written notice to the agent.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"Which of the following is NOT an unfair claim settlement practice?","o":["Compelling an insured to initiate a lawsuit by offering less on an insurance claim","Failing to acknowledge and act promptly with respect to an insurance claim","Needing written documentation of claim details","Failing to accept or deny a claim within reasonable time after proof of loss is submitted"],"a":2,"e":"All of these are unfair claim settlement practices except \"Needing written documentation of claim details\".","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"What is the purpose of the Life and Health Insurance Guaranty Association?","o":["Establishes underwriting guidelines for admitted insurers","Enforces Georgia’s insurance regulations","Protects policyowners against insolvent insurance companies","Underwrites high-risk insurance applicants"],"a":2,"e":"The Life and Health Insurance Guaranty Association is an association that protects policyowners against insolvent insurance companies.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"In Georgia, which of the following statements is CORRECT about life insurance advertisements?","o":["Third-party testimonials may not be used","An insurance agency is responsible for advertisements placed by its insurance agents","The Commissioner of Insurance must approve advertisements before they are used","The dividend may be represented as guaranteed"],"a":1,"e":"Advertisements are the insurer’s responsibility, regardless of who writes, designs, or presents them.","t":"Georgia Insurance Laws & Rules","g":1,"k":"e"},{"q":"The Life and Health Insurance Guaranty Association is","o":["funded by admitted insurance companies through assessments","administered by the Federal government","an entity that assists in underwriting large insurance policies","funded by the state government"],"a":0,"e":"The Life and Health Insurance Guaranty Association is funded by insurance companies through assessme
