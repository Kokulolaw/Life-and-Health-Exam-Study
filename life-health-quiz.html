of eligible expenses","The deductible can be expressed as a fixed dollar amount","The benefit period begins only after a specified amount of expenses have accrued"],"a":0,"e":"Major Medical benefits normally have a maximum limit.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"J was reviewing her Health Insurance policy and noticed the phrase \"This policy will only pay for a semi-private room\". This phrase is considered to be a(n)","o":["restricted provision","stop loss","hidden deductible","internal limit"],"a":3,"e":"Certain types of expenses may have limits placed on the dollar amount of certain services or on the type of service provided.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"Major Medical policies typically:","o":["do not contain a deductible and coinsurance","require use of in-network facilities only","pay 100% of covered expenses","contain a deductible and coinsurance"],"a":3,"e":"Major Medical policies typically contain a deductible and coinsurance.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"M is insured under a basic Hospital/Surgical Expense policy. A physician performs surgery on M. What determines the claim M is eligible for?","o":["Determined by the schedule of benefits from the hospital","Claim payment is negotiated between physician and patient","Determined by the terms of the policy","Claim payment is equal to physician’s actual charges"],"a":2,"e":"Under a basic hospital/surgical expense policy, the amount of the patient’s claim payment will be based on the terms of the policy.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"This type of deductible provision states that should more than one family member be involved in a common accident, or suffer the same illness, only one individual deductible amount shall be applied.","o":["Individual deductible","Corridor deductible","Family maximum deductible","Common accident deductible"],"a":3,"e":"A common accident deductible provision states that should more than one family member be involved in a common accident, or suffer the same illness, only one individual deductible amount shall be applied.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"All of these are characteristics of a Health Reimbursement Arrangement (HRA) EXCEPT","o":["HRA is entirely funded by the employee","Reimbursement for eligible medical expenses are allowed","HRA is entirely funded by the employer","HRA can be offered with other health plans"],"a":0,"e":"HRA plans are employer-funded medical reimbursement plans","t":"Health Insurance Provisions","k":"e","g":0},{"q":"A comprehensive major medical health insurance policy contains an Eligible Expenses provision which identifies the types of health care services that are covered. All of the following health care services are typically covered, EXCEPT for:","o":["nursing services","experimental and investigative services","physician fees","hospital charges"],"a":1,"e":"All of these services are typically covered under a comprehensive major medical health insurance policy EXCEPT for \"experimental and investigative services\".","t":"Health Insurance Provisions","k":"e","g":0},{"q":"Which of the following statements BEST describes the intent of a Coinsurance clause in a Major Medical policy?","o":["Discourages overutilization of the insurance coverage","Minimizes the need for deductibles","Minimizes the waiting period","Discourages adverse selection"],"a":0,"e":"A purpose of the Coinsurance clause in a Major Medical Policy is to discourage overutilization of the insurance coverage.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"Deductibles are used in health policies to lower:","o":["adverse selection","overuse of medical services","the incidents of fraud","the coinsurance amount"],"a":1,"e":"One of the primary reasons for using deductibles in health policies is to reduce the overuse of medical services.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"When a person returns to work after a period of total disability but cannot earn as much as he or she did before the disability, this situation is called which of the following?","o":["Presumptive disability","Waiver of premium","Recurring disability","Residual disability"],"a":3,"e":"A residual amount benefit is based on the proportion of income actually lost due to the partial disability, taking into account the fact that the insured is able to work and earn some income.","t":"Disability Income","k":"e","g":0},{"q":"N is covered under an individual Disability policy with a 30-day Elimination period and a monthly benefit of $500. N is totally disabled for 3 1/2 months. N’s total benefit received on this claim is:","o":["$1,500","$1,750","$2,000","$1,250"],"a":3,"e":"After the 30-day Elimination period has been satisfied, the total benefit paid on this claim is $1,250 ($500+$500+$250).","t":"Disability Income","k":"e","g":0},{"q":"P received Disability income benefits for 3 months then returns to work. She is able to work one month before her condition returns, leaving her disabled once again. What would the insurance company most likely regard this second period of disability as?","o":["A recurrent disability","A presumptive disability","An occupational disability","A residual disability"],"a":0,"e":"A second period of disability from the same or related cause of a prior disability is called a recurrent disability.","t":"Disability Income","k":"e","g":0},{"q":"Z owns a Disability Income policy with a 30-day Elimination period. Z contracts pneumonia that leaves him unable to work from January 1 until January 15. Z then becomes disabled from an accident on February 1 and the disability lasts until July 1 the same year. Z will become eligible to receive benefits starting on:","o":["1-Jan","15-Jan","1-Mar","1-Feb"],"a":2,"e":"The elimination period is the period of time between the onset of a disability, and the time you are eligible for benefits. It is best thought of as a deductible period for your policy. After a 30-day Elimination period, Z will become eligible for receiving benefits on March 1.","t":"Disability Income","k":"e","g":0},{"q":"T was insured under an individual Disability Income policy and was severely burned in a fire. As a result, T became totally disabled. The insurer began making monthly benefit payments, but later discovered that the fire was set by T in what was described as arson. What actions will the insurer take?","o":["The insurer will rescind the policy, deny the claim, and recover all payments made","Due to the policy not being post-claim underwritten, the insurer must continue to pay this claim","Claim will be denied but the policy will remain in force without further premium payments due to the insured’s total disability","Claim will be rejected because of this criminal act, but no recovery of payments will be made"],"a":0,"e":"In this situation, the insurer will rescind the policy, deny the claim, and recover all payments made.","t":"Disability Income","k":"e","g":0},{"q":"Disability policies do NOT normally pay for disabilities arising from which of the following?","o":["Negligence","Sickness","Accidents","War"],"a":3,"e":"Disability policies do NOT normally pay for disabilities arising from an act of war.","t":"Disability Income","k":"e","g":0},{"q":"An insured owns an individual Disability Income policy with a 30-day Elimination Period for sickness and accidents and a monthly indemnity benefit of $500. If the insured is disabled for 3 1/2 months, what is the MAXIMUM amount he would receive for an approved claim?","o":["$1,750","$1,250","$1,000","$500"],"a":1,"e":"3.5 months - 1 month elimination period = 2.5 months. 2.5 months X $500 monthly indemnity = $1,250.","t":"Disability Income","k":"e","g":0},{"q":"Medicare Part C is:","o":["original Part A and B Medicare","available to those who are enrolled in Medicare Part A and Part B","government insurance","available to those who are enrolled in a Medicare Supplement Plan with income under $12,000 per year"],"a":1,"e":"Medicare Part C (Medicare Advantage) is offered by private insurers and available to those who are enrolled in Medicare Part A and Part B.","t":"Medicare, Social Security & Government Programs","k":"e","g":0},{"q":"What type of rider would be added to an Accident and Health policy if the policyowner wants to ensure the policy will continue if he/she ever becomes totally disabled?","o":["Accidental Death and Dismemberment rider","Waiver of Premium rider","Guaranteed Insurability rider","Disability Income rider"],"a":1,"e":"If a policyowner covered under an accident and health policy wanted to ensure the policy will continue if they ever become totally disabled, they would want to add a waiver of premium rider.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"An insurer must provide an insured with claim forms within __ days after receiving notice of a loss.","o":["15","20","5","10"],"a":0,"e":"Under the Claims Forms provision, an insurer must provide an insured with claim forms within a MAXIMUM of 15 days after receiving notice of a loss.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"M’s insurance company denied a reinstatement application for her lapsed health insurance policy. The company did not notify M of this denial. How many days from the reinstatement application date does the insurance company have to notify M of the denial before the policy will be automatically placed back in force?","o":["45 days","30 days","10 days","60 days"],"a":0,"e":"Health insurance will automatically be placed back in force if the insurer fails to notify an applicant within 45 days that the reinstatement application was denied.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"With Optionally Renewable Health policies, the insurer may:","o":["review the policy whenever they please and determine whether or not to renew it","renew the policy only if no claims have been filed the previous year","review the policy annually and determine whether or not to renew it","renew the policy only with the insured’s consent"],"a":2,"e":"With an Optionally Renewable policy, the insurance company may review the policy annually and choose whether or not to renew it.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"Which of the following provisions specifies how long a policyowner’s health coverage will remain in effect if the policyowner does not pay the premium when it is due?","o":["Waiver of Premium","Reinstatement","Consideration","Grace Period"],"a":3,"e":"The grace period is the additional period of time after a premium payment is due that will allow the policy to remain in force in the event of nonpayment.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"The sections of an insurance contract which limit coverage are called:","o":["waivers","limitations","exclusions","riders"],"a":2,"e":"An exclusion limits coverage in an insurance contract.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"If an individual is covered under an Accidental Death Policy and dies, an autopsy can be performed in all these situations, EXCEPT:","o":["When consent for the autopsy is not obtained","When foul play was a contributing factor","When the state prohibits this by law","When the cause of death is unknown"],"a":2,"e":"Applicable state laws that prevent an autopsy take precedence.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"What must the policyowner provide to the insurer for validation that a loss has occurred?","o":["Proof of Loss","Proof of Coverage","Proof of Payment","Proof of Claim"],"a":0,"e":"A Proof of Loss statement must be provided to an insurance company to show that a loss actually occurred.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"Which Accident and Health policy provision addresses preexisting conditions?","o":["Time Limit on Certain Defenses","Payment of Claims","Legal Actions","Proof of Loss"],"a":0,"e":"The Time Limit on Certain Defenses provision limits the period during which an insurer can deny a claim on the basis of a preexisting condition.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"T files a claim on his Accident and Health policy after being treated for an illness. The insurance company believes that T misrepresented his actual health on the initial insurance application and is, therefore, disputing the claim’s validity. The provision that limits the time period during which the company may dispute a claim’s validity is called:","o":["Free-look","Insuring","Grace Period","Time Limit on Certain Defenses"],"a":3,"e":"The Time Limit on Certain Defenses (Incontestability) provision limits the time during which the insurance company may challenge the validity of an insurance claim on the basis of a misstatement made on the insured’s application.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"The insuring clause","o":["Specifies the additional time given to pay past due premiums","States the amount of premium to be collected","States the scope and limits of the coverage","Prohibits the insured from suing the insurer for at least 60 days after filing a written proof of loss"],"a":2,"e":"The purpose of the insuring clause is to specify the scope and limits of the coverage provided.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"Which type of renewability best describes a Disability Income policy that covers an individual until the age of 65, but the insurer has the right to change the premium rate for the overall risk class?","o":["Conditionally Renewable","Optionally Renewable","Guaranteed Renewable","Noncancellable"],"a":2,"e":"The renewal provision in a guaranteed renewable policy specifies that the policy must be renewed (as long as premiums are paid) until the insured reaches a specified age. These usually have increasing premiums.","t":"Disability Income","k":"e","g":0},{"q":"An insurance company receives E’s application for an individual health policy. E did not complete all of the medical history questions because she could not remember the exact dates. E signed the policy and submitted it to the insurance company anyway. A few weeks later, E suffers a heart attack and is hospitalized without completing the medical history questions and paying the initial premium. E is not insured. Which of the following clauses details the conditions that E did not meet?","o":["Entire Contract clause","Consideration clause","MIB clause","Insuring clause"],"a":1,"e":"A health insurance contract is valid only if the insured provides consideration in the form of the full minimum premium and the statements made in the application.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"X is insured with a Disability Income policy that provides coverage until age 65. This policy allows the insurer to change the premium rate for the overall risk class assigned. Which of these renewability features does this policy contain?","o":["Guaranteed Assignable","Noncancellable","Optionally Cancellable","Guaranteed Renewable"],"a":3,"e":"Guaranteed Renewable individual disability income policies provides the right to continue a policy (normally through age 65) if the client pays the premium on time. Where the insurance company cannot change the benefits or features of the policy, they may change the premium of the policy.","t":"Disability Income","k":"e","g":0},{"q":"S is the policyowner of a Major Medical policy. The premiums are paid monthly and due on the 1st of each month. S fails to make September’s payment and is hospitalized October 15th. When S files the claim for this hospitalization, the insurer will likely","o":["pay the claim minus September and October’s premium payments","pay half the claim","deny the claim","pay the full claim"],"a":2,"e":"Because S failed to pay the premium within the policy’s 10-day grace period, the insurer will likely deny the claim.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"A Disability Income policyowner recently submitted a claim for a chronic neck problem that has now resulted in total disability. The original neck injury occurred before the application was taken 5 years prior. The neck injury was never disclosed to the insurer at the time of application. How will the insurer handle this claim?","o":["Claim will be paid and coverage will remain in force","Claim will be denied, the coverage cancelled, and all premiums paid will be refunded","Claim will be denied and coverage will be cancelled","Claim will be denied and coverage will remain in force"],"a":0,"e":"After a policy has been in force for 2 (sometimes 3) years, it enters the incontestable period, in which the insurer may not deny a claim based on information not disclosed at the time of application.","t":"Disability Income","k":"e","g":0},{"q":"Which of the following BEST describes how pre-admission certifications are used?","o":["Used to help process claims","Used to prevent nonessential medical costs","Used to assist in underwriting","Used to minimize hospital lawsuits"],"a":1,"e":"Pre-admission certification is used to prevent unnecessary medical costs.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"Which mode of payment is NOT used by health insurance policies?","o":["Semi-annual premium","Single premium","Monthly premium","Annual premium"],"a":1,"e":"Single premium is not used when paying for health insurance policies.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"An underwriter determines that an applicant’s risk should be recategorized due to a health issue. This policy may be issued with a(n):","o":["Concealment clause","extended Contestable period","exclusion for the medical condition","delayed effective date"],"a":2,"e":"In this situation, the policy may be issued with an exclusion for the medical problem.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"M completes an application for health insurance but does not pay the initial premium. All of these actions must occur before M’s policy goes into effect, EXCEPT:","o":["insurance company issues policy","policy is delivered","free-look period has expired","initial premium is collected"],"a":2,"e":"In this situation, the policy will go into effect after all these actions occur EXCEPT the expiration of the free-look period.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"Which parts of a health insurance policy are guaranteed to be true?","o":["Warranty","Statement","Representation","Rating"],"a":0,"e":"Warranties are statements that are considered literally true. A warranty that is not literally true in every detail, even if made in error, is sufficient to render a policy void.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"What is an organization that solicits insurance only to its members?","o":["Fraternal benefit society","Mixed company","Nonadmitted company","Captive society"],"a":0,"e":"An organization that solicits insurance only among its members is known as a fraternal benefit society.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"Which document MUST accompany an application that initiates the replacement of an existing life insurance policy?","o":["A signed replacement statement from the replacing insurance company","A detailed comparison of existing coverage and the proposed coverage","A signed replacement statement from the insurance company being replaced","A signed statement by the applicant regarding the replacement"],"a":3,"e":"Each agent who initiates an application for life insurance or annuity for replacement of an existing policy shall submit a signed statement by the applicant regarding the replacement as a part of the application.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"Which term matches this definition? “This provision is used in Universal Life Policies. _____ can be paid into the policy account in an amount above the target premium. Current tax laws limit the amount of excess cash value that can be accumulated in a life insurance policy.”","o":["Additional Premium","Earned Premium","Gross Premium","Needs Approach"],"a":0,"e":"Additional Premium: This provision is used in Universal Life Policies. Additional premiums can be paid into the policy account in an amount above the target premium. Current tax laws limit the amount of excess cash value that can be accumulated in a life insurance policy. The insurance company may not accept the additional premium if it nears this limit without increasing the limit of life insurance (subject to underwriting).","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is the age that a person or an insured has attained as of a given date. For life insurance purposes, the age is based on either the nearest birthday or the last birthday, depending on the practices of the insurance company involved. _____ is”","o":["Mortality Rate","Joint Life Insurance","Modified Life Policy","Attained Age"],"a":3,"e":"Attained Age: This is the age that a person or an insured has attained as of a given date. For life insurance purposes, the age is based on either the nearest birthday or the last birthday, depending on the practices of the insurance company involved. Attained age is also referred to as “current age.”","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a type of policy that combines permanent, whole life, and temporary term life into a single plan that provides the policy owner with the flexibility to adjust premiums throughout the life of the policy.”","o":["Industrial Life Insurance","Limited Pay Life Insurance","Non-Medical Life Insurance","Adjustable Life Insurance"],"a":3,"e":"Adjustable Life Insurance: This is a type of policy that combines permanent, whole life, and temporary term life into a single plan that provides the policy owner with the flexibility to adjust premiums throughout the life of the policy.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is the equity portion of a whole life policy that increases with each subsequent premium payment. The insurer pays interest on the _____, which is tax-deferred. In a whole life policy, the _____ is designed to equal the policy’s death benefit at age 100.”","o":["Cash Value","Cancellable Policies","Maturity Value","Paid-Up Additions Option"],"a":0,"e":"Cash Value: This is the equity portion of a whole life policy that increases with each subsequent premium payment. The insurer pays interest on the cash value, which is tax-deferred. In a whole life policy, the cash value is designed to equal the policy’s death benefit at age 100. Traditional whole life insurance policies are considered to mature when the insured attains the age of 100.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is insurance that’s designed to pay the balance of a loan if the insured dies or becomes permanently disabled before the loan has been repaid in full. Generally, _____ is sold by a lender or finance company.”","o":["Credit Insurance","Term Life Insurance","Variable Life Insurance","Universal Life Insurance"],"a":0,"e":"Credit Insurance: This is insurance that’s designed to pay the balance of a loan if the insured dies or becomes permanently disabled before the loan has been repaid in full. Generally, credit insurance is sold by a lender or finance company.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is temporary life insurance that provides the policy owner with the right to exchange an existing policy for other policies that are offered by the insurance company.”","o":["Joint Life Insurance","Convertible Term Life Insurance","Juvenile Life Insurance","Renewable Term Life Insurance"],"a":1,"e":"Convertible Term Life Insurance: This is temporary life insurance that provides the policy owner with the right to exchange an existing policy for other policies that are offered by the insurance company. This conversion may be the conversion of individual term insurance to an individual permanent plan that a company sells or the conversion of group disability, life, or health to an individual plan.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a type of temporary or pure protection that’s characterized by a reducing face amount each year and the cost of this coverage remains constant. _____ may be referred to as mortgage redemption or mortgage protection insurance since it’s primarily used in conjunction with a debt or loan.”","o":["Decreasing Term Insurance","Increasing Term Life Insurance","Renewable Term Life Insurance","Adjustable Life Insurance"],"a":0,"e":"Decreasing Term Insurance: This is a type of temporary or pure protection that’s characterized by a reducing face amount each year and the cost of this coverage remains constant. Decreasing term insurance may be referred to as mortgage redemption or mortgage protection insurance since it’s primarily used in conjunction with a debt or loan.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This contract pays a face amount after a fixed time period, at a specific age, or upon the death of the insured if it occurs before the end of the period.”","o":["Policy Proceeds","Convertible Term Life Insurance","Paid-Up Insurance","Endowment Contract"],"a":3,"e":"Endowment Contract: This contract pays a face amount after a fixed time period, at a specific age, or upon the death of the insured if it occurs before the end of the period.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This involves an insurance applicant establishing the fact that they meet the insurance company’s health requirements. Statements of good health, attending physician statements, health history, and an applicant’s current health can all be used as _____.”","o":["Excess Interest","Evidence of Insurability","Straight Life Insurance","Notice of Claims Provision"],"a":1,"e":"Evidence of Insurability: This involves an insurance applicant establishing the fact that they meet the insurance company’s health requirements. Statements of good health, attending physician statements, health history, and an applicant’s current health can all be used as evidence of insurability.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a non-forfeiture option that’s available when a policy is surrendered and the same face amount of the policy is continued in force for a specified additional period; however, the coverage has changed from permanent to level term protection.”","o":["Convertible Term Life Insurance","Credit Insurance","Whole Life Insurance","Extended Term Insurance"],"a":3,"e":"Extended Term Insurance: This is a non-forfeiture option that’s available when a policy is surrendered and the same face amount of the policy is continued in force for a specified additional period; however, the coverage has changed from permanent to level term protection. Extended term insurance is the non-forfeiture option that provides the policy owner with the highest face amount of coverage.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is another name for the death benefit of a life insurance policy.”","o":["Face Amount","Policy Face","Reduced Premiums Option","Assignment Clause"],"a":0,"e":"Face Amount: This is another name for the death benefit of a life insurance policy.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a type of policy that combines whole life insurance and a level term rider. It provides for the payment of a monthly income during a stated period of years once the insured dies. The monthly income is payable from the date of death to the end of the pre-selected period.”","o":["Family Maintenance Policy","Modified Life Policy","Policy Proceeds","Term Life Insurance"],"a":0,"e":"Family Maintenance Policy: This is a type of policy that combines whole life insurance and a level term rider. It provides for the payment of a monthly income during a stated period of years once the insured dies. The monthly income is payable from the date of death to the end of the pre-selected period. The payment of the face amount of the policy is payable at the end of the pre-selected period.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is term life insurance that provides an increasing face amount over time based on specific amounts or a percentage of the original face amount.”","o":["Non-Medical Life Insurance","Renewable Term Life Insurance","Increasing Term Life Insurance","Juvenile Life Insurance"],"a":2,"e":"Increasing Term Life Insurance: This is term life insurance that provides an increasing face amount over time based on specific amounts or a percentage of the original face amount.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is insurance under which premiums are paid monthly or more often (i.e., weekly). Additionally, the face amount of the policy doesn’t exceed a stated amount, and the words “industrial policy” are printed in prominent type on the face of the policy. _____ is”","o":["Straight Life Insurance","Joint Life Insurance","Industrial Life Insurance","Juvenile Life Insurance"],"a":2,"e":"Industrial Life Insurance: This is insurance under which premiums are paid monthly or more often (i.e., weekly). Additionally, the face amount of the policy doesn’t exceed a stated amount, and the words “industrial policy” are printed in prominent type on the face of the policy. Industrial life insurance is also referred to as “debit insurance.”","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a life insurance policy that covers the lives of two or more persons. The policy pays a death benefit and ends when the first insured dies. This type of policy is insurance.”","o":["Convertible Term Life Insurance","Joint Life Insurance","Industrial Life Insurance","Term Life Insurance"],"a":1,"e":"Joint Life Insurance: This is a life insurance policy that covers the lives of two or more persons. The policy pays a death benefit and ends when the first insured dies. This type of policy is also referred to as “first to die” insurance.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a life insurance policy that covers the lives of two or more persons. The policy pays a death benefit and ends when the last insured dies. This type of policy is insurance.”","o":["Joint Life Survivor","Life Insurance","Modified Life Policy","Adjustable Life Insurance"],"a":0,"e":"Joint Life Survivor: This is a life insurance policy that covers the lives of two or more persons. The policy pays a death benefit and ends when the last insured dies. This type of policy is also referred to as “last to die” insurance.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a life insurance policy that’s owned by an adult and written on the lives of children.”","o":["Industrial Life Insurance","Juvenile Life Insurance","Renewable Term Life Insurance","Adjustable Life Insurance"],"a":1,"e":"Juvenile Life Insurance: This is a life insurance policy that’s owned by an adult and written on the lives of children.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This describes a premium that remains constant, fixed, or predetermined throughout the life of a policy.”","o":["Earned Premium","Mortgage Redemption Plan","Level Premium","Additional Premium"],"a":2,"e":"Level Premium: This describes a premium that remains constant, fixed, or predetermined throughout the life of a policy.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This represents insurance on the lives of human beings that creates an immediate and guaranteed estate upon the death of an insured or at the end of a predetermined period (in whole _____, this is age 100).”","o":["Extended Term Insurance","Life Insurance","Credit Insurance","Modified Life Policy"],"a":1,"e":"Life Insurance: This represents insurance on the lives of human beings that creates an immediate and guaranteed estate upon the death of an insured or at the end of a predetermined period (in whole life insurance, this is age 100).","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a life insurance plan under which the premiums are payable for a specified number of years, after which the policy remains in effect for life without any additional payments. However, the policy still doesn’t mature until age 100.”","o":["Limited Pay Life Insurance","Increasing Term Life Insurance","Juvenile Life Insurance","Convertible Term Life Insurance"],"a":0,"e":"Limited Pay Life Insurance: This is a life insurance plan under which the premiums are payable for a specified number of years, after which the policy remains in effect for life without any additional payments. However, the policy still doesn’t mature until age 100.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is the date on which a life insurance policy becomes payable due to the death of the insured or as a result of an insured’s living to the end of a specified period (i.e., age 100). In whole life insurance, the cash value is designed to equal the face amount at maturity.”","o":["Uniform Simultaneous Death Act","Maturity Value","Non-Forfeiture Values","Maturity Date"],"a":3,"e":"Maturity Date: This is the date on which a life insurance policy becomes payable due to the death of the insured or as a result of an insured’s living to the end of a specified period (i.e., age 100). In whole life insurance, the cash value is designed to equal the face amount at maturity.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is the amount that’s paid under a whole life insurance contract if the insured reaches the age of the mortality table on which the contract was based. If it’s an endowment contract, it represents the cash value amount at the end of the endowment period.”","o":["Maturity Value","Time Limit on Certain Defenses","Human Life Value Approach","Non-Participating Insurance"],"a":0,"e":"Maturity Value: This is the amount that’s paid under a whole life insurance contract if the insured reaches the age of the mortality table on which the contract was based. If it’s an endowment contract, it represents the cash value amount at the end of the endowment period.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a whole life insurance policy under which the amount a policy owner pays in premium during the early years exceeds the sum of premiums required for the first seven years of insurance.”","o":["Reduced Paid-Up Option","Primary Beneficiary","Modified Endowment Contract","Additional Premium"],"a":2,"e":"Modified Endowment Contract: This is a whole life insurance policy under which the amount a policy owner pays in premium during the early years exceeds the sum of premiums required for the first seven years of insurance. The IRS views MECs as the policy owner’s attempt to use the policy as a short-term investment vehicle, and as such, the policy will be designated for tax purposes as an MEC.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a whole life plan that’s characterized by a lower premium during the initial years of the contract to make it more affordable for the policy owner. The premium then increases after this introductory period and remains level for the life of the contract.”","o":["Variable Life Insurance","Family Maintenance Policy","Modified Life Policy","Policy Face"],"a":2,"e":"Modified Life Policy: This is a whole life plan that’s characterized by a lower premium during the initial years of the contract to make it more affordable for the policy owner. The premium then increases after this introductory period and remains level for the life of the contract.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is another name for a decreasing term life insurance policy. This type of plan is used to provide funds for a survivor to pay off a debt. This type of plan is also referred to as mortgage protection coverage or reducing term insurance.”","o":["Gross Premium","Non-Forfeiture Values","Morbidity Rate","Mortgage Redemption Plan"],"a":3,"e":"Mortgage Redemption Plan: This is another name for a decreasing term life insurance policy. This type of plan is used to provide funds for a survivor to pay off a debt. This type of plan is also referred to as mortgage protection coverage or reducing term insurance.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “These are benefits that are required by law to be made available to the policy owner if she surrenders the policy by discontinuing premium payments. These values state that the owner will not forfeit or lose all that she has invested in the policy.”","o":["Endowment Contract","Mortgage Redemption Plan","Gross Premium","Non-Forfeiture Values"],"a":3,"e":"Non-Forfeiture Values: These are benefits that are required by law to be made available to the policy owner if she surrenders the policy by discontinuing premium payments. These values state that the owner will not forfeit or lose all that she has invested in the policy. Also referred to as non-forfeiture options, they include surrender for cash, extended term insurance, and reduced paid-up insurance.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is issued without requiring the applicant to submit to a medical examination. The insurer relies on the applicant’s answers to the questions regarding his physical condition, personal references, and inspection reports.”","o":["Joint Life Insurance","Non-Medical Life Insurance","Adjustable Life Insurance","Convertible Term Life Insurance"],"a":1,"e":"Non-Medical Life Insurance: This is issued without requiring the applicant to submit to a medical examination. The insurer relies on the applicant’s answers to the questions regarding his physical condition, personal references, and inspection reports. However, the insurance company retains the right to require a medical examination if an investigation indicates a need for one.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a type of insurance policy that’s issued by a stock insurer. This form of insurance contract doesn’t pay dividends to the policy holders.”","o":["Decreasing Term Insurance","Permanent Life Insurance","Non-Participating Insurance","Non-Medical Life Insurance"],"a":2,"e":"Non-Participating Insurance: This is a type of insurance policy that’s issued by a stock insurer. This form of insurance contract doesn’t pay dividends to the policy holders.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is most often described as an insurance policy that’s issued by commercial insurers with face values of $1,000, or multiples thereof.”","o":["Ordinary Life Insurance","Non-Medical Life Insurance","Straight Life Insurance","Joint Life Insurance"],"a":0,"e":"Ordinary Life Insurance: This is most often described as an insurance policy that’s issued by commercial insurers with face values of $1,000, or multiples thereof.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is life insurance on which future premium payments are not required. Frequently, the term is used to identify a 10, 20, or 30 payment life insurance policy on which 10, 20, or 30 annual premium payments have been paid.”","o":["Paid-Up Insurance","Joint Life Insurance","Paid-Up Additions Option","Non-Medical Life Insurance"],"a":0,"e":"Paid-Up Insurance: This is life insurance on which future premium payments are not required. Frequently, the term is used to identify a 10, 20, or 30 payment life insurance policy on which 10, 20, or 30 annual premium payments have been paid. Although the policy is “paid-up” at the end of the payment period, the contract doesn’t mature until the age of 100.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a type of insurance policy that entitles the policy holder to share in the divisible surplus of the insurer through dividends.”","o":["Paid-Up Insurance","Participating Insurance","Non-Medical Life Insurance","Adjustable Life Insurance"],"a":1,"e":"Participating Insurance: This is a type of insurance policy that entitles the policy holder to share in the divisible surplus of the insurer through dividends.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is any plan of life insurance that’s designed to last throughout the life of the insured. Level premium, cash value, and non-forfeiture options characterize _____.”","o":["Joint Life Insurance","Universal Life Insurance","Juvenile Life Insurance","Permanent Life Insurance"],"a":3,"e":"Permanent Life Insurance: This is any plan of life insurance that’s designed to last throughout the life of the insured. Level premium, cash value, and non-forfeiture options characterize permanent life insurance.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This refers to the amount that’s paid as a death, surrender, or maturity benefit. In the case of a death benefit, it includes the face value, plus any earned dividends, minus any outstanding loans and interest.”","o":["Policy Face","Absolute Assignment","Other Insurance with This Insurer Provision","Policy Proceeds"],"a":3,"e":"Policy Proceeds: This refers to the amount that’s paid as a death, surrender, or maturity benefit. In the case of a death benefit, it includes the face value, plus any earned dividends, minus any outstanding loans and interest. If paid as a surrender benefit, the amount includes any cash value, minus surrender charges, outstanding loans, and interest. If the benefit is paid at maturity, the benefit includes the cash value, minus any…","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is the period during which a policy will remain in existence when premiums are being paid. It can also be described as a single renewal period for renewable policies.”","o":["Non-Medical","Policy Term","Policy Fee","Policy holder"],"a":1,"e":"Policy Term: This is the period during which a policy will remain in existence when premiums are being paid. It can also be described as a single renewal period for renewable policies.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is temporary life insurance that may be renewed at the end of the policy term without evidence of insurability. The premium is based on the attained age of the insured and, as such, increases at each renewal.”","o":["Renewable Term Life Insurance","Ordinary Life Insurance","Adjustable Life Insurance","Extended Term Insurance"],"a":0,"e":"Renewable Term Life Insurance: This is temporary life insurance that may be renewed at the end of the policy term without evidence of insurability. The premium is based on the attained age of the insured and, as such, increases at each renewal.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a type of whole life insurance that provides coverage for the entire life of the insured and for which the premiums are payable until death. This is also referred to as continuous premium life.”","o":["Straight Life Insurance","Convertible Term Life Insurance","Renewable Term Life Insurance","Term Life Insurance"],"a":0,"e":"Straight Life Insurance: This is a type of whole life insurance that provides coverage for the entire life of the insured and for which the premiums are payable until death. This is also referred to as continuous premium life.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This represents the suggested premium that’s used in universal life insurance policies; however, there’s no guarantee that there will be adequate funds to maintain the policy. Instead, it may indicate what will be needed (under conservative estimates) to maintain the policy.”","o":["Target Premium","Level Premium","Additional Premium","Gross Premium"],"a":0,"e":"Target Premium: This represents the suggested premium that’s used in universal life insurance policies; however, there’s no guarantee that there will be adequate funds to maintain the policy. Instead, it may indicate what will be needed (under conservative estimates) to maintain the policy. The validity of a target premium is based on an individual insurance company’s marketing stance, investment performance, and cost control.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is temporary life insurance that’s generally designed to afford coverage for a limited number of years. The policy includes no cash value and can be described as pure protection.”","o":["Permanent Life Insurance","Straight Life Insurance","Term Life Insurance","Extended Term Insurance"],"a":2,"e":"Term Life Insurance: This is temporary life insurance that’s generally designed to afford coverage for a limited number of years. The policy includes no cash value and can be described as pure protection.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is adjustable life insurance under which premiums and coverage are adjustable. For a universal policy, company expenses are not explicitly disclosed to the insured, but a financial report is provided to policy holders annually.”","o":["Straight Life Insurance","Limited Pay Life Insurance","Joint Life Insurance","Universal Life Insurance"],"a":3,"e":"Universal Life Insurance: This is adjustable life insurance under which premiums and coverage are adjustable. For a universal policy, company expenses are not explicitly disclosed to the insured, but a financial report is provided to policy holders annually.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is life insurance whose face value or duration varies depending on the value of underlying securities.”","o":["Variable Life Insurance","Adjustable Life Insurance","Increasing Term Life Insurance","Universal Life Insurance"],"a":0,"e":"Variable Life Insurance: This is life insurance whose face value or duration varies depending on the value of underlying securities.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is the form of life insurance that may be kept in force for a person’s entire life, and that pays a benefit upon the person’s death.”","o":["Increasing Term Life Insurance","Whole Life Insurance","Ordinary Life Insurance","Joint Life Insurance"],"a":1,"e":"Whole Life Insurance: This is the form of life insurance that may be kept in force for a person’s entire life, and that pays a benefit upon the person’s death.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a policy assignment under which the assignee (person to whom the policy is assigned) receives full control over the policy and also full rights to its benefits.”","o":["Viator","Absolute Assignment","Excess Interest","Paid-Up Additions Option"],"a":1,"e":"Absolute Assignment: This is a policy assignment under which the assignee (person to whom the policy is assigned) receives full control over the policy and also full rights to its benefits. Generally, when a policy is assigned to secure a debt, the owner retains all of the rights in the policy in excess of the debt, despite the fact that the assignment is absolute in form.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This clause allows for the right to transfer policy rights to another person or entity.”","o":["Grace Period","Assignment Clause","Common Disaster Provision","Insuring Clause"],"a":1,"e":"Assignment Clause: This clause allows for the right to transfer policy rights to another person or entity.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “The “cash” dividend option allows policy owners to cash out the dividends they receive.”","o":["Exclusions","Juvenile Life Insurance","Cash Option","Paid-Up Additions Option"],"a":2,"e":"Cash Option: The “cash” dividend option allows policy owners to cash out the dividends they receive.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is an assignment of a policy to a creditor as security for a debt. The creditor is entitled to be reimbursed out of policy proceeds for the amount that’s owed. Any proceeds above the amount that’s due at the insured’s time of death will be paid to a beneficiary who’s designated by the policy owner.”","o":["Assignment Clause","Collateral Assignment","Modified Life Policy","Paid-Up Additions Option"],"a":1,"e":"Collateral Assignment: This is an assignment of a policy to a creditor as security for a debt. The creditor is entitled to be reimbursed out of policy proceeds for the amount that’s owed. Any proceeds above the amount that’s due at the insured’s time of death will be paid to a beneficiary who’s designated by the policy owner.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “These are features of an insurance policy which states that the policy will not cover certain risks.”","o":["Viatical Settlement","Exclusions","Decreasing Term Insurance","Straight Life Insurance"],"a":1,"e":"Exclusions: These are features of an insurance policy which states that the policy will not cover certain risks.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is the period after the due date of a premium, during which the policy remains in force without penalty. For example, let’s assume that an insured dies during the _____ of a life insurance policy before paying the required annual premium.”","o":["Target Premium","Reduced Paid-Up Option","Net Payment Cost Index","Grace Period"],"a":3,"e":"Grace Period: This is the period after the due date of a premium, during which the policy remains in force without penalty. For example, let’s assume that an insured dies during the grace period of a life insurance policy before paying the required annual premium. In this case, the beneficiary will receive the face amount of the policy minus any required premiums. For health insurance, remember the numbers 7-10-31. The 7…","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This agreement is the insurer’s basic promise to pay specified benefits to a designated person in the event of a covered loss. The agreement stipulates the scope and limits of coverage, and states, “We ensure to INSURE you for...””","o":["Insuring Clause","Cross-Purchase Plan","Straight Life Insurance","Extended Term Insurance"],"a":0,"e":"Insuring Clause: This agreement is the insurer’s basic promise to pay specified benefits to a designated person in the event of a covered loss. The agreement stipulates the scope and limits of coverage, and states, “We ensure to INSURE you for...”","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “These are the options an insured has for her cash value if she terminates a policy that has a cash value.”","o":["Cash Option","Non-Forfeiture Options","Non-Forfeiture Values","Viator"],"a":1,"e":"Non-Forfeiture Options: These are the options an insured has for her cash value if she terminates a policy that has a cash value. For example, “you are closing your account (surrendering your policy); what do you want us to do with your cash (so you don’t forfeit it)?” When a policy owner decides she doesn’t want her insurance policy any longer, she has the option to surrender her policy.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This dividend option allows the policy owner to exchange the dividend for additional coverage in the form of a one-year term policy.”","o":["Reduced Premiums Option","Fixed Period or Period Certain Option","One-Year Term Option","Paid-Up Additions Option"],"a":2,"e":"One-Year Term Option: This dividend option allows the policy owner to exchange the dividend for additional coverage in the form of a one-year term policy.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This dividend option allows the policy owner to exchange the dividend for an additional single payment whole life policy.”","o":["Reduced Paid-Up Option","Reduced Premiums Option","Cash Option","Paid-Up Additions Option"],"a":3,"e":"Paid-Up Additions Option: This dividend option allows the policy owner to exchange the dividend for an additional single payment whole life policy.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This provision waives future premiums for a juvenile life insurance policy if the person who’s responsible for paying the premiums dies or becomes disabled.”","o":["Payor Provision","Limited Pay Life Insurance","Mortgage Redemption Plan","Other Insurance with This Insurer Provision"],"a":0,"e":"Payor Provision: This provision waives future premiums for a juvenile life insurance policy if the person who’s responsible for paying the premiums dies or becomes disabled.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This non-forfeiture option allows the policy owner to reduce the policy’s benefit amount and, in turn, cease making premium payments.”","o":["Paid-Up Insurance","Fixed Period or Period Certain Option","Reduced Paid-Up Option","Cash Option"],"a":2,"e":"Reduced Paid-Up Option: This non-forfeiture option allows the policy owner to reduce the policy’s benefit amount and, in turn, cease making premium payments.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This dividend option allows the policy owner to return the dividend payment to the insurer in exchange for a reduction in the following year’s premium payments.”","o":["Reduced Premiums Option","One-Year Term Option","Paid-Up Additions Option","Net Payment Cost Index"],"a":0,"e":"Reduced Premiums Option: This dividend option allows the policy owner to return the dividend payment to the insurer in exchange for a reduction in the following year’s premium payments.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This provision allows an insured to put a lapsed policy back in force by producing satisfactory evidence of insurability and paying any required past-due premiums.”","o":["Other Insurance with This Insurer Provision","Convertible Term Life Insurance","Reinstatement Provision","Family Maintenance Policy"],"a":2,"e":"Reinstatement Provision: This provision allows an insured to put a lapsed policy back in force by producing satisfactory evidence of insurability and paying any required past-due premiums. It permits the policy owner to reinstate a policy that has lapsed as long as the policy owner can provide proof of insurability and pays all back premiums, outstanding loans, and interest.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This rider allows the insured to receive a portion of the death benefit prior to death if the insured has a terminal illness that’s certified by a physician and is expected to die within one to two years.”","o":["Whole Life Insurance","Net Premium","Accelerated Benefit Rider","Convertible Term Life Insurance"],"a":2,"e":"Accelerated Benefit Rider: This rider allows the insured to receive a portion of the death benefit prior to death if the insured has a terminal illness that’s certified by a physician and is expected to die within one to two years.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is the person (or entity) who’s designated in a life insurance policy to receive the death proceeds.”","o":["Beneficiary","Human Life Value Approach","Time Limit on Certain Defenses","Paid-Up Additions Option"],"a":0,"e":"Beneficiary: This is the person (or entity) who’s designated in a life insurance policy to receive the death proceeds.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a beneficiary group designation (e.g., all of a person’s children), opposed to specifying one or more beneficiaries by name.”","o":["Fixed Period or Period Certain Option","Class Designation","Adjustable Life Insurance","Maturity Date"],"a":1,"e":"Class Designation: This is a beneficiary group designation (e.g., all of a person’s children), opposed to specifying one or more beneficiaries by name.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a provision of the Uniform Simultaneous Death Act, which ensures a policy owner that death benefits will be paid to the contingent beneficiary if both the insured and the primary beneficiary die within a short period of time of one another.”","o":["Joint Life Survivor","Cross-Purchase Plan","Common Disaster Provision","Other Insurance with This Insurer Provision"],"a":2,"e":"Common Disaster Provision: This is a provision of the Uniform Simultaneous Death Act, which ensures a policy owner that death benefits will be paid to the contingent beneficiary if both the insured and the primary beneficiary die within a short period of time of one another. It also states that the primary beneficiary must outlive the insured by a specified period in order to receive the proceeds.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is the amount of premium that’s paid by the policy owner for policy coverage or insurance protection up to a specific point.”","o":["Target Premium","Life Settlement","Earned Premium","Gross Premium"],"a":2,"e":"Earned Premium: This is the amount of premium that’s paid by the policy owner for policy coverage or insurance protection up to a specific point.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “In life insurance, this provision means that the cash value will increase faster than the guaranteed rate if the insurer earns a greater return than the guaranteed rate.”","o":["Morbidity Rate","Excess Interest","Policy Proceeds","Maturity Date"],"a":1,"e":"Excess Interest: In life insurance, this provision means that the cash value will increase faster than the guaranteed rate if the insurer earns a greater return than the guaranteed rate.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This payment option pays the death benefit proceeds in equal installments over a set number of years. The dollar amount of each installment is dependent on the total number of installments.”","o":["Paid-Up Additions Option","One-Year Term Option","Grace Period","Fixed Period or Period Certain Option"],"a":3,"e":"Fixed Period or Period Certain Option: This payment option pays the death benefit proceeds in equal installments over a set number of years. The dollar amount of each installment is dependent on the total number of installments.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “An insurer’s _____ consists of the net premium for insurance PLUS commissions, operating and miscellaneous expenses, and dividends.”","o":["Non-Forfeiture Options","Gross Premium","Net Premium","Level Premium"],"a":1,"e":"Gross Premium: An insurer’s gross premium consists of the net premium for insurance PLUS commissions, operating and miscellaneous expenses, and dividends.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is the calculation for determining the amount of interest an insurance company can expect to earn from investing insurance premiums.”","o":["Needs Approach","Whole Life Insurance","Cancellable Policies","Interest Factor"],"a":3,"e":"Interest Factor: This is the calculation for determining the amount of interest an insurance company can expect to earn from investing insurance premiums.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is an agreement in which a policy owner sells or transfers ownership in all or part of a life insurance policy to a third party for compensation that’s less than the expected death benefit of the policy.”","o":["Industrial Life Insurance","Life Settlement","Modified Life Policy","Ordinary Life Insurance"],"a":1,"e":"Life Settlement: This is an agreement in which a policy owner sells or transfers ownership in all or part of a life insurance policy to a third party for compensation that’s less than the expected death benefit of the policy.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This rate demonstrates the incidence and extent of disability that may be expected from a given group of people.”","o":["Morbidity Rate","Reduced Paid-Up Option","Credit Insurance","Attained Age"],"a":0,"e":"Morbidity Rate: This rate demonstrates the incidence and extent of disability that may be expected from a given group of people.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This rate is the measure of the number of deaths (in general or due to a specific cause) in some population, scaled to the size of that population, per unit time.”","o":["Mortality Rate","Cancellable Policies","Per Stirpes","Morbidity Rate"],"a":0,"e":"Mortality Rate: This rate is the measure of the number of deaths (in general or due to a specific cause) in some population, scaled to the size of that population, per unit time.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a formula that’s used to determine the actual cost of a policy for a policy owner. It helps the consumer compare costs of death protection between policies that will be held for 10 to 20 years.”","o":["Non-Forfeiture Options","Net Payment Cost Index","Earned Premium","Cost of Living Rider"],"a":1,"e":"Net Payment Cost Index: This is a formula that’s used to determine the actual cost of a policy for a policy owner. It helps the consumer compare costs of death protection between policies that will be held for 10 to 20 years.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is a premium calculation that’s used to calculate an insurer’s policy reserves factoring in interest and mortality.”","o":["Net Payment Cost Index","Net Premium","Gross Premium","Policy Face"],"a":1,"e":"Net Premium: This is a premium calculation that’s used to calculate an insurer’s policy reserves factoring in interest and mortality.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This form evenly distributes benefits among all named living beneficiaries (i.e., all living children).”","o":["Attained Age","Modified Endowment Contract","Beneficiary","Per Capita"],"a":3,"e":"Per Capita: This form evenly distributes benefits among all named living beneficiaries (i.e., all living children).","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This form evenly distributes benefits among an insured’s beneficiaries according to the family line, branch, or root (i.e., children and grandchildren).”","o":["Net Premium","Level Premium","Per Stirpes","Per Capita"],"a":2,"e":"Per Stirpes: This form evenly distributes benefits among an insured’s beneficiaries according to the family line, branch, or root (i.e., children and grandchildren).","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is the first beneficiary in line to receive benefit proceeds upon the death of an insured.”","o":["Collateral Assignment","Extended Term Insurance","Primary Beneficiary","Cancellable Policies"],"a":2,"e":"Primary Beneficiary: This is the first beneficiary in line to receive benefit proceeds upon the death of an insured.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “These are funds that are set aside to pay future claims. Some _____ are required by state statute (statutory _____).”","o":["Health Insurance Premium","Backdating","Reserves","Effective Date"],"a":2,"e":"Reserves: These are funds that are set aside to pay future claims. Some reserves are required by state statute (statutory reserves).","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is the third beneficiary in line to receive death benefit proceeds. The _____ will only receive the death benefit if both the primary and contingent beneficiaries die before the insured.”","o":["Tertiary Beneficiary","Modified Life Policy","Universal Life Insurance","Reduced Premiums Option"],"a":0,"e":"Tertiary Beneficiary: This is the third beneficiary in line to receive death benefit proceeds. The tertiary beneficiary will only receive the death benefit if both the primary and contingent beneficiaries die before the insured.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is the department within an insurance company that’s responsible for reviewing applications, approving or declining applications, and assigning risk classifications.”","o":["Insurable Interest","Underwriting Department","Post-Claims Underwriting","Reserves"],"a":1,"e":"Underwriting Department: This is the department within an insurance company that’s responsible for reviewing applications, approving or declining applications, and assigning risk classifications.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This act states that if the insured and the primary beneficiary die in a common accident at approximately the same time, with no clear evidence as to who died first, the law will assume that the primary died first. Therefore, the death benefit proceeds are paid to the contingent beneficiaries.”","o":["Joint Life Survivor","Paid-Up Additions Option","Excess Interest","Uniform Simultaneous Death Act"],"a":3,"e":"Uniform Simultaneous Death Act: This act states that if the insured and the primary beneficiary die in a common accident at approximately the same time, with no clear evidence as to who died first, the law will assume that the primary died first. Therefore, the death benefit proceeds are paid to the contingent beneficiaries.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This settlement involves a person with a terminal illness selling his existing life insurance policy to a third party for a percentage of the death benefit.”","o":["Human Life Value Approach","Viatical Settlement","Universal Life Insurance","Net Payment Cost Index"],"a":1,"e":"Viatical Settlement: This settlement involves a person with a terminal illness selling his existing life insurance policy to a third party for a percentage of the death benefit.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is the new third-party owner in a _____ settlement.”","o":["Viatical","Morbidity Rate","Gross Premium","Life Settlement"],"a":0,"e":"Viatical: This is the new third-party owner in a viatical settlement.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This is the original policy owner in a viatical settlement.”","o":["Reduced Paid-Up Option","Viator","Ordinary Life Insurance","Human Life Value Approach"],"a":1,"e":"Viator: This is the original policy owner in a viatical settlement.","t":"Life Insurance Policies & Riders","k":"d","g":0},{"q":"Which term matches this definition? “This represents the tendency of a disproportionate number of poor risks to seek or buy insurance or to maintain existing insurance in force (i.e., the selection against the insurance company). Sound underwriting reduces _____.”","o":["Effective Date","Adverse Selection","Underwriter","Constructive Delivery"],"a":1,"e":"Adverse Selection: This represents the tendency of a disproportionate number of poor risks to seek or buy insurance or to maintain existing insurance in force (i.e., the selection against the insurance company). Sound underwriting reduces adverse selection.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is the date halfway between birthdays when the applicant’s _____ to the next higher age. For some insurers, the age is based on the applicant’s age at his nearest birthday, while for others, it’s based on the applicant’s age as of his last birthday.”","o":["Age Change","Disclosure Form","Health Insurance Premium","Special Questionnaire"],"a":0,"e":"Age Change: This is the date halfway between birthdays when the applicant’s age changes to the next higher age. For some insurers, the age is based on the applicant’s age at his nearest birthday, while for others, it’s based on the applicant’s age as of his last birthday.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “The _____ is the person who’s completing an application with an insurance company for the insurance policy. In most cases, the _____ is also the proposed insured, but this is not always the case.”","o":["Applicant","Buyer’s Guide","Morbidity","Effective Date"],"a":0,"e":"Applicant: The applicant is the person who’s completing an application with an insurance company for the insurance policy. In most cases, the applicant is also the proposed insured, but this is not always the case.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “The _____ is the statement of information that’s given when a person applies for life, health, or disability insurance. The insurance company’s underwriter uses this information as a basis in determining whether the applicant qualifies for acceptance under the company’s guidelines.”","o":["Insurable Interest","Risk Classification","Application","Special Class"],"a":2,"e":"Application: The application is the statement of information that’s given when a person applies for life, health, or disability insurance. The insurance company’s underwriter uses this information as a basis in determining whether the applicant qualifies for acceptance under the company’s guidelines. Applications are attached to, and made a part of, all individual contracts.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is the practice of making the effective date of a policy earlier than the application date. _____ is used to make the issue age lower than an applicant’s real age in order to obtain a lower premium. State laws typically limit the amount by which an insurer may backdate a policy to six months.”","o":["Inspection Receipt","Backdating","Payor","Buyer’s Guide"],"a":1,"e":"Backdating: This is the practice of making the effective date of a policy earlier than the application date. Backdating is used to make the issue age lower than an applicant’s real age in order to obtain a lower premium. State laws typically limit the amount by which an insurer may backdate a policy to six months. Backdating is not allowed in variable contracts due to the nature of the investment.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is a pamphlet which describes and compares various forms of life or health insurance. This guide must be provided to a consumer by the producer when the producer is attempting to solicit insurance.”","o":["Field Underwriter","Buyer’s Guide","Buyer’s Guide","Statement of Continued Good Health"],"a":1,"e":"Buyer’s Guide: This is a pamphlet which describes and compares various forms of life or health insurance. This guide must be provided to a consumer by the producer when the producer is attempting to solicit insurance. This guide provides the consumer with information so that she can make an informed decision when purchasing insurance coverage.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This report is a detailed background investigation that may include an interview with co-workers, friends, and neighbors about an applicant’s character, reputation, lifestyle, etc. Insurers are allowed to conduct a _____ to obtain additional information as long there’s no invasion of privacy present.”","o":["Outline of Coverage","Consumer Report","Warranties","Field Underwriter"],"a":1,"e":"Consumer Report: This report is a detailed background investigation that may include an interview with co-workers, friends, and neighbors about an applicant’s character, reputation, lifestyle, etc. Insurers are allowed to conduct a consumer report to obtain additional information as long there’s no invasion of privacy present. A common type of consumer report involves a credit report.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This describes an individual whose application for coverage was rejected by an insurance company.”","o":["Declined Risk","Risk Classification","Preferred Risk","Outline of Coverage"],"a":0,"e":"Declined Risk: This describes an individual whose application for coverage was rejected by an insurance company.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “As required by various state regulatory agencies, this is a comparison form that must be given to every policy owner who chooses to replace an existing policy with another.”","o":["Disclosure Form","Consumer Report","Policy Summary","Representations"],"a":0,"e":"Disclosure Form: As required by various state regulatory agencies, this is a comparison form that must be given to every policy owner who chooses to replace an existing policy with another.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is a federal law that was passed in 1970, which provides an insurer with the right to receive additional information about insurance applicants. This law permits an insurer to conduct a consumer report on applicants and proposed insureds. An applicant for insurance must be informed of the purpose of the report.”","o":["Fair Credit Reporting Act","Representations","Effective Date","USA PATRIOT Act"],"a":0,"e":"Fair Credit Reporting Act: This is a federal law that was passed in 1970, which provides an insurer with the right to receive additional information about insurance applicants. This law permits an insurer to conduct a consumer report on applicants and proposed insureds. An applicant for insurance must be informed of the purpose of the report. If the insurance company declines coverage due to information in the report, the insurer must provide…","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is the agent or producer who completes the applicant’s application for insurance.”","o":["Replacement","Medical Information Bureau","Avocation","Field Underwriter"],"a":3,"e":"Field Underwriter: This is the agent or producer who completes the applicant’s application for insurance.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This describes the financial or emotional relationship between two or more parties. In health insurance, _____ exists if the applicant is in a position to suffer a loss if the insured incurs medical expenses or is unable to work due to a disability.”","o":["Consumer Report","Age Change","Insurable Interest","Backdating"],"a":2,"e":"Insurable Interest: This describes the financial or emotional relationship between two or more parties. In health insurance, insurable interest exists if the applicant is in a position to suffer a loss if the insured incurs medical expenses or is unable to work due to a disability.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is a service organization that collects medical data on life and health insurance applicants for member insurance companies.”","o":["Premium","Medical Information Bureau","Age Change","Underwriting Department"],"a":1,"e":"Medical Information Bureau: This is a service organization that collects medical data on life and health insurance applicants for member insurance companies.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This summarizes the basic terms of an insurance policy, including the conditions, coverage limitations, and premiums. Policy summaries are often used with life insurance, long-term care insurance, and annuities.”","o":["Rated-up Policy","Policy Fee","Issue Date","Policy Summary"],"a":3,"e":"Policy Summary: This summarizes the basic terms of an insurance policy, including the conditions, coverage limitations, and premiums. Policy summaries are often used with life insurance, long-term care insurance, and annuities.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This describes an applicant who represents the likelihood of risk that’s lower than that of the standard applicant. This is typically due to better than average physical condition, occupation, mode of living, and other characteristics as compared to other applicants of the same age.”","o":["Fair Credit Reporting Act","Substandard Risk","Preferred Risk","Consumer Report"],"a":2,"e":"Preferred Risk: This describes an applicant who represents the likelihood of risk that’s lower than that of the standard applicant. This is typically due to better than average physical condition, occupation, mode of living, and other characteristics as compared to other applicants of the same age.","t":"Contracts, Applications & Underwriting","k":"d","g":0},{"q":"Which term matches this definition? “This is the person whose life is requesting to be insured. Typically, but not always, the _____ is also the applicant.”","o":["Policy Summary","Proposed Insured","Applicant","Interest"],"a":1,"e":"Proposed In
