<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life &amp; Health Insurance Pre-licensing Quiz</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--ink:#1d2321;--mute:#5d6662;--line:#dcd9d0;--acc:#1f6f5c;--acc-ink:#fff;--ok:#1b7a43;--okbg:#e4f4ea;--bad:#b3362b;--badbg:#fbe9e6;--warn:#b26a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1d2321;--ink:#eceee9;--mute:#9aa49f;--line:#323a37;--acc:#4cb59b;--acc-ink:#0c1512;--ok:#6fd49a;--okbg:#17301f;--bad:#f08a7e;--badbg:#38201d;--warn:#e8b04a}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:.2em 0 .1em;line-height:1.25}
p.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label.t{display:block;font-weight:600;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn{border-radius:10px;padding:11px 18px;font-weight:600}
.btn.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=number]{font:inherit;width:84px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.big{font-size:2rem;font-weight:700;color:var(--acc)}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.timer{font-weight:700;font-size:1.15rem}.timer.low{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.q{font-size:1.1rem;font-weight:600;margin:0 0 8px}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--okbg);border-left:4px solid var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.rv{border-top:1px solid var(--line);padding:14px 0}
.rv:first-child{border-top:0}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:6px}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}
.chip small{opacity:.7;margin-left:4px}.bt{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:.95rem}.bt:first-child{border-top:0}.fcard{display:block;width:100%;min-height:270px;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;margin-bottom:12px}
.fcard.back{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,var(--card))}
.fs{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:12px}
.ft{font-size:1.1rem}.fa{font-weight:700;color:var(--acc);font-size:1.25rem;margin-bottom:10px}
.mute{color:var(--mute)}.hide{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats div{background:var(--bg);border-radius:10px;padding:10px}
.stats small{display:block;color:var(--mute)}
.stats strong{font-size:1.25rem}
</style></head><body><div class="wrap">

<section id="setup">
<h1>Life &amp; Health Insurance Pre-licensing Quiz</h1>
<p class="sub"><span id="total"></span> U.S. practice questions in <span id="ntop"></span> topics. Choose topics, how many questions you want, and how to time yourself.</p>
<div class="card">
<label class="t">Mode</label>
<div class="row" id="studies"><button class="chip" data-s="quiz" aria-pressed="true">Quiz</button><button class="chip" data-s="cards" aria-pressed="false">Flashcards</button></div>
</div>
<div class="card">
<label class="t">Question set</label>
<div class="row" id="scopes"></div>
</div>
<div class="card">
<label class="t">Topics</label>
<div class="row" id="topics"></div>
<div class="row" style="margin-top:10px"><button class="chip" id="allT">Select all</button><button class="chip" id="noneT">Clear</button></div>
</div>
<div class="card">
<label class="t">Question style</label>
<div class="row" id="kinds"></div>
</div>
<div class="card">
<label class="t" for="cnt">Number of questions or cards: <span id="cntv" class="big" style="font-size:1.3rem"></span></label>
<input type="range" id="cnt" min="5" step="1">
<div class="row" id="presets" style="margin-top:10px"></div>
</div>
<div class="card" id="timerCard">
<label class="t">Timer</label>
<div class="row" id="tmodes">
<button class="chip" data-m="up" aria-pressed="true">Stopwatch</button>
<button class="chip" data-m="down" aria-pressed="false">Countdown</button>
<button class="chip" data-m="off" aria-pressed="false">No timer</button>
</div>
<div id="cdbox" class="row hide" style="margin-top:12px">
<span>Time limit:</span><input type="number" id="mins" min="1" max="300"><span>minutes</span>
<span class="mute">(the quiz ends when time runs out)</span>
</div>
</div>
<div class="card" id="fbCard">
<label class="t">Feedback</label>
<div class="row" id="fmodes">
<button class="chip" data-f="1" aria-pressed="true">Practice: show answer after each question</button>
<button class="chip" data-f="0" aria-pressed="false">Exam: review at the end</button>
</div>
</div>
<button class="btn p" id="start">Start quiz</button>
</section>

<section id="quiz" class="hide">
<div class="top"><span id="prog"></span><span class="timer" id="clock"></span></div>
<div class="bar"><i id="pbar"></i></div>
<div class="card">
<p class="q" id="qtext"></p>
<div id="opts"></div>
<div id="fb" class="fb hide"></div>
</div>
<div class="nav"><button class="btn" id="endnow">End quiz</button><button class="btn p" id="next" disabled>Next</button></div>
</section>

<section id="cards" class="hide">
<div class="top"><span id="cprog"></span><span id="cknown" class="mute"></span></div>
<div class="bar"><i id="cbar"></i></div>
<div id="cplay">
<button class="fcard" id="fcard" aria-label="Flip card"><div class="fs" id="fside"></div><div id="fbody"></div></button>
<p class="mute" style="text-align:center;margin:0 0 12px">Tap the card to flip it</p>
<div class="nav"><button class="btn" id="cback">Back</button><button class="btn" id="cagain">Still learning</button><button class="btn p" id="cgot">Got it</button></div>
<div class="row" style="margin-top:14px"><button class="chip" id="cend">End session</button></div>
</div>
<div id="cdone" class="card hide"><div class="big" id="cdt"></div><p id="cds" class="mute"></p>
<div class="row"><button class="btn p" id="cmiss">Study cards I’m still learning</button><button class="btn" id="cnew">New session</button></div></div>
</section>

<section id="result" class="hide">
<h1>Results</h1>
<div class="card">
<div class="big" id="score"></div>
<div class="stats" style="margin-top:12px">
<div><small>Correct</small><strong id="sc"></strong></div>
<div><small>Time used</small><strong id="st"></strong></div>
<div><small>Avg per question</small><strong id="sa"></strong></div>
</div>
</div>
<div class="card" id="bytopic"></div>
<div class="row" style="margin-bottom:14px">
<button class="chip" data-r="all" aria-pressed="true">All answers</button>
<button class="chip" data-r="bad" aria-pressed="false">Missed only</button>
</div>
<div class="card" id="review"></div>
<div class="row">
<button class="btn p" id="retry">Retake missed</button>
<button class="btn" id="again">New quiz</button>
</div>
</section>
</div>
<script>
const Q=[{"q":"An example of rebating would be","o":["reducing the premiums across the board for a specific risk class","using intimidation in order to restrain or monopolize the business of insurance.","a mutual insurance company paying dividends to its policyowners","offering a client something of value not stated in the contract in exchange for their business"],"a":3,"e":"Rebating can be defined as offering a prospect something of value that is not specified in a contract in order to induce the purchase of that contract.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"An insurance agent is guilty of _____ if the agent misrepresents a policy to induce a policyowner to surrender an existing policy.","o":["sliding","coercion","misrepresentation","twisting"],"a":3,"e":"An insurance agent is guilty of twisting if the agent misrepresents a policy to induce a policyowner to surrender an existing policy.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"S takes out an accident and sickness insurance policy which contains a provision that states that the agent does not have the authority to change the policy or waive any of its provisions. Which health policy provision is this?","o":["Entire Contract","Insurance with other insurers","Legal Actions","Reinstatement"],"a":0,"e":"The Entire Contract provision states that the agent does NOT have the authority to change the policy or waive any of its provisions.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"Convincing a prospective insured to buy an insurance policy based on exaggerations is called","o":["rebating","intimidation","misrepresentation","twisting"],"a":2,"e":"It is illegal to issue, publish, or circulate any illustration or sales material that is false, misleading, or deceptive as to policy benefits or terms, the payment of dividends, etc. This also refers to oral statements. Committing this illegal act is called misrepresentation.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"An insurance agent is in violation of the Rules Governing Advertisement of Life Insurance and Annuities if the agent takes which of the following actions during a sales presentation?","o":["Asks prospects for referrals","Analyzes another insurance company’s policy","Refers to guaranteed policy dividends","Compares the costs of two similar policies"],"a":2,"e":"Under the Rules Governing Advertisement of Life Insurance and Annuities, dividends cannot be advertised as guaranteed.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"Cash surrendering an existing whole life policy and purchasing a new whole life policy is referred to as a(n)","o":["illegal transaction","conversion","cancellation","replacement"],"a":3,"e":"Purchasing a new whole life insurance policy after cash surrendering an existing whole life policy is considered a Life Insurance policy replacement and is heavily regulated.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"The purpose of the Rules Governing Advertisement of Life Insurance and Annuities is to","o":["provide a potential client with all consumer ratings for the insurer","help drive sales quotas for insurers","set advertisement rates for insurers","assure full disclosure to the public of all material and relevant information"],"a":3,"e":"One purpose of the Rules Governing Advertisement of Life Insurance and Annuities is to assure full disclosure to the public of all material and relevant information.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"An insurer is licensed to conduct business in a state other than the one where it is domiciled (for example, licensed in Texas but domiciled in New Jersey). In Texas, that insurer is called a(n):","o":["alien company","foreign company","non-admitted company","domestic company"],"a":1,"e":"An insurer licensed in a state but domiciled in another U.S. state is a foreign insurer there. An alien insurer is organized outside the United States, and a domestic insurer is domiciled in the state.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"Under state insurance law, every life insurance policyowner must be offered which of the following?","o":["Inflation rider","Double money-back guarantee","Free-look period","Waiting period"],"a":2,"e":"A free-look period allows a policyowner time to examine the policy and request a full refund for any reason. State law requires this provision, though the length of the period varies by state.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"Insurance companies that are organized in countries outside the United States are referred to as","o":["international","alien","domestic","foreign"],"a":1,"e":"An insurance company that is organized or chartered in a country other than the United States is defined as alien.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"What’s the requirement for a nonresident agent license applicant?","o":["Meeting a minimum sales quota in agent’s home state","Being a licensed agent in the agent’s home state","Residing in home state for 10 years","Passing a nonresident examination"],"a":1,"e":"An applicant for a nonresident agent license must be licensed as an agent in the agent’s state of domicile.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"The _____ must provide an insured with proper disclosure concerning the replacement of an insurance policy.","o":["underwriter","agent","Commissioner","applicant"],"a":1,"e":"The agent must provide an insured with proper disclosure concerning the replacement of an insurance policy.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"Which of the following is considered to be misrepresentation?","o":["Representing a foreign insurer","Replacing an existing policy with a new one","Sharing commissions with other licensed agents","An agent guaranteeing a policy’s dividends"],"a":3,"e":"Stating that dividends are guaranteed is considered a misrepresentation.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"A mutual insurance company and a stock insurance company have one main difference between them. What is this major contrast?","o":["Stock company is owned by its shareholders. Mutual company is owned by its policyholders.","Stock company is owned by its policyholders. Mutual company is owned by its shareholders.","Stock company is considered an authorized insurer. Mutual company is considered an unauthorized insurer.","Stock company is regulated by the state where it’s incorporated. Mutual company is regulated by its policyholders."],"a":0,"e":"A stock company is owned by its shareholders and a mutual company is owned by its policyholders.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"Which Unfair Trade Practice involves an agent suggesting that an insurance policy is like a share of stock?","o":["Intimidation","Misrepresentation","Sliding","Twisting"],"a":1,"e":"If an agent tells an applicant that an insurance policy is like a share of stock, the agent may be guilty of misrepresentation.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"Under a Long Term Care policy, which benefit would be typically excluded or limited?","o":["Alcohol rehabilitation","Home health care","Skilled nursing","Intermediate nursing"],"a":0,"e":"Addictive behavior rehabilitation is normally excluded or limited under a Long Term Care policy.","t":"Long-Term Care","k":"e","g":0},{"q":"Which Long Term Care insurance statement is true?","o":["Benefits are usually payable for alcohol rehabilitation","Inflation protection is usually not offered","Pre-existing conditions must be covered after the coverage has been in force for six months","Can only be offered to individuals under the age of 70"],"a":2,"e":"Pre-existing conditions are those for which medical advice or treatment was recommended by or received from a health provider within 6 months preceding the effective date of an individual long-term care policy.","t":"Long-Term Care","k":"e","g":0},{"q":"When a policyowner cash surrenders a Universal Life insurance policy in it’s early years, this may be considered a red flag for a(n):","o":["Unfair Trade Practice violation","Title 18 Fraud violation","Anti-Money Laundering violation","Federal Fair Credit Act Violation"],"a":2,"e":"When a policyowner cash surrenders a Universal Life insurance policy in it’s early years, this may be considered a red flag for an Anti-Money Laundering violation.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"Which of the following phrases refers to the fees charged by a healthcare professional?","o":["Deductible","Usual, customary, and reasonable expenses","Coinsurance","Hospital expense"],"a":1,"e":"The insurance phrase which considers a particular fee charged by a physician or other health professional is usual, customary, and reasonable expenses.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"When does a life insurance contract become effective if the initial premium is not collected during the application process?","o":["After all medical and personal information has been evaluated","When producer delivers policy and collects initial premium","When insurer receives initial premium from the producer","After application has been approved by the underwriters"],"a":1,"e":"Insurance becomes effective on delivery of the policy to the insured and payment of the initial premium to the producer.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"A Major Medical policy typically contains a provision that requires the insurer to pay only part of a loss, while the balance is paid by the insured. This provision is called","o":["Coinsurance","Indemnity","Co-deductible","Assignment of Benefits"],"a":0,"e":"The provision in a Major Medical policy that requires the insurance company pay only part of a loss and the insured to pay the balance is known as coinsurance.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"Which of the following medical expenses does Cancer insurance NOT cover?","o":["Arthritis","Radiation treatment","Physician visit","Chemotherapy"],"a":0,"e":"Cancer insurance typically covers all of these medical expenses except for arthritis.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"Comprehensive Major Medical policies usually combine:","o":["Basic Hospital/Surgical with Accidental coverage","Major Medical with Disability Income coverage","Major Medical with Basic Hospital/Surgical coverage","Basic/Hospital/Surgical with Disability Income coverage"],"a":2,"e":"A Comprehensive Major Medical Policy combines Basic Hospital/Surgical and Major Medical insurance.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"D the agent met with a prospect and ended up selling an insurance policy. While filling out the insurance application, D makes a mistake. In this situation, D MUST","o":["correct the information and have the prospect initial the change","correct the information with no further action from prospect necessary","receive a verbal acknowledgement from prospect of the mistake made","request that the insurer issue the policy with a rating"],"a":0,"e":"If an agent makes an error on an insurance application the agent must correct the information and have the applicant initial the changes.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"What type of life insurance are credit policies issued as?","o":["Term","Universal","Whole","Variable"],"a":0,"e":"The type of insurance used is decreasing term, with the term matched to the length of the loan period (though usually limited to 10 years or less) and the decreasing insurance amount matched to the declining loan balance.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"Q is severely injured in an automobile accident and becomes totally disabled. How many months must Q be disabled before being able to file for Social Security disability benefits?","o":["4","5","6","3"],"a":1,"e":"You are eligible to file for Social Security benefits after being totally disabled for 5 months.","t":"Medicare, Social Security & Government Programs","k":"e","g":0},{"q":"Which of these do NOT constitute policy delivery?","o":["Policy delivered to the applicant by the agent","Policy mailed to agent","Policy issued with a rating","Policy mailed to applicant"],"a":2,"e":"All of these constitute delivery of the policy EXCEPT issuing a rated policy.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"A Life insurance policyowner would like to take out a policy loan against the cash value in his Whole Life policy. The interest rate applied to this loan may vary over time. This is referred to as a(n) ________ rate loan.","o":["Fixed","Increasing","Variable","Fluctuating"],"a":2,"e":"The interest rate on a Variable rate cash value loan may vary over time.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"The premiums paid by an employer for his employee’s group life insurance are usually considered to be:","o":["tax-deductible to the employer","taxable income to the employee","partially deductible to the employee","tax-deductible to the employee"],"a":0,"e":"The amount an employer pays for his employee’s life insurance is typically deductible to the business.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"Which of these statements about a Guaranteed Insurability Option rider is NOT TRUE?","o":["Coverage can be added at specific ages","Evidence of insurability is required when the option is exercised","Coverage can be added at specific events such as marriage or having a child","Evidence of insurability is not required when the option is exercised"],"a":1,"e":"All of these statements are true, EXCEPT \"Evidence of insurability is required when the option is exercised\".","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"Which of the following is NOT a limited benefit plan?","o":["Dental policy","Life insurance policy","Cancer policy","Critical illness policy"],"a":1,"e":"All of these are limited benefit plans EXCEPT life insurance policies.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"G purchased a Family Income policy at age 40. The policy has a 20-year rider period. If G were to die at age 50, how long would G’s family receive an income?","o":["15 years","20 years","5 years","10 years"],"a":3,"e":"In this situation, the family would receive an income from the policy for 10 years. Family Income policies pay an income beginning at the insured’s death and continues for a period specified from the date of policy issue.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"All of these statements concerning Settlement Options are true, EXCEPT:","o":["Proceeds can be administered by the insurance company","Rapid depletion of proceeds can be avoided","Increased proceeds can be provided through accumulation of interest","Only the beneficiary may select"],"a":3,"e":"Settlement options may be selected by the policyowner.","t":"Annuities, Settlement Options & Retirement","k":"e","g":0},{"q":"Which of these is NOT relevant when determining the amount of personal life insurance needed?","o":["Household income","Local unemployment rate","Household debt","Existing life insurance coverage"],"a":1,"e":"In calculating the amount of personal life insurance needed, all of the following information would be directly relevant EXCEPT local unemployment rates.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"A pilot applies for Life insurance. The insurer approves the application with a $10 additional monthly premium modification due to the risk involved. The pilot declines the additional premium modification. The insurer will then likely issue the coverage with a(n)","o":["Disability Rider","Aviation Exclusion","Graded Benefit","Waiver of Premium"],"a":1,"e":"The policy in this situation will likely require an Aviation Exclusion.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"ABC Insurance Company has accepted a life insurance application which contains unanswered questions. The company then makes the application part of the life contract. In this situation, the insurer has:","o":["issued a voidable policy","assigned the risk to a reinsurer","waived one of its legal rights","committed an act of fraud"],"a":2,"e":"If an insurer accepts an application that contains unanswered questions and makes the application part of the life contract, the company has waived one of its legal rights.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"Traditional individual retirement annuity (IRA) distributions must start by:","o":["age 65","April 1st of the year following the year the participant attains age 59 1/2","age 59 1/2","April 1st of the year following the year the participant attains age 73"],"a":3,"e":"Distributions from a traditional IRA must be made by April 1 following the year the participant turns age 73 or an excise tax will be assessed.","t":"Annuities, Settlement Options & Retirement","k":"e","g":0},{"q":"B owns a Whole Life policy with a guaranteed insurability option that allows him to purchase, without evidence of insurability, stated amounts of","o":["additional Whole Life coverage at any time","additional Whole Life coverage at specified times","additional Term Life coverage at specified intervals","additional Term Life coverage at any time"],"a":1,"e":"A guaranteed insurability option in a Whole Life Policy permits the policyowner to purchase, without evidence of insurability, stated amounts of Whole Life insurance at specified times.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"C is a key employee at ABC Incorporated. If a Key Employee life policy is purchased on her life, which of these statements would be true?","o":["C is the policyowner and the insured, and ABC is the beneficiary","ABC is the policyowner, C is the insured, and her husband is the beneficiary","C is the policyowner, the insured, and the beneficiary","ABC is the policyowner, C is the insured, and ABC is the beneficiary"],"a":3,"e":"In this situation, ABC is the policyowner, C is the insured, and ABC is the beneficiary.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"The cash value in a(n) ____________ Life policy may fluctuate to reflect changing assumptions regarding mortality cost, interest, and expense factors.","o":["Term","Graded","Endowment","Universal"],"a":3,"e":"A Universal Life policy has a cash value that may fluctuate to reflect changing assumptions regarding mortality cost, interest, and expense factors.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"Which of the following situations does a Critical Illness plan cover?","o":["Leukemia","Asthma","Alcohol rehabilitation","Severe car accident"],"a":0,"e":"Leukemia is a type of cancer and would be covered under a Critical Illness plan.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"The Common Disaster clause provides that if both the insured and the sole named beneficiary were to die in a common accident, which of the following is true?","o":["This clause provides the payment of proceeds to the beneficiary’s estate","The estate taxes in the beneficiary’s estate may be reduced","This clause provides the payment of proceeds to the insured’s estate","The estate taxes in the insured’s estate may be reduced"],"a":2,"e":"The Common Disaster clause provides that in the event of simultaneous death, the beneficiary is presumed to die first and therefore the contingent beneficiary would be next in line for proceeds. If no contingent beneficiary, then the proceeds would be paid to the insured’s estate.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"K purchased a Life insurance policy in 1986 which paid 10% interest in the early years of the policy. Twenty years after the purchase, she received a notice from the insurer stating that the policy will soon terminate unless a much-higher premium is paid because of falling interest rates. This type of policy is known as a(n) _________ life policy.","o":["Whole","Universal","Increasing","Graded"],"a":1,"e":"Universal life insurance, popular in the 1980s, worked as advertised for years, when interest rates were in the high single digits and above. Interest rates have since taken a dramatic fall, which negatively affected the performance of Universal Life policies issued in the 1980’s. This ultimately resulted in the policyowner paying a much higher premium due to the increased cost of the underlying Term life policy and having no cash value to offset the premiums.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"Life insurance immediately creates an estate upon the death of an insured. Which of the following policies is characterized by a guaranteed minimum death benefit?","o":["Universal life","Modified endowment contract","Fixed annuity","Variable life"],"a":3,"e":"The variable nature of a variable whole life insurance is its death benefit. However, if investment performance is poor, the death benefit will not go lower than the policy’s guaranteed minimum.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"A 15-year mortgage is best protected by what kind of life policy?","o":["Modified whole life","15-year level term","15-year decreasing term","Adjustable life"],"a":2,"e":"A 15-year mortgage is best protected by a 15-year decreasing term policy.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"Dividends paid from a life insurance policy are","o":["issued by the insurer","guaranteed","issued by the Department of Insurance","taxable"],"a":0,"e":"Dividends paid from a life insurance policy are issued by the insurer.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"J let her life insurance policy lapse 8 months ago due to nonpayment. She can reestablish coverage under which of the following provisions?","o":["Waiver of Premium","Reinstatement provision","Payor clause","Automatic Premium Loan provision"],"a":1,"e":"In cases where a policyowner wishes to reinstate a lapsed policy, the reinstatement provision allows the policyowner to do so with some limitations.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"M had an annual life insurance premium payment due January 1. She died January 10 without making the premium payment. What action will the insurer take?","o":["Subtract past due premium from cash value","Collect premium from M’s estate","Pay face amount minus the past due premium","Deny the claim"],"a":2,"e":"In this situation, the insurer would pay the death benefit less the past-due premium because death occurred within the grace period.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"The Accidental Death and Dismemberment (AD&D) provision in a life insurance policy would pay additional benefits if the insured:","o":["becomes chronically ill","becomes critically ill","dies of natural causes","is blinded in an accident"],"a":3,"e":"The Accidental Death and Dismemberment (AD&D) provision in a life insurance policy would pay additional benefits if the insured is blinded in an accident.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"Which of these retirement plans can be started by an employee, even if another plan is in existence?","o":["Keogh plan","Defined plan","403(b) plan","Individual Retirement Account (IRA)"],"a":3,"e":"An IRA may be established by an employee, regardless of any other retirement plan.","t":"Annuities, Settlement Options & Retirement","k":"e","g":0},{"q":"A characteristic of Preferred Provider Organizations (PPOs) would be:","o":["Physicians are paid on a capitation basis","Discounted fees for the patient","Not allowed to see out-of-network physicians","A primary care physician is required"],"a":1,"e":"Under Preferred Provider Organizations, patient fees are discounted in return for using listed providers.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"Which settlement option pays a stated amount to an annuitant, but no residual value to a beneficiary?","o":["Fixed Amount","Life Income","Interest Only","Fixed Period"],"a":1,"e":"The Life Income settlement option pays a specified amount to the annuitant with no residual value payable to a beneficiary.","t":"Annuities, Settlement Options & Retirement","k":"e","g":0},{"q":"The guarantee of insurability option provides a long-term care policyowner the ability to:","o":["cancel the policy at anytime","buy additional coverage at a later date","add the insured’s spouse at a later date","pay the same premium for life"],"a":1,"e":"In long-term care insurance, the guarantee of insurability option provides the insured with the ability to purchase additional insurance at a later date without evidence of insurability.","t":"Long-Term Care","k":"e","g":0},{"q":"The incontestable clause allows an insurer to:","o":["contest a claim during the Contestable Period","disallow a change of beneficiary during the Contestable period","contest a claim at anytime if the cause of death was accidental","disallow a change of ownership throughout the Contestable period"],"a":0,"e":"The incontestable clause or provision specifies that after a certain period of time (usually two years from the issue date), the insurer no longer has the right to contest the validity of the life insurance policy so long as the contract continues in force.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"Which of the following actions require a policyowner to provide proof of insurability in an Adjustable Life policy?","o":["increase face amount","decrease face amount","increase premium-paying period","decrease premium payment"],"a":0,"e":"All of these actions can be taken by a policyowner without proof of insurability except for increasing the face amount.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"Under the USA Patriot Act, insurers are required to report receipt of cash payments in excess of:","o":["$10,000","$5,000","$2,500","$7,500"],"a":0,"e":"The anti-money laundering provisions of the USA Patriot Act require insurers to report any cash payments received that are greater than $10,000.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"A whole life insurance policyowner does not wish to continue making premium payments. Which of the following enables the policyowner to sell the policy for more than its cash value?","o":["Cash surrender","Buy-sell arrangement","1031 Exchange","Life settlement contract"],"a":3,"e":"A Life settlement contract allows a policyowner to sell a life insurance policy for more than its cash value.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"Which of these terms accurately defines an underwriter’s assessment of information on a life insurance application?","o":["Inspection report","Risk classification","Insurable interest","Warranty review"],"a":1,"e":"Underwriting, another term for risk selection, is the process of reviewing the many characteristics that make up the risk profile of an applicant to determine if the applicant is insurable and, if so, at standard or substandard rates.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"Under a Basic Medical Expense policy, what does the hospitalization expense portion cover?","o":["surgeon’s fees","hospital room and board","hospital administration expenses","physician fees"],"a":1,"e":"The hospitalization expense of a Basic Medical Expense policy pays for hospital room and board.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"M purchased an Accidental Death and Dismemberment (AD&D) policy and named his son as beneficiary. M has the right to change the beneficiary designation at anytime. What type of beneficiary is his son?","o":["Revocable","Contingent","Tertiary","Irrevocable"],"a":0,"e":"With a revocable beneficiary designation, the policyowner may change the beneficiary at any time without notifying or getting permission from the beneficiary.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"What is the initial requirement for an insured to become eligible for benefits under the Waiver of Premium provision?","o":["Insured must demonstrate financial need","Insured must be hospitalized","Insured must be unemployed","Insured must be under a physician’s care"],"a":3,"e":"Under Waiver of Premium, which is a rider that will pay your premium while you’re disabled, you must have a doctor certify that you meet the definition of disability as contained in the rider.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"The __________ is authorized to assign a Life Insurance policy as collateral for a loan.","o":["policyowner","lender","beneficiary","insured"],"a":0,"e":"A life insurance policy may ONLY be assigned as collateral by the policyowner.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"N is covered by a Term Life policy and does not make the required premium payment which was due August 1. N dies September 15. What action will the insurer take?","o":["Claim will be paid in full","Claim will be partially paid","Claim will be denied","Claim will be decided by an arbitrator"],"a":2,"e":"In this situation, the insurance company will deny the claim, as the policy would have lapsed due to nonpayment by September 15.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"A life insurance arrangement which circumvents insurable interest statutes is called:","o":["an indemnity contract","Investor-Originated Life Insurance","key person insurance","a contract of adhesion"],"a":1,"e":"Investor-originated life insurance (or IOLI) is used to circumvent state insurable interest statutes. This is done when an investor (or stranger) persuades an individual to take out life insurance specifically for the purpose of selling the policy to the investor. The investor compensates the insured and makes the premiums, then collects the death benefit when the insured dies.","t":"State Law, Licensing & Ethics","k":"e","g":0},{"q":"Which statement is correct regarding the premium payment schedule for whole life policies?","o":["Premiums are payable throughout the insured’s lifetime/ coverage lasts until death of the insured","Premiums are payable until age 65/ coverage lasts a lifetime","Premiums are payable for a set period/ coverage expires at that point","A single premium is paid at time of application/ coverage lasts until retirement"],"a":0,"e":"With whole life insurance, premiums are payable throughout the insured’s lifetime, and coverage continues until the insured’s death.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"A producer does not have the authority to change a policy or waive any of its provisions. The health provision that best describes this statement is called the","o":["Incontestable","Entire Contract","Time Limit on Certain Defenses","Grace Period"],"a":1,"e":"The Entire Contract provision states that the producer does NOT have the authority to change the policy or waive any of its provisions.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"An agent takes an individual Disability Income application, collects the appropriate premium, and issues the prospective insured a conditional receipt. The next step the insurance company will take is to:","o":["issue the policy only when the initial premium check has cleared","determine if the applicant is insurable by investigating family health history","determine if the applicant is an acceptable risk by completing standard underwriting procedures","issue the policy on a standard basis"],"a":2,"e":"With a conditional receipt, the insurance company will complete standard underwriting procedures before making a decision about whether to insure the applicant.","t":"Disability Income","k":"e","g":0},{"q":"K is the insured and P is the sole beneficiary on a life insurance policy. Both are involved in a fatal accident where K dies before P. Under the Common Disaster provision, which of these statements is true?","o":["Proceeds will be payable to K’s estate if P dies within a specified time","Proceeds will be paid to P’s estate","Proceeds will be divided equally between K’s and P’s estate","The courts will decide who will receive death benefits"],"a":0,"e":"Under the Common Disaster provision, proceeds will be payable to K’s estate if P dies within a specified time.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"Which of these are NOT an example of a Nonforfeiture option?","o":["Reduced Paid-up","Extended Term","Cash Surrender","Life Income"],"a":3,"e":"All of these are examples of Nonforfeiture options EXCEPT Life Income.","t":"Annuities, Settlement Options & Retirement","k":"e","g":0},{"q":"Which of the following is NOT included in the policy face?","o":["Free Look provision","Exclusions","Name of the insured","Name of the insurer"],"a":1,"e":"The exclusions section is NOT included in the policy face (first page of an insurance policy).","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"Under an individual Health Insurance policy, the Time Limit on Certain Defenses provision states that nonfraudulent misstatements first become incontestable two years","o":["from the date that the policy was issued","from the date of the sales appointment","from the date that the application was signed","from the date initial premium was collected"],"a":0,"e":"Under the Time Limit on Certain Defenses provision in an Individual Health Insurance Policy, nonfraudulent misstatements first become incontestable two years from the date of the policy was issued.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"What type of policy would offer a 40-year old the quickest accumulation of cash value?","o":["Straight whole life","20-pay life","30-pay life","Paid-up at 65"],"a":1,"e":"In this situation, a 20-pay Life policy offers the quickest accumulation of cash value.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"Which of these life insurance riders allows the applicant to have excess coverage?","o":["Automatic Premium Loan rider","Guarantee Insurability rider","Waiver of Premium rider","Term rider"],"a":3,"e":"Term riders allow an applicant to have excess life insurance coverage.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"When an insurance application is taken by a producer, which of these statements is true?","o":["The producer has the discretion to ask or not to ask any of the questions listed on the application","Any changes made on the application require the applicant’s initials","The applicant should have an attorney present during the application process","Any changes made on the application can later be initialed by the producer if the applicant is unavailable"],"a":1,"e":"The producer should have the applicant initial any changes made on the application.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"What provision in a life insurance policy states that the application is considered part of the contract?","o":["Incontestability provision","Policy Exclusions provision","Application provision","Entire Contract provision"],"a":3,"e":"The Entire Contract provision, found at the beginning of the policy, states that the policy document, the application (which is attached to the policy), and any attached riders constitute the entire contract.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"What is considered to be a characteristic of a Conditionally Renewable Health Insurance policy?","o":["Premiums may increase at time of renewal","Policy may be amended by insurer at any time","Premiums may increase at any time","Policy may be renewed at the discretion of the insured"],"a":0,"e":"A Conditionally Renewable Health Insurance policy can increase premiums at time of renewal.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"An insurance company normally has 2 years to contest information provided on an accident and health application. This 2 year period begins on the date that the:","o":["insurer dates the policy","producer completes the application","the first premium is paid","medical examination is given"],"a":0,"e":"An insurance company can usually contest the information contained in an accident and health application for two years from the date the insurance company dates the policy.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"Long Term Care policies will usually pay for eligible benefits using which of the following methods?","o":["Fee for service","Expense incurred","Respite","Delayed"],"a":1,"e":"Most long-term care policies pay on a reimbursement (or expense-incurred) basis, up to the policy limits.","t":"Long-Term Care","k":"e","g":0},{"q":"In an insurance contract, the insurer is the only party who makes a legally enforceable promise. What kind of contract is this?","o":["Unenforceable","Adhesion","Unilateral","Subrogation"],"a":2,"e":"Insurance contracts are unilateral. This means that only one party (the insurer) makes any kind of enforceable promise.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"When an insurance company sends a policy to the insured with an attached application, the element that makes the application part of the contract between the insured and the insurer is called the:","o":["Legal Contract clause","Insuring clause","Time Limit on Certain Defense provision","Entire Contract provision"],"a":3,"e":"The Entire Contract provision states that the application and policy contain all provisions and constitute the entire contract.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"K has a health policy that must be renewed by the insurer and the premiums can only be increased if applied to the entire class of insureds. This type of policy is considered:","o":["optionally renewable","conditionally renewable","noncancellable","guaranteed renewable"],"a":3,"e":"Guaranteed renewable is best described as a policy that must be renewed and premium rate increases can only be applied if for an entire class of insureds.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"When does a Probationary Period provision become effective in a health insurance contract?","o":["30 days after the policy’s inception","When a claim is submitted","When a covered loss occurs","At the policy’s inception"],"a":3,"e":"The probationary period begins when a policy goes into effect. During this period, no benefits will be paid under the policy.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"M has a Major Medical insurance policy with a $200 flat deductible and an 80% Coinsurance clause. If M incurs a $2,200 claim for an eligible medical expense, how much will M receive in payment for this claim?","o":["$1,760","$1,600","$2,000","$400"],"a":1,"e":"In this situation, $2,200 - $200 deductible x 80% = $1,600.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"Information obtained from a phone conversation to the proposed insured can be found in which of these reports?","o":["Attending physician’s report","Inspection report","Agent’s report","MIB report"],"a":1,"e":"An inspection report may include information obtained by a telephone call to the proposed insured.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"A student pilot can pay regular premium costs for her life insurance policy with the addition of which of the following?","o":["Accidental Death Benefit rider","Impairment rider","Aviation exclusion","Guaranteed Insurability rider"],"a":2,"e":"A student pilot can pay standard premium costs for her life insurance policy with the addition of an aviation exclusion.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"S filed a written Proof of Loss for a Disability Income claim on September 1. The insurance company did not respond to the claim. S can take legal action against the insurer beginning:","o":["21-Sep","1-Dec","16-Oct","1-Nov"],"a":3,"e":"The insured must wait 60 days after written proof of loss before legal action can be brought against the company.","t":"Disability Income","k":"e","g":0},{"q":"A(n) ________ contained in a life insurance policy states that the policy will NOT cover certain risks.","o":["elimination","exclusion","limitation","curtailment"],"a":1,"e":"An exclusion contained in a life insurance policy states that the policy will NOT cover certain risks.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"A(n) _______ _______ Life policy combines investment choices with a form of Term coverage","o":["Variable Term","Adjustable Universal","Straight Whole","Variable Universal"],"a":3,"e":"Variable Universal Life combines investment choices with a form of Term coverage.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"With Accidental Death and Dismemberment policies, what is the purpose of the Grace Period?","o":["Gives the policyowner additional time to provide proof of loss","Gives the policyowner additional time to pay overdue premiums","Gives the policyowner additional time to file a lawsuit","Gives the policyowner additional time to file a claim"],"a":1,"e":"The purpose of the Grace Period is to give the policyowner additional time to pay overdue premiums.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"When an insured changes to a more hazardous occupation, which disability policy provision allows an insurer to adjust policy benefits and rates?","o":["Change of occupation provision","Relation of earnings to insurance provision","Entire contract provisions","Conformity of state statutes provision"],"a":0,"e":"The change of occupation provision allows an insurer to adjust policy benefits and/or rates if the insured has changed to a more hazardous occupation.","t":"Disability Income","k":"e","g":0},{"q":"A Disability Income policy that only the policyowner can terminate and which the rates will never go up is considered to be","o":["Noncancellable","Guaranteed Renewable","Optionally Renewable","Cancellable"],"a":0,"e":"A Disability Income Policy that only the policyowner can terminate and on which the rates will never increase is a Noncancellable policy.","t":"Disability Income","k":"e","g":0},{"q":"What advantage does the renewability feature give to a term policy?","o":["The insured may borrow against the cash value","The insured may extend the coverage period","The insured may apply for this policy with little or no underwriting","The insured may extend the coverage period at no additional cost"],"a":1,"e":"The advantage a renewability feature gives to the insured is it allows him/her to extend the coverage period. Usually a premium increase is involved upon renewal.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"____ of personal life insurance premiums is usually deductible for federal income tax purposes.","o":["75%","100%","50%","0%"],"a":3,"e":"In general, personal life insurance premiums are NOT deductible for federal income tax purposes.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"A Business Overhead Expense policy:","o":["covers business expenses such as rent and utilities","covers any loss of income by the business owner","reimburses the company for any reduction in sales due to the owner’s disability","covers employee wages only"],"a":0,"e":"Business Overhead Expense insurance covers eligible expenses for utilities, rent, and staff.","t":"Disability Income","k":"e","g":0},{"q":"An insurance company would MOST likely pay benefits under an Accidental Death and Dismemberment policy for which of the following losses?","o":["Loss of eyesight due to an accidental injury","Partial paralysis due to a stroke","Loss of life due to a heart attack","Loss of the spleen due to an accidental injury"],"a":0,"e":"In this situation, an Accidental Death and Dismemberment policy will most likely pay benefits for loss of eyesight due to an accidental injury.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"Additional coverage can be added to a Whole Life policy by adding a(n):","o":["decreasing term rider","payor rider","automatic premium loan rider","accelerated benefit rider"],"a":0,"e":"A decreasing term rider can add additional coverage to a whole life policy.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"P is insured under a basic cancer plan. Which of the following conditions would be covered under this plan?","o":["Operation for a malignant tumor","Stroke","Heart Attack","Broken leg"],"a":0,"e":"A basic cancer plan would pay the claim if the insured needed surgery for a malignant tumor.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"A life insurance policy would be considered a wagering contract WITHOUT:","o":["agent solicitation","insurable interest","premium payment","constructive delivery"],"a":1,"e":"Without insurable interest, a life insurance policy would be considered a wagering contract.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"K failed to pay a renewal premium within the time granted by the insurer. K then sends in a payment which the insurer subsequently accepts. Which policy provision specifies that coverage may be restored in this situation?","o":["Reinstatement","Free-look","Grace Period","Consideration"],"a":0,"e":"In this situation, coverage may be restored under the reinstatement provision.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"What type of renewability guarantees premium rates and renewability?","o":["Optionally renewable","Warrantied renewable","Noncancellable","Conditionally renewable"],"a":2,"e":"Noncancellable policies provides guaranteed renewability and premium rates.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"Which of the following are NOT managed care organizations?","o":["Medical Information Bureau (MIB)","Health Maintenance Organization (HMO)","Preferred Provider Organization (PPO)","Point-of-Service plan (POS)"],"a":0,"e":"All of the following entities are managed care organizations EXCEPT for the MIB (Medical Information Bureau).","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"Which of these circumstances is a Business Disability Buy-Sell policy designed to help in the sale of a business?","o":["Company becoming insolvent","Death of the business owner","Key employee becoming disabled","Business owner becoming disabled"],"a":3,"e":"A Business Disability Buy-Sell policy is designed to assist in the sale of a business when one of the owners becomes disabled.","t":"Disability Income","k":"e","g":0},{"q":"K has a life insurance policy where her husband is beneficiary and her daughter is contingent beneficiary. Under the Common Disaster clause, if K and her husband are both killed in an automobile accident, where would the death proceeds be directed?","o":["K’s estate","Trust fund","Daughter","Husband’s estate"],"a":2,"e":"With a common disaster provision, a policyowner can be sure that if both the insured and the primary beneficiary die within a short period of time, the death benefits will be paid to the contingent beneficiary.","t":"Life Insurance Policies & Riders","k":"e","g":0},{"q":"T owns an Accident & Health policy and notifies her insurance company that she has chosen a less hazardous occupation. Under the Change of Occupation provision, which of the following actions may her insurance company take?","o":["Increase her policy’s coverage amount","Allow her to take a tax deduction on unearned premiums","Nothing","Decrease her policy’s coverage amount"],"a":0,"e":"Under the Change of Occupation provision in an Accident & Health policy, if the insured notifies the insurance company of a less hazardous occupation, the insurance company may increase the policy’s coverage.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"After an insured gives notice of loss, what must he/she do if the insurer does not furnish forms?","o":["File written proof of loss","File a lawsuit","Contact the insurer again requesting forms","Nothing"],"a":0,"e":"The insured may file written proof of loss in any form if the insurer does NOT furnish forms after the insured gives notice of loss.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"Q purchases a $500,000 life insurance policy and pays $900 in premiums over the first six months. Q dies suddenly and the beneficiary is paid $500,000. This exchange of unequal values reflects which of the following insurance contract features?","o":["Consideration","Unilateral","Adhesion","Aleatory"],"a":3,"e":"Insurance contracts are aleatory in that the amount the insured will pay in premiums is unequal to the amount that the insurer will pay in the event of a loss.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"According to the Time Payment of Claims provision, the insurer must pay Disability Income benefits no less frequently than which of the following options?","o":["Quarterly","Monthly","Annually","Semiannually"],"a":1,"e":"The time of payment for claims is usually specified in different policies as 60 days, 45 days, or 30 days. However, if the claim involves disability income benefits, the benefits must be paid not less frequently than monthly.","t":"Disability Income","k":"e","g":0},{"q":"Which of the following is considered to be the time period after a Health Policy is issued, during which no benefits are provided for illness?","o":["Probationary Period","Incontestable Period","Trial Period","Subrogation Period"],"a":0,"e":"The Probationary Period the period of time between the effective date of a Health Policy and the date of coverage begins for sickness.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"An individual Disability Income insurance applicant may be required to submit all of the following information, EXCEPT:","o":["gross income","occupation","spouse’s occupation","medical history"],"a":2,"e":"In this situation, a spouse’s occupation is not necessary for the application.","t":"Disability Income","k":"e","g":0},{"q":"In regards to representations or warranties, which of these statements is TRUE?","o":["Warranties are statements considered to be true to the best of the applicant’s belief","Representations are statements guaranteed to be true in every respect","If material to the risk, false representations will NOT void a policy","If material to the risk, false representations will void a policy"],"a":3,"e":"In insurance, false representations will void a policy if they are material to the risk.","t":"Contracts, Applications & Underwriting","k":"e","g":0},{"q":"P is a Major Medical policyowner who is hospitalized as a result of injuries sustained from participating in a carjacking. How will the insurer most likely handle this claim?","o":["Claim will be denied","Claim will be denied and policy terminated","Claim will be paid","Claim will be partially paid"],"a":0,"e":"If a person is injured while committing an illegal act, health insurance will not cover the expense of the injury.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"Non-occupational disability coverage is designed for:","o":["24 hour protection","sole proprietors and self-employed individuals","those who are exempt from Workers' Compensation coverage","employees who suffer non-work related disabilities, since work-related disabilities are covered by Workers' Compensation"],"a":3,"e":"Non-occupational disability coverage is designed for employees who suffer non-work related disabilities, since work-related disabilities are covered by Workers' Compensation.","t":"Disability Income","k":"e","g":0},{"q":"The ________ clause identifies which losses resulting from an accident or sickness are insured by the policy.","o":["Insuring","Benefit","Payment","Identification"],"a":0,"e":"The Insuring clause identifies which losses resulting from an accident or sickness are insured by the policy.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"G is an accountant who has ten employees and is concerned about how the business would survive financially if G became disabled. The type of policy which BEST addresses this concern is:","o":["Business Overhead Expense","Disability Income","Key Employee Life","Contributory"],"a":0,"e":"A Business Overhead Expense policy’s purpose is to cover certain overhead expenses that continue when the business owner is disabled.","t":"Disability Income","k":"e","g":0},{"q":"The insured and insurance company will share the cost of covered losses under which health policy feature?","o":["Subrogation clause","Payment of Claims provision","Share clause","Assignment provision"],"a":1,"e":"In a health policy, the Payment of Claims provision states that the insured and insurance company will share the cost of covered losses.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"How does group insurance differ from individual insurance?","o":["Premiums are higher","Pre-existing conditions not covered","Evidence of insurability is required","Premiums are lower"],"a":3,"e":"Group insurance differs from individual insurance in that it provides coverage at a lower cost.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"The provision that defines to whom the insurer will pay benefits to is called:","o":["Payment of Claims","Entire Contract","Claim Forms","Proof of Loss"],"a":0,"e":"The Payment of Claims provision in a Health Insurance policy states to whom claims will be paid.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"A CEO’s personal assistant suffered injuries at home and as a result, was unable to work for four months. Which type of policy will pay a monthly benefit to the personal assistant?","o":["Disability Income","Key Employee","Major Medical","Business Overhead Expense"],"a":0,"e":"In this situation, a Disability Income policy would pay monthly benefits.","t":"Disability Income","k":"e","g":0},{"q":"A disability elimination period is best described as a:","o":["eligibility period","time deductible","dollar deductible","probation period"],"a":1,"e":"The best way to describe a disability elimination period is a \"time deductible\".","t":"Disability Income","k":"e","g":0},{"q":"A 45 year-old woman won $100,000 in a scratch-off lottery ticket. She purchased an annuity that will pay her $1,500 per month beginning at age 60. Which of these annuities did this woman purchase?","o":["Immediate Variable annuity","Deferred Fixed annuity","Variable annuity","Immediate annuity"],"a":1,"e":"Because the annuity will pay a fixed amount beginning at a future date, it is considered a Deferred Fixed annuity.","t":"Annuities, Settlement Options & Retirement","k":"e","g":0},{"q":"If an insurance company issues a Disability Income policy that it cannot cancel or for which it cannot increase premiums, the type of renewability that best describes this policy is called:","o":["conditionally renewable","guaranteed renewable","cancellable","noncancellable"],"a":3,"e":"A noncancellable policy is one which the insurance company cannot cancel and which premiums cannot be increased.","t":"Disability Income","k":"e","g":0},{"q":"An individual who purchases a Life annuity is given protection against:","o":["inflation","the risk of living longer than expected","the risk of dying prematurely","the risk of not having enough retirement income"],"a":1,"e":"A Life annuity offers protection against the risk of living longer than anticipated.","t":"Annuities, Settlement Options & Retirement","k":"e","g":0},{"q":"Which of the following actions may NOT be taken by an insurance company to insure a substandard applicant for disability income coverage?","o":["Lengthen the contestability period","Limit the type of coverage","Do not cover the substandard condition","Increase the premium"],"a":0,"e":"An insurer may legally take all of these actions to provide disability income coverage to a substandard applicant EXCEPT \"Lengthen the contestability period\".","t":"Disability Income","k":"e","g":0},{"q":"A noncontributory group term life plan is characterized by:","o":["the cost of the plan is shared by both employer and employee","the entire cost of the plan is paid for by the employer","the entire cost of the plan is paid for by the employee","both employer and employee must provide evidence of insurability"],"a":1,"e":"When an employer provides noncontributory group term life insurance, the employer pays the entire cost of the plan.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"The difference between group insurance and blanket health policies is:","o":["Blanket health policies do not issue certificates","Group health plans may be issued to an airline to cover its passengers","Blanket health policies are sometimes called wholesale plans","Group health policies do not issue certificates"],"a":0,"e":"Certificates are not issued in blanket policies.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"Periodic health claim payments MUST be made at least:","o":["monthly","daily","weekly","annually"],"a":0,"e":"Under an individual health policy, periodic claim payments must be made at least monthly.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"Variable annuities may invest premiums in each of the following, EXCEPT:","o":["Money Market securities","Common Stock","Junk bonds","Insurer’s corporate business account"],"a":3,"e":"Variable annuities may invest premiums in each of these EXCEPT the \"Insurer’s corporate business account\".","t":"Annuities, Settlement Options & Retirement","k":"e","g":0},{"q":"K has inherited a large sum of money. K purchases an annuity with this sum on July 1, and starts receiving payments August 1. These payments will continue for as long as she and her spouse lives. Which type of annuity did K purchase?","o":["Flexible Premium with Period Certain","Single Premium Deferred Annuity with Period Certain","Single Premium Immediate Joint with Survivor Annuity","Flexible Premium with Survivor Annuity"],"a":2,"e":"This annuity was purchased with one payment and begins immediately. It also covers K and her spouse for the rest of their lives. This annuity is classified as Single Premium Immediate Joint with Survivor Annuity.","t":"Annuities, Settlement Options & Retirement","k":"e","g":0},{"q":"Which of these types of coverage is best described as a short term medical policy?","o":["interim coverage","transitional coverage","provisional coverage","conversion coverage"],"a":0,"e":"A short term medical policy is best described as interim coverage.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"The provision in a health insurance policy that suspends premiums being paid to the insurer while the insured is disabled is called the:","o":["Elimination Period","Probation Period","Grace Period","Waiver of Premium"],"a":3,"e":"The Waiver of Premium provision in a health insurance contract suspends the insurer’s right to receive premiums during a covered period of disability.","t":"Disability Income","k":"e","g":0},{"q":"S, while in the process of converting her group life insurance to an individual policy, dies. What happens to the claim her beneficiary submits?","o":["No benefits are payable under the Master contract","Benefits less required premium are payable under the converted policy","Full benefits are payable under the Master contract","Full benefits are payable under the converted policy"],"a":2,"e":"An individual is covered under the group policy during the conversion period.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"What is considered to be a characteristic of an immediate annuity?","o":["Normally tied to a specific equity or stock index","Benefit payments start within 5 years of initial purchase","Benefit payments start within one payment period of purchase","Periodical contributions begin immediately"],"a":2,"e":"An immediate annuity is designed to make its first benefit payment to the annuitant at one payment interval from the date of purchase.","t":"Annuities, Settlement Options & Retirement","k":"e","g":0},{"q":"Which type of plan normally includes hospice benefits?","o":["Managed care plans","Short-term disability plans","Workers' Compensation","Group life plans"],"a":0,"e":"Hospice benefits are typically included in managed care plans.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"The Health Insurance Portability and Accountability Act (HIPAA) gives privacy protection for","o":["insolvency","health information","over insurance","financial information"],"a":1,"e":"The Health Insurance Portability and Accountability Act (HIPAA) provides privacy protection for health information.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"In a 501(c)(9) Trust, the trust must be controlled by:","o":["Its member","An independent trustee","Fiduciary","All of the above"],"a":3,"e":"A 501(c)(9) Trust, the trust must be controlled by Its member, An independent trustee, and a Fiduciary.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"J is covered by an employer-provided group health insurance plan, which covers employees in multiple states. This plan is governed by the laws of which state?","o":["Where the certificate of coverage was mailed to","Where most of the employees reside","Where the insurer’s home office is located","Where the master contract was issued"],"a":3,"e":"Group health insurance contracts providing coverage for employees in more than one state are usually controlled by the laws of the state where the state the master contract is issued.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"Which of the following types of organizations are prepaid group health plans, where members pay in advance for the services of participating physicians and hospitals that have agreements?","o":["PPO","HMO","POS","MEWA"],"a":1,"e":"A Health Maintenance Organization (HMO) is a prepaid group health plan, where members pay in advance for the services of participating physicians and hospitals that have agreements.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"Which of the following reimburses its insureds for covered medical expenses?","o":["Health maintenance organizations","Service providers","Commercial insurers","Preferred provider organizations"],"a":2,"e":"Commercial insurance companies function on the reimbursement approach. Policyowners obtain medical treatment from whatever source they feel is most appropriate and submit their charges to their insurer for reimbursement.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"Which of the following is NOT a characteristic of Preferred Provider Organizations (PPOs)?","o":["PPO’s are only available through social insurance programs.","PPOs provide equal benefits and costs for services obtained in-network and out of network.","PPO’s operate on a fee-for-service basis.","PPOs are available for both individual and group plans."],"a":1,"e":"Members are not mandated to use the PPO. However, if they go outside the PPO for health care services, benefits are reduced and costs increase.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"The situation in which a group of physicians are salaried employees and conduct business in an HMO facility is called a(n):","o":["open panel","co-op panel","capitation panel","closed panel"],"a":3,"e":"A closed panel is when an HMO is represented by a group of physicians who are salaried employees and work out of the HMO’s facility.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"The premiums for continuing Medical Expense insurance coverage under COBRA are paid for by the:","o":["employee","former employer","State Guaranty Association","current employer"],"a":0,"e":"The employee pays the premiums for continuing health coverage under COBRA.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"The provision in a Group Health policy that allows the insurer to postpone coverage for a covered illness 30 days after the policy’s effective date is referred to as the:","o":["Elimination Period","Postponement Period","Waiting Period","Grace Period"],"a":2,"e":"The waiting period in a Group Health policy gives an insurance company the rights to delay coverage for a covered sickness for a specified number of days after the effective date of the policy.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"Under what system do a group of doctors and hospitals in a designated area contract with an insurer to provide services at a prearranged cost to the insured?","o":["EPO","PLHSO","HMO","PPO"],"a":3,"e":"PPO. Under a Preferred Provider Organization (PPO), a group of doctors and hospitals in a designated area contract with an insurer to provide services at a prearranged cost to the insured.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"Which of the following statements is true about most Blue Cross/Blue Shield organizations?","o":["They are the same as private insurance companies","They are nonprofit organizations","They are federally sponsored","They are owned by hospitals and physicians"],"a":1,"e":"Most Blue Cross/Blue Shield organizations are considered to be nonprofit.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"Which of the following organizations would make reimbursement payments directly to the insured individual for covered medical expenditures?","o":["Administrative-services-only plan","Preferred provider organization","Commercial insurer","Health maintenance organization"],"a":2,"e":"Commercial health insurance companies use the reimbursement approach, which allows policyowners to seek medical treatment then submit the charges to the insurer for reimbursement.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"The document that gives a health insurance company the authority to pay benefits directly to an insured’s health care provider is the:","o":["Designation Provision","Assignment of Benefits","Proof of Loss","Insuring Clause Document"],"a":1,"e":"The Assignment of Benefits document provides authorization for an insured’s health plan to pay benefits directly to the health care provider","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"Taft-Hartley Trusts are also known as:","o":["Lodges","Trade associations","Negotiated Trusteeships","501(c)(9)"],"a":2,"e":"Taft-Hartley Trusts are also known as \"Negotiated Trusteeships.\"","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"A group major medical policyholder that provides benefits on a self- funding basis may limit its total liability for claims by purchasing","o":["Supplementary coverage","Coinsurance","A stop-loss contract","A deductible"],"a":0,"e":"The term for this type of agreement that caps obligations is stop-loss.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"MEWA (Multiple Employer Welfare Arrangement) permits?","o":["Large affiliated employers to insure their members","Small affiliated employers to insure their members","Large non-affiliated employers to insure their members","Small non-affiliated employers to insure their members"],"a":3,"e":"Multiple Employer Welfare Arrangement permits small non-affiliated employers to insure their members.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"A typical result of a concurrent review is that","o":["Emergency admissions are not eligible for reimbursement","Overall plan costs are increased","The deductible and coinsurance are waived","The length of stay in the hospital is monitored"],"a":3,"e":"A typical result of a concurrent review is that the length of stay in the hospital is monitored.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"COBRA laws allows continuation of health coverage for:","o":["business owners and management","dependents only","employees and their dependents","employees only"],"a":2,"e":"COBRA laws allow continuation of group health coverage for employees and their dependents if their employment is terminated.","t":"Group, Managed Care & Specialty Plans","k":"e","g":0},{"q":"A Hospital/Surgical Expense policy was purchased for a family of four in March of 2013. The policy was issued with a $500 deductible and a limit of four deductibles per calendar year. Two claims were paid in September 2013, each incurring medical expenses in excess of the deductible. Two additional claims were filed in 2014, each in excess of the deductible amount as well. What would be this family’s out-of-pocket medical expenses for 2013?","o":["$2,000","$1,000","$500","$1,500"],"a":1,"e":"In this situation, the insured’s maximum out-of-pocket expenses for 2013 would be $1,000.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"The individual Health Insurance policy that offers the broadest protection is a(n) _______ _______ policy","o":["Surgical Benefit","Indemnity Medical","Hospital Expense","Major Medical"],"a":3,"e":"Major Medical provides the broadest protection.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"Which provision allows a portion of any used medical benefits to be restored following a particular amount of benefit has been used, or after the policy has been in effect for a particular period of time?","o":["Medical offset benefit","Restoration of used benefit","Reimbursement benefit","Restoration of unused benefit"],"a":1,"e":"A restoration of used benefit provision allows a portion of any used medical benefits to be restored following a particular amount of benefit has been used, or after the policy has been in effect for a particular period of time.","t":"Health Insurance Provisions","k":"e","g":0},{"q":"All of the following statements about Major Medical benefits are true, EXCEPT:","o":["Benefits have no maximum limit","Benefits are generally expressed as a percentage
